<script id="preview-media-isolation">
// VideoTogether 3.0.23 logs "limited" on dense Studio play/pause/seeked events.
// Opt this composition's media out; leave framework listeners and console intact.
(function(){
 function excludePreviewVideos(){
  const listener=window.videoTogetherExtension?.VideoClickedListener;
  document.querySelectorAll('#root video').forEach(video=>{
   video.VideoTogetherDisabled=true;
   if(typeof listener==='function'){
    ['play','pause','seeked'].forEach(type=>video.removeEventListener(type,listener,false));
   }
  });
 }
 // Run after both observers: the extension also hooks dynamically mounted videos.
 const observer=new MutationObserver(()=>queueMicrotask(excludePreviewVideos));
 observer.observe(document.documentElement,{childList:true,subtree:true});
 excludePreviewVideos();
})();
</script>
