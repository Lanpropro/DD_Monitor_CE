<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252c36"/>
      <stop offset="0.55" stop-color="#171b22"/>
      <stop offset="1" stop-color="#0f1116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a1d6"/>
      <stop offset="0.52" stop-color="#756bf2"/>
      <stop offset="1" stop-color="#fb7299"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="992" height="992" rx="210" fill="url(#background)"/>
  <rect x="26" y="26" width="972" height="972" rx="200" fill="none"
        stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- Three offset panes distinguish CE and echo the app's multi-room video wall. -->
  <g fill="none" stroke="url(#accent)" stroke-width="18">
    <rect x="274" y="128" width="610" height="540" rx="58" opacity="0.28"/>
    <rect x="214" y="172" width="650" height="550" rx="60" opacity="0.48"/>
    <rect x="104" y="222" width="806" height="496" rx="64" opacity="0.96"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="22" opacity="0.14"
     filter="url(#softGlow)">
    <rect x="104" y="222" width="806" height="496" rx="64"/>
  </g>

  <!-- DD remains the inherited primary mark. The paths avoid font dependencies. -->
  <path fill="#f5f7fa" fill-rule="evenodd" d="
    M154 292 H314
    C434 292 502 365 502 474
    C502 583 434 656 314 656
    H154 Z
    M246 382 V566 H310
    C372 566 408 531 408 474
    C408 417 372 382 310 382 Z"/>
  <path fill="#f5f7fa" fill-rule="evenodd" d="
    M530 292 H690
    C810 292 878 365 878 474
    C878 583 810 656 690 656
    H530 Z
    M622 382 V566 H686
    C748 566 784 531 784 474
    C784 417 748 382 686 382 Z"/>

  <!-- A restrained seam carries the app's cyan/pink identity into the DD mark. -->
  <path d="M466 332 C497 374 510 421 510 474 C510 527 497 574 466 616"
        fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round"/>

  <!-- CE is a deliberate second-level mark, not a tiny corner suffix. -->
  <g fill="url(#accent)">
    <path d="M424 740 H376 C314 740 278 780 278 844 C278 908 314 948 376 948 H424 V894 H382
             C349 894 334 876 334 844 C334 812 349 794 382 794 H424 Z"/>
    <path d="M476 740 H694 V794 H534 V818 H674 V870 H534 V894 H694 V948 H476 Z"/>
  </g>
</svg>
