<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <title>view-03</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      window.__timelines = window.__timelines || {};
      (async function () {
        const log = (m) => {
          document.title = String(m).slice(0, 180);
          const d = document.createElement("pre");
          d.id = "diag";
          d.textContent = String(m);
          document.body.appendChild(d);
        };
        try {
          const stage = document.getElementById("stage");
          const t = Number(new URLSearchParams(location.search).get("t") || "0");
          const res = await fetch("/compositions/frames/03-layout-1to4.html");
          const html = await res.text();
          const host = document.createElement("div");
          host.innerHTML = html;
          const tpl = host.querySelector("template") || host.children[0];
          if (!tpl || tpl.tagName !== "TEMPLATE")
            throw new Error(
              "no template; status=" + res.status + " len=" + html.length + " kids=" + host.children.length +
              " tags=" + Array.from(host.children).map((c) => c.tagName).join(",") +
              " head=" + JSON.stringify(html.slice(0, 80)),
            );
          stage.appendChild(tpl.content.cloneNode(true));

          stage.querySelectorAll("style").forEach((s) => document.head.appendChild(s));

          const srcs = Array.from(stage.querySelectorAll("script")).filter((s) => s.getAttribute("src"));
          const inlines = Array.from(stage.querySelectorAll("script")).filter((s) => !s.getAttribute("src"));
          for (const s of srcs) {
            await new Promise((ok, bad) => {
              const n = document.createElement("script");
              n.src = s.getAttribute("src");
              n.onload = ok;
              n.onerror = () => bad(new Error("gsap load failed"));
              document.head.appendChild(n);
            });
          }
          for (const s of inlines) {
            const n = document.createElement("script");
            n.textContent = s.textContent;
            document.head.appendChild(n);
          }

          const tl = window.__timelines["03-layout-1to4"];
          if (!tl) throw new Error("timeline not registered");
          tl.pause();
          tl.seek(t, false);
          await new Promise((r) => requestAnimationFrame(r));
          tl.seek(t, false);
          log("ready t=" + t + " dur=" + tl.duration());
        } catch (e) {
          log("FAIL " + (e && e.message ? e.message : e));
        }
      })();
    </script>
  </body>
</html>
