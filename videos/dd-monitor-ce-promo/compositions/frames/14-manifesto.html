  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (51.0–52.0s → 0.00–1.00): zoom-through into the near-white
         field. The flat ground drives in past the lens and settles; the headline
         lands with the ONE move this whole beat is allowed — a single slide-up
         crossfade of the line, no per-word stagger, no second push. ---- */
      tl.fromTo(
        ".ddf14-field",
        { scale: 1.13, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.46, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        ".ddf14-head",
        { y: 26, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.18,
      );

      /* ---- Scene 2 (52.0–53.0s → 1.00–2.00): the hero prop pays off — the 12
         chips settle in two groups (row by row) inside ~0.6s, then the real
         capture drops into the lower right at 0.5 as the physical reference. ---- */
      gsap.utils.toArray(".ddf14-chip").forEach(function (el, i) {
        var group = i < 6 ? 0 : 1;
        tl.fromTo(
          el,
          { y: 15, opacity: 0, scale: 0.94 },
          { y: 0, opacity: 1, scale: 1, duration: 0.36, ease: "power3.out" },
          1.02 + group * 0.18 + (i % 6) * 0.02,
        );
      });
      tl.fromTo(
        ".ddf14-thumb",
        { y: 13, opacity: 0 },
        { y: 0, opacity: 0.5, duration: 0.46, ease: "power3.out" },
        1.52,
      );

      /* ---- Scene 3 (53.0–55.5s → 2.00–4.50): the subtitle lands and the shot
         goes completely still. From 2.54s to the last frame not one pixel
         moves — no highlight, no breathing, no drift. That 2s of stillness is
         what the density of the previous beats bought. Transform + opacity
         only: the tracked 0.16em setting is authored statically, never tweened
         (a text-reflow tween snaps glyph positions under frame capture). ---- */
      tl.fromTo(
        ".ddf14-sub",
        { y: 15, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.04,
      );

      /* pin the timeline to the fixed 4.5s so the held read runs to the end
         (the root transition is the exit; this frame authors none) */
      tl.to({}, { duration: 0.2 }, 4.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["14-manifesto"] = tl;
      tl.seek(0);
    })();
