<template>
  <style>
    /* 系统自带字族：用 local() 声明，满足 font_family_without_font_face 校验 */
    @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); font-display: block; }
    /* 系统自带字族：用 local() 声明，满足 font_family_without_font_face 校验 */
    @font-face { font-family: "Segoe UI"; src: local("Segoe UI"); font-display: block; }
    /* ------------------------------------------------------------------
       15-outro — field-black · logo 拼装 → 定格 → 仓库地址
       The official mark assets/logo.svg is INLINED here — every path keeps
       its original d / fill / stroke / opacity / gradient byte-identical
       (only ids got a ddf15- prefix so parallel frames cannot collide).
       The assemble is therefore real geometry, not a redraw:
         · three offset panes   — svg-path-draw via strokeDashoffset
         · the two D glyphs     — luminance-mask wipe, left → right
         · the CE group         — masked wipe + a travelling accent band
         · the seam between DD  — svg-path-draw
       No replacement mark, no restyle, no re-colouring. The logo's own
       #00a1d6 → #756bf2 → #fb7299 gradient is brand asset colour and is
       reproduced verbatim.
       ------------------------------------------------------------------ */
    @font-face {
      font-family: "Microsoft YaHei UI";
      font-style: normal;
      font-weight: 400;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("msyh");
    }
    @font-face {
      font-family: "Microsoft YaHei UI";
      font-style: normal;
      font-weight: 600;
      src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"), local("msyhbd");
    }
    @font-face {
      font-family: "Microsoft YaHei UI";
      font-style: normal;
      font-weight: 700;
      src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"), local("msyhbd");
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ——— flat field-black ground: the base field, nothing on it ——— */
    .ddf15-field {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      background: #0d0e10;
      will-change: opacity;
    }

    /* ——— the lockup: logo above wordmark above URL, centred ——— */
    .ddf15-stage {
      position: absolute;
      left: 0;
      right: 0;
      top: 8.6cqw;
      text-align: center;
      opacity: 0;
      will-change: transform, opacity;
    }
    .ddf15-logo {
      width: 19cqw;
      height: auto;
      display: inline-block;
      vertical-align: top;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .ddf15-wordmark {
      margin: 1.35cqw 0 0 0;
      font-size: 3.4cqw;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: 0.02em;
      text-indent: 0.02em;
      color: #f1f2f5;
      will-change: transform, opacity;
    }
    .ddf15-url {
      margin: 1.3cqw 0 0 0;
      font-size: 1.9cqw;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
      color: rgba(241, 242, 245, 0.55);
      will-change: transform, opacity;
    }
  </style>

  <div id="root" data-composition-id="15-outro" data-start="0" data-duration="4.5" data-width="1920" data-height="1080">
    <!-- scene field: field-black, flat, no texture -->
    <div class="clip ddf15-field" data-start="0" data-duration="4.5" data-track-index="0"></div>

    <!-- the lockup: the official mark, assembled, then the wordmark + URL -->
    <div class="clip ddf15-stage" data-start="0" data-duration="4.5" data-track-index="1">
      <svg
        class="ddf15-logo"
        xmlns="http://www.w3.org/2000/svg"
        width="1024"
        height="1024"
        viewBox="0 0 1024 1024"
        role="img"
        aria-label="DD监控室CE"
      >
        <defs>
          <linearGradient id="ddf15-background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#252c36" />
            <stop offset="0.55" stop-color="#171b22" />
            <stop offset="1" stop-color="#0f1116" />
          </linearGradient>
          <linearGradient id="ddf15-accent" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#00a1d6" />
            <stop offset="0.52" stop-color="#756bf2" />
            <stop offset="1" stop-color="#fb7299" />
          </linearGradient>
          <filter id="ddf15-softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" />
          </filter>

          <!-- D-glyph wipe: a hard white ledge the timeline drives left → right -->
          <mask id="ddf15-d1" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
            <rect x="0" y="0" width="0" height="1024" fill="#ffffff" />
          </mask>
          <mask id="ddf15-d2" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
            <rect x="0" y="0" width="0" height="1024" fill="#ffffff" />
          </mask>

          <!-- CE: same wipe ledge, plus a travelling accent band for the "light up" -->
          <mask id="ddf15-ce" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
            <rect x="0" y="0" width="0" height="1024" fill="#ffffff" />
          </mask>
          <linearGradient id="ddf15-ceglow" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="850" y2="0">
            <stop class="ddf15-g0" offset="0" stop-color="#000000" />
            <stop class="ddf15-g1" offset="0.02" stop-color="#000000" />
            <stop class="ddf15-g2" offset="0.26" stop-color="#ffffff" />
            <stop class="ddf15-g3" offset="0.5" stop-color="#ffffff" />
            <stop class="ddf15-g4" offset="0.74" stop-color="#000000" />
            <stop class="ddf15-g5" offset="1" stop-color="#000000" />
          </linearGradient>
          <mask id="ddf15-ceglowmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
            <rect x="0" y="0" width="1024" height="1024" fill="url(#ddf15-ceglow)" />
          </mask>
        </defs>

        <rect x="16" y="16" width="992" height="992" rx="210" fill="url(#ddf15-background)" />
        <rect
          x="26"
          y="26"
          width="972"
          height="972"
          rx="200"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.07"
          stroke-width="4"
        />

        <!-- Three offset panes distinguish CE and echo the app's multi-room video wall.
             Drawn stroke-by-stroke, outermost first. -->
        <g class="ddf15-panes" fill="none" stroke="url(#ddf15-accent)" stroke-width="18">
          <rect class="ddf15-pane ddf15-pane-1" x="274" y="128" width="610" height="540" rx="58" opacity="0.28" />
          <rect class="ddf15-pane ddf15-pane-2" x="214" y="172" width="650" height="550" rx="60" opacity="0.48" />
          <rect class="ddf15-pane ddf15-pane-3" x="104" y="222" width="806" height="496" rx="64" opacity="0.96" />
        </g>
        <g class="ddf15-panes-glow" fill="none" stroke="url(#ddf15-accent)" stroke-width="22" opacity="0.14" filter="url(#ddf15-softGlow)">
          <rect class="ddf15-pane ddf15-pane-4" x="104" y="222" width="806" height="496" rx="64" />
        </g>

        <!-- DD remains the inherited primary mark. The paths avoid font dependencies.
             Wiped in from left to right. -->
        <path
          class="ddf15-d1"
          fill="#f5f7fa"
          fill-rule="evenodd"
          mask="url(#ddf15-d1)"
          d="
    M154 292 H314
    C434 292 502 365 502 474
    C502 583 434 656 314 656
    H154 Z
    M246 382 V566 H310
    C372 566 408 531 408 474
    C408 417 372 382 310 382 Z"
        />
        <path
          class="ddf15-d2"
          fill="#f5f7fa"
          fill-rule="evenodd"
          mask="url(#ddf15-d2)"
          d="
    M530 292 H690
    C810 292 878 365 878 474
    C878 583 810 656 690 656
    H530 Z
    M622 382 V566 H686
    C748 566 784 531 784 474
    C784 417 748 382 686 382 Z"
        />

        <!-- A restrained seam carries the app's cyan/pink identity into the DD mark. -->
        <path
          class="ddf15-seam"
          d="M466 332 C497 374 510 421 510 474 C510 527 497 574 466 616"
          fill="none"
          stroke="url(#ddf15-accent)"
          stroke-width="13"
          stroke-linecap="round"
        />

        <!-- CE is a deliberate second-level mark, not a tiny corner suffix.
             Wiped + lit. -->
        <g class="ddf15-ce" fill="url(#ddf15-accent)" mask="url(#ddf15-ce)">
          <path
            d="M424 740 H376 C314 740 278 780 278 844 C278 908 314 948 376 948 H424 V894 H382
             C349 894 334 876 334 844 C334 812 349 794 382 794 H424 Z"
          />
          <path d="M476 740 H694 V794 H534 V818 H674 V870 H534 V894 H694 V948 H476 Z" />
        </g>
        <!-- the light that travels across CE as it comes up -->
        <g class="ddf15-celight" fill="#ffffff" mask="url(#ddf15-ceglowmask)">
          <path
            d="M424 740 H376 C314 740 278 780 278 844 C278 908 314 948 376 948 H424 V894 H382
             C349 894 334 876 334 844 C334 812 349 794 382 794 H424 Z"
          />
          <path d="M476 740 H694 V794 H534 V818 H674 V870 H534 V894 H694 V948 H476 Z" />
        </g>
      </svg>

      <div class="ddf15-wordmark">DD监控室CE</div>
      <div class="ddf15-url">github.com/Lanpropro/DD_Monitor_CE</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var stage = document.querySelector(".ddf15-stage");
      /* the travelling light across CE does not exist until Scene 2 */
      gsap.set(".ddf15-celight", { opacity: 0 });

      /* ---- Scene 1 (55.5–56.7s → 0.00–1.20): crossfade out of the white field
         into field-black, and the three offset panes draw themselves — OUTERMOST
         FIRST — as one continuous pen trace. Real measured geometry. ---- */
      tl.fromTo(
        "#root",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        stage,
        { opacity: 0, scale: 1.03 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" },
        0.1,
      );

      var PANE_DRAW = 0.46;
      gsap.utils.toArray(".ddf15-pane").forEach(function (r) {
        var len = 2 * (r.width.baseVal.value + r.height.baseVal.value);
        gsap.set(r, { strokeDasharray: len, strokeDashoffset: len });
      });
      var paneStarts = [0.1, 0.47, 0.84, 1.1];
      gsap.utils.toArray(".ddf15-pane").forEach(function (r, i) {
        tl.to(
          r,
          {
            strokeDashoffset: 0,
            duration: i === 3 ? 0.3 : PANE_DRAW,
            ease: "power3.out",
          },
          paneStarts[i],
        );
      });

      /* ---- Scene 2 (56.7–58.2s → 1.20–3.10): the two D glyphs wipe in from the
         left, CE lights up, and the cyan→purple→pink seam closes last. The
         gradient is used exactly as the asset defines it. ---- */
      function wipe(maskId, width, from, dur, ease) {
        return tl.fromTo(
          maskId + " rect",
          { attr: { width: 0 } },
          { attr: { width: width }, duration: dur, ease: ease || "power3.out" },
          from,
        );
      }
      wipe("#ddf15-d1", 512, 1.24, 0.82);
      wipe("#ddf15-d2", 512, 1.38, 0.82);

      /* CE rises out of the dark, then the light runs across it */
      tl.fromTo(
        ".ddf15-ce",
        { opacity: 0 },
        { opacity: 1, duration: 0.44, ease: "power3.out" },
        1.94,
      );
      wipe("#ddf15-ce", 1024, 1.94, 0.78);
      tl.to(".ddf15-celight", { opacity: 0.62, duration: 0.3, ease: "power3.out" }, 1.98);
      tl.fromTo(
        ".ddf15-g0",
        { attr: { offset: -0.3 } },
        { attr: { offset: 0.84 }, duration: 0.8, ease: "power3.inOut" },
        1.94,
      );
      tl.fromTo(
        ".ddf15-g1",
        { attr: { offset: -0.18 } },
        { attr: { offset: 0.9 }, duration: 0.8, ease: "power3.inOut" },
        1.94,
      );
      tl.fromTo(
        ".ddf15-g2",
        { attr: { offset: 0.06 } },
        { attr: { offset: 1.02 }, duration: 0.8, ease: "power3.inOut" },
        1.94,
      );
      tl.fromTo(
        ".ddf15-g3",
        { attr: { offset: 0.3 } },
        { attr: { offset: 1.16 }, duration: 0.8, ease: "power3.inOut" },
        1.94,
      );
      tl.fromTo(
        ".ddf15-g4",
        { attr: { offset: 0.54 } },
        { attr: { offset: 1.3 }, duration: 0.8, ease: "power3.inOut" },
        1.94,
      );
      tl.fromTo(
        ".ddf15-g5",
        { attr: { offset: 0.8 } },
        { attr: { offset: 1.4 }, duration: 0.8, ease: "power3.inOut" },
        1.94,
      );
      tl.to(".ddf15-celight", { opacity: 0, duration: 0.34, ease: "power3.out" }, 2.46);

      /* … the seam closes the mark last */
      var seam = document.querySelector(".ddf15-seam");
      var seamLen = seam.getTotalLength();
      gsap.set(seam, { strokeDasharray: seamLen, strokeDashoffset: seamLen });
      tl.to(seam, { strokeDashoffset: 0, duration: 0.62, ease: "power3.out" }, 2.56);

      /* ---- Scene 3 (58.2–60.0s → 3.10–4.50): the logo locks and holds; the
         wordmark and the repository URL fade in beneath it. ---- */
      tl.fromTo(
        ".ddf15-wordmark",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        3.14,
      );
      tl.fromTo(
        ".ddf15-url",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.66, ease: "power3.out" },
        3.34,
      );
      /* the hold breathes — an almost imperceptible continuation, never a freeze */
      tl.fromTo(
        ".ddf15-logo",
        { scale: 1 },
        { scale: 1.012, duration: 1.36, ease: "power1.out" },
        3.14,
      );

      /* the one exit in the whole film: a very gentle overall dim over 0.4s */
      tl.to("#root", { opacity: 0.5, duration: 0.4, ease: "power1.inOut" }, 4.1);

      /* pin the length to the fixed 4.5s */
      tl.to({}, { duration: 0.01 }, 4.49);

      window.__timelines = window.__timelines || {};
      window.__timelines["15-outro"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
