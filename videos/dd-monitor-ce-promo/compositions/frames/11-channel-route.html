  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var L = ".ddf11-bars-l .ddf11-bar";
      var R = ".ddf11-bars-r .ddf11-bar";

      /* —— Scene 1 (0.00–0.80)：push-slide LEFT 进白场。两个对等窗口从两翼镜像
         进场（书页式 rotateY，左面朝右、右面朝左），滑出后归正；中间一条细线
         自上而下把声道分开。此刻只有窗，声波还没有。 —— */
      tl.fromTo(
        ".ddf11-field",
        { opacity: 0 },
        { opacity: 1, duration: 0.34, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        ".ddf11-pane-l",
        { xPercent: -46, yPercent: 14, scale: 0.86, opacity: 0 },
        { xPercent: 0, yPercent: 0, scale: 1, opacity: 1, duration: 0.78, ease: "power3.out" },
        0.06,
      );
      tl.fromTo(
        ".ddf11-pane-r",
        { xPercent: 46, yPercent: 14, scale: 0.86, opacity: 0 },
        { xPercent: 0, yPercent: 0, scale: 1, opacity: 1, duration: 0.78, ease: "power3.out" },
        0.26,
      );
      tl.fromTo(
        ".ddf11-plate",
        { rotateY: function (i) { return i === 0 ? 13 : -13; } },
        { rotateY: 0, duration: 0.9, ease: "power3.out" },
        0.12,
      );
      tl.fromTo(
        ".ddf11-divider",
        { scaleY: 0, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.3,
      );
      /* 标题逐字落定：字序从左到右（读它的方向），0.46s 就整句站住 */
      gsap.utils.toArray(".ddf11-ch").forEach(function (el, i) {
        tl.fromTo(
          el,
          { yPercent: 40, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.44, ease: "power3.out" },
          0.02 + i * 0.034,
        );
      });

      /* —— Scene 2 (0.80–2.20)：左侧声波先起，逐条朝左递进；右侧 ~0.5s 后应答，
         同样的条形填充、同样的节奏，方向朝右。这个先后差就是这一拍的意思。 —— */
      tl.fromTo(
        L,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power3.out", stagger: 0.068 },
        0.85,
      );
      tl.fromTo(
        R,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.42, ease: "power3.out", stagger: 0.068 },
        1.35,
      );
      tl.fromTo(
        ".ddf11-label-l",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.44, ease: "power3.out" },
        1.62,
      );
      tl.fromTo(
        ".ddf11-label-r",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.44, ease: "power3.out" },
        1.92,
      );

      /* —— Scene 3 (2.20–3.50)：副标题落定，两侧声波停在峰值保形不动，
         停住读半拍（这里没有任何循环滚动 —— 那是屏保）。 —— */
      tl.fromTo(
        ".ddf11-sub",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.66, ease: "power3.out" },
        2.24,
      );

      /* 最后一次入场落在 2.90s，之后两侧声波保形静止到 3.5s —— 停住读半拍 */

      window.__timelines = window.__timelines || {};
      window.__timelines["11-channel-route"] = tl;
      tl.seek(0);
    })();
  </script>
