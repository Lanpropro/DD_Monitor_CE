<template>
  <style>
    /* 系统自带字族：用 local() 声明，满足 font_family_without_font_face 校验 */
    @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); font-display: block; }
    /* 系统自带字族：用 local() 声明，满足 font_family_without_font_face 校验 */
    @font-face { font-family: "Segoe UI"; src: local("Segoe UI"); font-display: block; }
    /* ------------------------------------------------------------------
       10-tile-audio — field-light · 每一路 单独调 / 音量 静音 画质
       Every software pixel here is the real recording
       assets/rec-tile-audio.mp4 — the app wall is never redrawn in DOM.

       LAYERING NOTE (load-bearing): assemble-index.mjs hoists an approved
       video clip out of this sub-composition and mounts it at the host root,
       AFTER the frame wrappers — so the recording paints ABOVE this file's
       DOM. The window frame + title block therefore ride UNDER the real
       pixels (auto z-index, document order), and the per-tile control strip
       rides ABOVE them on an explicit z-index (`.ddf10-over`, z-index 40),
       which escapes to the host stacking context. The two corner patches
       exist because the hoisted clip is a square-cornered rectangle: they
       restore the window's 10px radius over the real pixels.
       ------------------------------------------------------------------ */
    @font-face {
      font-family: "Microsoft YaHei UI";
      font-style: normal;
      font-weight: 400;
      src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("msyh");
    }
    @font-face {
      font-family: "Microsoft YaHei UI";
      font-style: normal;
      font-weight: 600;
      src: local("Microsoft YaHei UI Semibold"), local("Microsoft YaHei UI Bold"),
        local("Microsoft YaHei Bold"), local("msyhbd");
    }
    @font-face {
      font-family: "Microsoft YaHei UI";
      font-style: normal;
      font-weight: 700;
      src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"), local("msyhbd");
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ——— the flat light field (field-light, no gradient, no texture) ——— */
    .ddf10-field {
      position: absolute;
      inset: 0;
      background: #f1f2f5;
    }

    /* ——— the window: outer frame + soft shadow. Its real pixels are the
           hoisted recording, which lands at left 10cqw / top 31cqw /
           width 80cqw on top of this box; the box itself stays motionless
           all shot (Scene 3: 停住，不做相机运动) — which is also the only
           way the frame can stay registered with the real pixels. ——— */
    .ddf10-window {
      position: absolute;
      left: 192px;
      top: 595px;
      width: 1536px;
      height: 638px;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 2cqw 5cqw rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    /* ——— centred title block, pad-top position ——— */
    .ddf10-title {
      position: absolute;
      left: 0;
      right: 0;
      top: 6.5cqw;
      padding: 0 8cqw;
      text-align: center;
    }
    .ddf10-head {
      margin: 0;
      font-size: 4.6cqw;
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.01em;
      color: #101114;
    }
    .ddf10-w {
      display: inline-block;
      white-space: pre;
      will-change: transform, opacity;
    }
    .ddf10-sub {
      margin: 1.4cqw 0 0 0;
      font-size: 2.1cqw;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
      color: rgba(16, 17, 20, 0.72);
      will-change: transform, opacity;
    }

    /* ——— overlay plane: the one layer that rides above the real pixels ——— */
    .ddf10-over {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 40;
      pointer-events: none;
    }
    /* corner patches: the hoisted recording is a square rectangle, these
       restore the window's 10px radius on the two visible top corners */
    .ddf10-corner {
      position: absolute;
      top: 595px;
      width: 10px;
      height: 10px;
      display: block;
    }
    .ddf10-corner-l {
      left: 192px;
      background: radial-gradient(
        circle 10px at 100% 100%,
        rgba(241, 242, 245, 0) 0,
        rgba(241, 242, 245, 0) 9px,
        #f1f2f5 10px
      );
    }
    .ddf10-corner-r {
      left: 1718px;
      background: radial-gradient(
        circle 10px at 0% 100%,
        rgba(241, 242, 245, 0) 0,
        rgba(241, 242, 245, 0) 9px,
        #f1f2f5 10px
      );
    }

    /* ——— the per-tile control bar, opened: one dark pill that snaps open,
           then its three items light one by one. No icon is invented — the
           three names are type, and the cobalt fill is the volume slider. ——— */
    .ddf10-bar {
      position: absolute;
      left: 461px;
      top: 998px;
      height: 65px;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 0 23px;
      border-radius: 33px;
      background: rgba(12, 13, 16, 0.86);
      transform-origin: 0% 50%;
      will-change: transform, opacity;
    }
    .ddf10-track {
      position: relative;
      display: block;
      width: 96px;
      height: 10px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.25);
      overflow: hidden;
    }
    .ddf10-fill {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      width: 62px;
      height: 10px;
      border-radius: 5px;
      background: #00a1d6;
      transform: scaleX(0);
      transform-origin: 0% 50%;
      will-change: transform;
    }
    .ddf10-item {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .ddf10-lbl {
      display: inline-block;
      font-size: 23px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.06em;
      color: rgba(241, 242, 245, 0.4);
      transform-origin: 50% 50%;
      will-change: transform, color;
    }
    .ddf10-und {
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: -9px;
      display: block;
      height: 4px;
      border-radius: 2px;
      background: #00a1d6;
      transform: scaleX(0);
      transform-origin: 0% 50%;
      will-change: transform;
    }
  </style>

  <div
    id="root"
    data-composition-id="10-tile-audio"
    data-start="0"
    data-duration="3.5"
    data-width="1920"
    data-height="1080"
  >
    <!-- scene field -->
    <div class="clip ddf10-field" data-start="0" data-duration="3.5" data-track-index="0"></div>

    <!-- the window: frame + shadow under the hoisted recording.
         Geometry mirrors the hoisted video box (top-aligned 16:9 source,
         running off the bottom edge), so the frame never drifts from it. -->
    <div class="clip ddf10-window" data-start="0" data-duration="3.5" data-track-index="1">
      <!-- approved frame video hoisted by assemble-index -->
    </div>

    <!-- centred title block -->
    <div class="clip ddf10-title" data-start="0" data-duration="3.5" data-track-index="3">
      <h1 class="ddf10-head"><span class="ddf10-w">每</span><span class="ddf10-w">一</span><span class="ddf10-w">路</span><span class="ddf10-w"> </span><span class="ddf10-w">单</span><span class="ddf10-w">独</span><span class="ddf10-w">调</span></h1>
      <div class="ddf10-sub">音量 静音 画质</div>
    </div>

    <!-- per-tile control bar — above the real pixels (see layering note) -->
    <div class="clip ddf10-over" data-start="0" data-duration="3.5" data-track-index="4">
      <i class="ddf10-corner ddf10-corner-l"></i>
      <i class="ddf10-corner ddf10-corner-r"></i>
      <div class="ddf10-bar">
        <span class="ddf10-track"><i class="ddf10-fill"></i></span>
        <span class="ddf10-item"><span class="ddf10-lbl">音量</span><i class="ddf10-und"></i></span>
        <span class="ddf10-item"><span class="ddf10-lbl">静音</span><i class="ddf10-und"></i></span>
        <span class="ddf10-item"><span class="ddf10-lbl">画质</span><i class="ddf10-und"></i></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var EASE = "power3.out";
      var DIM = "rgba(241,242,245,0.40)";
      var LIT = "#f1f2f5";

      /* Scene 1 (37.0–37.8s → 0.00–0.80): crossfade into the light field; the
         headline 每一路 单独调 lands character by character. The window is the
         real wall and is already present — nothing about it moves, ever. */
      gsap.utils.toArray(".ddf10-w").forEach(function (el, i) {
        tl.fromTo(
          el,
          { yPercent: 34, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.46, ease: EASE },
          0.2 + i * 0.032,
        );
      });

      /* Scene 2 (37.8–39.2s → 0.80–2.20): one tile's control bar snaps open
         (click-soft), then 音量 / 静音 / 画质 light one at a time — each once.
         Nothing else on the wall is touched: the rest of the tiles simply
         keep being the real recording, and that stillness is the argument. */
      tl.fromTo(
        ".ddf10-bar",
        { scaleX: 0.3, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.38, ease: EASE },
        0.86,
      );
      tl.fromTo(
        ".ddf10-fill",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: EASE },
        1.28,
      );

      var labels = gsap.utils.toArray(".ddf10-lbl");
      var unders = gsap.utils.toArray(".ddf10-und");
      [1.28, 1.56, 1.84].forEach(function (at, i) {
        tl.fromTo(
          labels[i],
          { color: DIM, scale: 0.9 },
          { color: LIT, scale: 1, duration: 0.34, ease: EASE },
          at,
        );
        tl.fromTo(
          unders[i],
          { scaleX: 0 },
          { scaleX: 1, duration: 0.36, ease: EASE },
          at + 0.04,
        );
      });

      /* Scene 3 (39.2–40.5s → 2.20–3.50): the subtitle 音量 静音 画质 lands
         under the headline; the bar stays open and the whole shot holds still
         — no camera move, no exit. */
      tl.fromTo(
        ".ddf10-sub",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.66, ease: EASE },
        2.3,
      );

      /* pin the composition to the fixed 3.5s so the landed state holds ~0.5s */
      tl.to({}, { duration: 0.5 }, 3.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["10-tile-audio"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
