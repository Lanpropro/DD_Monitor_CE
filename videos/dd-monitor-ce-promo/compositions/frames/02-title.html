<template>
  <style>
    @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("msyh"); }
    @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"), local("msyhbd"); }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .f02-field {
      position: absolute;
      inset: 0;
      background: #222428;
    }

    .f02-plate {
      position: absolute;
      left: 7cqw;
      right: 7cqw;
      top: 16cqw;
      bottom: -6cqw;
      border-radius: 10px;
      box-shadow: 0 2cqw 5cqw rgba(0, 0, 0, 0.28);
      z-index: 5;
      pointer-events: none;
    }

    /* dim scrim: 0 → 0.72 over 0.45s == the wall dimming 1 → 0.28 */
    .f02-scrim {
      position: absolute;
      inset: 0;
      background: #222428;
      z-index: 6;
      pointer-events: none;
      will-change: opacity;
    }

    .f02-title {
      position: absolute;
      left: 0;
      right: 0;
      top: 4cqw;
      padding: 0 8cqw;
      text-align: center;
      z-index: 7;
    }
    .f02-head {
      margin: 0;
      font-size: 4.6cqw;
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -0.01em;
      color: #f1f2f5;
    }
    .f02-line {
      display: block;
      white-space: nowrap;
    }
    .f02-swap {
      display: block;
      white-space: nowrap;
      min-height: 1.06em;
    }
    .f02-w {
      display: inline-block;
      white-space: pre;
      will-change: transform, opacity, filter;
    }
    .f02-sub {
      margin: 1.5cqw 0 0 0;
      font-size: 2.1cqw;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
      white-space: nowrap;
      color: rgba(241, 242, 245, 0.72);
      will-change: transform, opacity;
    }
  </style>

  <div id="root" data-composition-id="02-title" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
    <div class="clip f02-field" data-start="0" data-duration="5.5" data-track-index="0"></div>

    <!-- wall handed over from 01 (real recording, hoisted to the host root) -->
    <!-- approved frame video hoisted by assemble-index -->

    <div class="clip f02-plate" data-start="0" data-duration="5.5" data-track-index="1"></div>
    <div class="clip f02-scrim" data-start="0" data-duration="5.5" data-track-index="2"></div>

    <div class="clip f02-title" data-start="0" data-duration="5.5" data-track-index="3">
      <h1 class="f02-head">
        <span class="f02-line"><span class="f02-w">十</span><span class="f02-w">六</span><span class="f02-w">路</span><span class="f02-w">直</span><span class="f02-w">播</span><span class="f02-w">，</span></span>
        <span class="f02-swap"></span>
      </h1>
      <div class="f02-sub">DD监控室CE 专为 DD 设计的多窗口监控工具</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DURATION = 5.5;
      var tl = gsap.timeline({ paused: true });

      /* Scene 1: wall dims to 0.28 inside 0.45s; line 1 lands character by character */
      tl.fromTo(".f02-scrim", { opacity: 0 }, { opacity: 0.72, duration: 0.45, ease: "power3.out" }, 0);

      var words = gsap.utils.toArray(".f02-w");
      var stagger = 0.3 / (words.length - 1);
      words.forEach(function (el, i) {
        tl.fromTo(
          el,
          { yPercent: 30, opacity: 0, filter: "blur(9px)" },
          { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
          0.18 + i * stagger,
        );
      });

      /* Scene 2: line 2 arrives by HARD CUT (instant discrete swap, seek-safe) */
      var SWAP = [
        { t: 0, text: "" },
        { t: 1.5, text: "不必开十六个窗口" },
      ];
      var swapEl = gsap.utils.toArray(".f02-swap")[0];
      var clock = { t: 0 };
      var last = null;
      function textAt(time) {
        for (var i = SWAP.length - 1; i >= 0; i--) if (time >= SWAP[i].t) return SWAP[i].text;
        return "";
      }
      tl.to(clock, {
        t: DURATION, duration: DURATION, ease: "none",
        onUpdate: function () {
          var next = textAt(clock.t);
          if (next !== last) { swapEl.textContent = next; last = next; }
        },
      }, 0);

      /* Scene 3: subtitle lands, then everything holds still for the last ~2s */
      tl.fromTo(".f02-sub", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.6);
      tl.fromTo(".f02-title", { scale: 1.014 }, { scale: 1, duration: 0.2, ease: "power3.out" }, 3.1);

      tl.to({}, { duration: 0.01 }, 5.49);
      window.__timelines = window.__timelines || {};
      window.__timelines["02-title"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
