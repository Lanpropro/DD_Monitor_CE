    .ddf02-plate {

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var DURATION = 4.5;
      var tl = gsap.timeline({ paused: true });

      /* ——— Scene 1 (6.0–7.4s → 0.00–1.40): the wall hands over and dims to 0.28
         inside 0.45s; the first headline line lands character by character,
         centred. The stagger is derived from the content length, not hardcoded. ——— */
      tl.fromTo(
        ".ddf02-scrim-inner",
        { opacity: 0 },
        { opacity: 0.72, duration: 0.45, ease: "power3.out" },
        0,
      );

      var REVEAL_START = 0.18;
      var REVEAL_SPAN = 0.3;
      var WORD_DUR = 0.42;
      var words = gsap.utils.toArray(".ddf02-w");
      var stagger = words.length > 1 ? REVEAL_SPAN / (words.length - 1) : 0;
      words.forEach(function (el, i) {
        tl.fromTo(
          el,
          { yPercent: 30, opacity: 0, filter: "blur(9px)" },
          { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: WORD_DUR, ease: "power3.out" },
          REVEAL_START + i * stagger,
        );
      });

      /* ——— Scene 2 (7.4–8.8s → 1.40–2.80): the second headline line arrives by a
         HARD CUT — discrete-text-sequence: sparse {t, text} states, the latest one
         whose t has passed wins, and the DOM is written ONLY on a state change. The
         jump is instant (no tween, no fade) and stays correct on any seek. ——— */
      var SWAP = [
        { t: 0, text: "" },
        { t: 1.4, text: "不必开十六个窗口" },
      ];
      var swapEl = gsap.utils.toArray(".ddf02-swap")[0];
      var swapClock = { t: 0 };
      var lastSwap = null;
      function textAt(time) {
        for (var i = SWAP.length - 1; i >= 0; i--) {
          if (time >= SWAP[i].t) return SWAP[i].text;
        }
        return "";
      }
      tl.to(
        swapClock,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var next = textAt(swapClock.t);
            if (next !== lastSwap) {
              swapEl.textContent = next;
              lastSwap = next;
            }
          },
        },
        0,
      );

      /* ——— Scene 3 (8.8–10.5s → 2.80–4.50): the subtitle lands under the finished
         headline, the block takes the impact and locks at 3.50 — then nothing moves
         for the last full second (the deliberate still read). ——— */
      tl.fromTo(
        ".ddf02-sub",
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        2.9,
      );
      tl.fromTo(
        ".ddf02-title",
        { scale: 1.014 },
        { scale: 1, duration: 0.2, ease: "power3.out" },
        3.3,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["02-title"] = tl;
      tl.seek(0);
    })();
