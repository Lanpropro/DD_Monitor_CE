  </style>

  <div id="root" data-composition-id="05-layout-bigplus" data-width="1920" data-height="1080">
    <div

      class="clip"
      data-start="0"
      data-duration="3.5"
      data-track-index="0"
    ></div>

    <div id="f05-layout-bigplus-stage" data-layout-allow-overflow>
      <div id="f05-layout-bigplus-head">
        <span>主画面不动，</span><span>小画面环绕</span>

          <!-- approved frame video hoisted by assemble-index -->
        </div>

      <div id="f05-layout-bigplus-chip">
        <div
          id="f05-layout-bigplus-oldgrid"
          class="f05-layout-bigplus-grid"

        </div>
        <div
          id="f05-layout-bigplus-newgrid"
          class="f05-layout-bigplus-grid"

          <i></i><i></i><i></i><i></i><i></i>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      // Clip-path states over the wall video, in % of its border box.
      // The anchor state shows the main picture alone (upper-left 2x2 cell);
      // each following state opens one more small picture, left -> right.
      var S = [
        "inset(6.386% 97.179% 0% 1.875%)",
        "inset(6.386% 64.772% 0% 1.875%)",
        "inset(6.386% 46.681% 0% 1.875%)",
        "inset(6.386% 28.589% 0% 1.875%)",
        "inset(6.386% 10.498% 0% 1.875%)",
        "inset(6.386% 0% 0% 1.875%)",
      ];
      var HIDDEN = "inset(6.386% 97.179% 0% 1.875%)";

      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.0s): the main picture pins at the upper-left 2x2 ──
      tl.fromTo(
        "#f05-layout-bigplus-wall",
        { clipPath: HIDDEN },
        { clipPath: S[0], duration: 0.72, ease: "power3.out" },
        0.1,
      );

      // the chip swaps the 3x3 wireframe for the 1 + 5 one
      tl.fromTo(
        "#f05-layout-bigplus-oldgrid",
        { opacity: 1, scale: 1 },
        { opacity: 0, scale: 0.94, duration: 0.3, ease: "power3.inOut" },
        0.16,
      );
      tl.fromTo(
        "#f05-layout-bigplus-newgrid",
        { opacity: 0, scale: 0.86 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" },
        0.24,
      );
      tl.fromTo(
        "#f05-layout-bigplus-chiplabel span",
        { opacity: 0, yPercent: 55 },
        { opacity: 1, yPercent: 0, duration: 0.34, ease: "power3.out" },
        1.74,
      );

      // ── Scene 2 (1.0–2.6s): the five small pictures arrive, left -> right ──
      for (var k = 0; k < 5; k++) {
        var at = 1.02 + k * 0.36;
        tl.fromTo(
          "#f05-layout-bigplus-wall",
          { clipPath: S[k] },
          { clipPath: S[k + 1], duration: 0.3, ease: "power3.out" },
          at,
        );
        tl.fromTo(
          "#f05-layout-bigplus-newgrid i:nth-child(" + (k + 2) + ")",
          { opacity: 0.34 },
          { opacity: 1, duration: 0.26, ease: "power3.out" },
          at + 0.05,
        );
      }

      // the headline lands word-group by word-group as the smalls settle
      tl.fromTo(
        "#f05-layout-bigplus-head span:nth-child(1)",
        { opacity: 0, yPercent: 42 },
        { opacity: 1, yPercent: 0, duration: 0.46, ease: "power3.out" },
        1.62,
      );
      tl.fromTo(
        "#f05-layout-bigplus-head span:nth-child(2)",
        { opacity: 0, yPercent: 42 },
        { opacity: 1, yPercent: 0, duration: 0.46, ease: "power3.out" },
        2.02,
      );

      // ── Scene 3 (2.6–3.5s): subtitle lands, everything holds ──
      tl.fromTo(
        "#f05-layout-bigplus-sub",
        { opacity: 0, yPercent: 38 },
        { opacity: 1, yPercent: 0, duration: 0.5, ease: "power3.out" },
        2.72,
      );

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["05-layout-bigplus"] = tl;
    })();
  </script>
