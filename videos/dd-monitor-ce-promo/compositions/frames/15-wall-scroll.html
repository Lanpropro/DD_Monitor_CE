<template>
  <style>
    @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"), local("msyh"); }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .f15-field { position: absolute; inset: 0; background: #222428; }

    /* overall slow dim to hand off into the black logo beat */
    .f15-dim {
      position: absolute;
      inset: 0;
      background: #0d0e10;
      z-index: 5;
      pointer-events: none;
      will-change: opacity;
    }
  </style>

  <div id="root" data-composition-id="15-wall-scroll" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="clip f15-field" data-start="0" data-duration="5" data-track-index="0"></div>

    <!-- the nine-grid wall scrolling bottom-to-top (pre-panned recording, hoisted) -->
    <!-- approved frame video hoisted by assemble-index -->

    <div class="clip f15-dim" data-start="0" data-duration="5" data-track-index="1"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      gsap.set(".f15-dim", { opacity: 0 });
      /* scroll plays the whole beat; only the tail dims, very gently */
      tl.fromTo(".f15-dim", { opacity: 0 }, { opacity: 0.9, immediateRender: false, duration: 0.8, ease: "power1.inOut" }, 4.1);
      tl.to({}, { duration: 0.01 }, 4.99);
      window.__timelines = window.__timelines || {};
      window.__timelines["15-wall-scroll"] = tl;
      tl.seek(0);
    })();
  </script>
