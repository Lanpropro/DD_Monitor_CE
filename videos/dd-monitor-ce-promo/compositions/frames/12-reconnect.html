    .ddm12-edge {

      pointer-events: none;
      z-index: 4;

    /* the aperture the recording is scaled into. The recording is mapped in at
       exactly half size and offset up by 366 recording px, so the picture region

    .ddm12-screen {
      position: absolute;
      left: 0;
      top: 0;
      width: 1459.2px;
      height: 556.8px;

      height: 820.8px;

    .ddm12-overlay {

      left: 0;
      top: 0;

    <div class="clip ddm12-window" data-start="0" data-duration="3.5" data-track-index="1">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* Scene 1 (44.0–44.9s → 0.00–0.90): crossfade into the dark field. The window

      tl.fromTo(
        ".ddm12-field",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        ".ddm12-window",
        { opacity: 0, yPercent: 3 },
        { opacity: 1, yPercent: 0, duration: 0.6, ease: "power3.out" },
        0.06,
      );
      tl.fromTo(
        ".ddm12-head",
        { y: 26, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
        0.2,
      );
      /* the drop-out: a fast ramp, not a fade — a stream does not dim */
      tl.fromTo(
        ".ddm12-dead",
        { opacity: 0 },
        { opacity: 1, duration: 0.11, ease: "power2.out" },
        0.62,
      );
      /* the pill rises into the tile's bottom-left corner */
      tl.fromTo(
        ".ddm12-pill",
        { y: 46, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out" },

      );

      /* Scene 2 (44.9–46.1s → 0.90–2.10): the wait. 1.2s of riser, the tile stays

         the closing line lands. Then it stops — no camera move. */

        ".ddm12-dead",
        { opacity: 1 },
        { opacity: 0, duration: 0.5, ease: "power3.out" },
        2.13,
      );
      tl.fromTo(
        ".ddm12-pill",
        { opacity: 1 },
        { opacity: 0, duration: 0.3, ease: "power3.out" },
        2.13,
      );
      tl.fromTo(
        ".ddm12-sub",
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        2.9,
      );

      /* pin the composition to its fixed 3.5s */
      tl.to({}, { duration: 0.01 }, 3.49);

      window.__timelines["12-reconnect"] = tl;
      tl.seek(0);
    })();
