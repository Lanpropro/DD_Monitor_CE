      /* Scene 1 (21.0–21.8s → 0.00–0.80s): the chip changes form in place — the

        { scaleY: 0.6515 },
        { scaleY: 1, duration: 0.62, ease: "power3.out" },
        0,
      );
      tl.fromTo(

        { x: 3.83, scaleX: 0.9525, scaleY: 0.7937 },
        { x: 0, scaleX: 1, scaleY: 1, duration: 0.62, ease: "power3.out" },

         cell forms as the danmaku panel and its lines start rolling up. */
      gsap.utils.toArray(".ddf06-w").forEach(function (el, i) {
        tl.fromTo(
          el,
          { yPercent: 32, opacity: 0 },
          { yPercent: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.8 + i * 0.045,
        );
      });
      tl.fromTo(
        ".ddf06-cell-dm",
        { scale: 0.86, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },

      /* The danmaku is the one thing in this film doing its own job: the wall's
         danmaku cell rolls bottom-to-top (as the recording's real panel does) and
         does not stop before the beat ends. One long finite, linear tween, bounded
         by the frame's 3.5s — it never loops. */
      tl.fromTo(
        ".ddf06-dm-roll",
        { yPercent: 10 },
        { yPercent: -10, duration: 1.62, ease: "none" },
        1.88,
      );

      /* Scene 3 (23.2–24.5s → 2.20–3.50s): the arrangement names itself, the danmaku
         keeps rolling, and nothing else on the frame moves — the blue段 closes.
         transform + opacity only: letter-spacing is a text-reflow property and holds
         its designed 0.16em statically. */

        ".ddf06-sub",
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.62, ease: "power3.out" },
        2.55,
