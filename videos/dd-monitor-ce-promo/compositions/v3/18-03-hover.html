<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-03-hover  ——  C 组：08（0.0–5.0s）「悬停预览 · 如此轻松」

         用户 2026-09-22：「03 是手稿有问题，我希望的画面是如截图的 ——
         正常情况下立体排列，然后向上弹出，并且模拟光标上移展示预览视频。」
         所以这一版改成照**参考片 17.08–23.17s** 那个画面重做：

           · 背景 = 从参考片 19.0s 裁出的灰墙（取画面上部无卡片区域，拉伸铺满）
           · 一排**真实关注卡片**（8 张，来自 `卡片截图_自行裁剪.png`）从左到右立体排列，
             近大远小、彼此轻微重叠
           · 三轮：其中一张**向上弹出**（放大 + 升到队列上方）→ 光标跟着**上移** →
             卡面淡出、换成**真实预览录像**（`聚焦卡片_卡片预览.mp4` 的 8–13s）

         ⚠ 动效全部写在时间轴上，不用 tl.call（渲染器 seek(t, suppressEvents=true) 不触发 callback）。
         ⚠ 不要给承载 <video> 的容器补间 width/height，也不要写 will-change ——
           两者都会让 video 的帧整个丢失（见 ASSET-CROPPING.md 第 6 节）。
         ⚠ 卡片位置全部用 transform 的 x/y/scale，不碰 left/top（会吸附整数设备像素）。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }

      :root {
        --card: rgba(246,247,249,.94);
        --card-edge: rgba(255,255,255,.60);
        --accent: #00a1d6; --pink: #fb7299;
        --ink: #101114; --ink-2: rgba(16,17,20,.62);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #969aa3 url("assets/rec/ref-wall.jpg") center / cover no-repeat;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased; color: var(--ink);
      }

      /* 左上标题 */
      .head { position: absolute; left: 110px; top: 96px; will-change: transform, opacity; }
      .head .n { font-size: 84px; font-weight: 700; letter-spacing: -.01em; line-height: 1; color: #fff; text-shadow: 0 2px 18px rgba(16,17,20,.28); }
      .head .s { margin-top: 16px; font-size: 36px; font-weight: 600; letter-spacing: .16em; color: rgba(255,255,255,.82); text-shadow: 0 2px 14px rgba(16,17,20,.24); }
      .head .bar { width: 84px; height: 4px; background: var(--accent); margin-top: 22px; transform-origin: 0 50%; }

      /* 卡片队列：一排，从左到右，近大远小。位置全部由 JS 用 x/y/scale 给。 */
      .stage { position: absolute; inset: 0; }
      .card {
        position: absolute; left: 0; top: 0; width: 300px; height: 200px;
        border-radius: 16px; overflow: hidden;
        background: var(--card);
        border: 1px solid var(--card-edge);
        box-shadow: 0 24px 48px rgba(16,17,20,.20), 0 2px 0 rgba(255,255,255,.5) inset;
      }
      .card .shot { display: block; width: 100%; height: 100%; object-fit: cover; }
      /* 预览录像：抽出时才淡入，盖在卡面上 */
      .card .vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
      /* 抽出时点亮描边 */
      .card.lit { border-color: rgba(0,161,214,.85); box-shadow: 0 40px 80px rgba(16,17,20,.34), 0 0 0 2px rgba(0,161,214,.35); }

      /* 模拟光标 */
      .cursor { position: absolute; left: 0; top: 0; width: 28px; height: 36px; will-change: transform, opacity; }
      .cursor svg { display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-03-hover" data-start="0" data-duration="5" data-width="1920" data-height="1080">

      <div class="head" id="head">
        <div class="n">悬停预览</div>
        <div class="s">如此轻松</div>
        <div class="bar" id="headBar"></div>
      </div>

      <!-- 卡片队列：8 张真实关注卡片（从卡片截图_自行裁剪.png 按周期 192px 裁出）。
           只有会被抽出的那三张（k2 / k5 / k7）内嵌预览录像，其余是静态卡面。 -->
      <div class="stage" id="stage">
        <div class="card" id="k1"><img class="shot" src="assets/rec/card-1.png" alt=""></div>
        <div class="card" id="k2">
          <img class="shot" src="assets/rec/card-2.png" alt="">
          <video class="vid" id="v2" src="assets/rec/rec-preview.mp4" muted playsinline
                 data-start="0.762" data-duration="4.238"></video>
        </div>
        <div class="card" id="k3"><img class="shot" src="assets/rec/card-3.png" alt=""></div>
        <div class="card" id="k4"><img class="shot" src="assets/rec/card-4.png" alt=""></div>
        <div class="card" id="k5">
          <img class="shot" src="assets/rec/card-5.png" alt="">
          <video class="vid" id="v5" src="assets/rec/rec-preview.mp4" muted playsinline
                 data-start="2.0955" data-duration="2.9045"></video>
        </div>
        <div class="card" id="k6"><img class="shot" src="assets/rec/card-6.png" alt=""></div>
        <div class="card" id="k7">
          <img class="shot" src="assets/rec/card-7.png" alt="">
          <video class="vid" id="v7" src="assets/rec/rec-preview.mp4" muted playsinline
                 data-start="3.429" data-duration="1.571"></video>
        </div>
        <div class="card" id="k8"><img class="shot" src="assets/rec/card-8.png" alt=""></div>
      </div>

      <div class="cursor" id="cursor" style="opacity: 0;">
        <svg viewBox="0 0 28 36" width="28" height="36"><path d="M4 2 L4 28 L11 21 L15 32 L20 30 L16 19 L25 19 Z" fill="#f1f2f5" stroke="#0d0e10" stroke-width="2"/></svg>
      </div>
    </div>

    <script>
      (function () {
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";
        var tl = gsap.timeline({ paused: true });

        var N = 8;
        var GAP = 228;              /* < 卡片宽（300）-> 彼此轻微重叠，照参考片 */

        /* 队列位置：**从左下到右上**排过去（用户 2026-09-22 用红框标出的实际位置），
           并且**左边在前、遮挡右边** —— 所以左近右远：左边大、右边小。 */
        var POS = [];
        for (var i = 0; i < N; i++) {
          POS.push({
            x: 8 + i * 238,
            y: 820 - i * 34,          /* 越往右越高（底边成一条右上斜线） */
            s: 1.16 - i * 0.044,      /* 左边离镜头近 -> 大；右边远 -> 小 */
            z: N - i                  /* 左边在前，遮挡右边 */
          });
        }

        /* ---- 基线 ---- */
        gsap.set("#head", { opacity: 0, x: -40 });
        gsap.set("#headBar", { scaleX: 0 });
        gsap.set(".vid", { opacity: 0 });
        gsap.set("#cursor", { opacity: 0, x: 1180, y: 860 });
        POS.forEach(function (p, i) {
          gsap.set("#k" + (i + 1), { x: p.x, y: p.y, scale: p.s, zIndex: p.z, opacity: 0 });
        });

        /* ---- 入场：标题 + 卡片依次浮现 ---- */
        tl.fromTo("#head", { opacity: 0, x: -40 },
          { opacity: 1, x: 0, duration: 0.50, ease: EASE_OUT, immediateRender: false }, 0.10);
        tl.fromTo("#headBar", { scaleX: 0 },
          { scaleX: 1, duration: 0.40, ease: EASE_OUT, immediateRender: false }, 0.34);
        POS.forEach(function (p, i) {
          tl.to("#k" + (i + 1), { opacity: 1, duration: 0.40, ease: EASE_OUT, immediateRender: false },
                0.10 + i * 0.06);
        });

        /* ---- 三轮：向上弹出 → 光标上移 → 卡面换成预览录像 → 收回 ----
           起点对齐 BGM 网格 0.1905s（与 01/02 同一张）：0.762(n=4) / 2.0955(n=11) / 3.429(n=18)。 */
        function round(base, idx, vidId) {
          var card = "#k" + (idx + 1);
          var p = POS[idx];
          var LIFT = 0.42, MOVE = 0.46, PLAY = 1.00, BACK = 0.40;
          var s0 = base + LIFT + MOVE;          /* 光标到位 */
          var s1 = s0 + PLAY;                   /* 预览播完 */

          /* 1) 向上弹出：升到队列上方 + 放大 + 描边点亮（全部补间，不用 class 切换） */
          tl.to(card, { y: p.y - 330, scale: 1.55, duration: LIFT, ease: EASE_IO, immediateRender: false }, base);
          tl.to(card, { zIndex: 100, duration: 0.01, ease: "none", immediateRender: false }, base);
          tl.to(card, { borderColor: "rgba(0,161,214,.85)", duration: LIFT, immediateRender: false }, base);
          /* 其它卡片轻微下沉，给抽出的那张让出空间（照参考片，队列本身会动） */
          POS.forEach(function (q, j) {
            if (j === idx) return;
            tl.to("#k" + (j + 1), { y: q.y + 26, duration: LIFT + MOVE, ease: EASE_IO, immediateRender: false }, base);
          });

          /* 2) 光标**上移**到这张卡上 */
          tl.to("#cursor", { opacity: 1, duration: 0.14, immediateRender: false }, base + 0.10);
          tl.fromTo("#cursor", { x: 1180, y: 860 },
            { x: p.x + 150, y: p.y - 300, duration: MOVE, ease: EASE_IO, immediateRender: false }, base + 0.10);

          /* 3) 卡面换成真实预览录像（shot 淡出 / vid 淡入） */
          tl.to(card + " .shot", { opacity: 0, duration: 0.30, ease: EASE_OUT, immediateRender: false }, s0);
          tl.to("#" + vidId, { opacity: 1, duration: 0.30, ease: EASE_OUT, immediateRender: false }, s0);

          /* 4) 收回：回到队列位置，录像淡出、卡面回来 */
          tl.to("#" + vidId, { opacity: 0, duration: 0.24, ease: EASE_OUT, immediateRender: false }, s1);
          tl.to(card + " .shot", { opacity: 1, duration: 0.24, ease: EASE_OUT, immediateRender: false }, s1);
          tl.to(card, { y: p.y, scale: p.s, duration: BACK, ease: EASE_OUT, immediateRender: false }, s1);
          tl.to(card, { zIndex: p.z, duration: 0.01, ease: "none", immediateRender: false }, s1 + BACK);
          tl.to(card, { borderColor: "rgba(255,255,255,.60)", duration: BACK, immediateRender: false }, s1);
          /* 队列归位 */
          POS.forEach(function (q, j) {
            if (j === idx) return;
            tl.to("#k" + (j + 1), { y: q.y, duration: BACK, ease: EASE_OUT, immediateRender: false }, s1);
          });
        }

        round(0.762,  1, "v2");
        round(2.0955, 4, "v5");
        round(3.429,  6, "v7");

        tl.to("#cursor", { opacity: 0, duration: 0.24, immediateRender: false }, 4.72);

        tl.to({}, { duration: 0.01 }, 4.99);

        window.__timelines = window.__timelines || {};
        window.__timelines["18-03-hover"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
