<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-03-hover  ——  C 组：08（0.0–8.382s）「悬停预览 · 如此轻松」

         用户 2026-09-23（第三次修正）：
           「聚焦的话**将我们的视角推进**即可；要修改的地方是，这个时候的画面**停滞了、
             无法展示预览的效果**；并且**右侧和下侧还有黑边**，请去除。」
         → 三件事：
           ① 去掉素材黑边：`聚焦卡片_卡片预览.mp4` 的帧右边 569px、下边 338px 是黑的，
              裁到内容边界 `x 1..3270 / y 0..1821`（3270×1822，比例 1.795）。
           ② 聚焦 = **视角推进**（整层 scale + 平移把那张卡推到画面中心），
              不再是"单独把一张卡放大"。
           ③ 推进到位后，那张卡的位置上**换成真实直播录像**（动态），
              解决"画面停滞、看不到预览效果"—— 用的是
              `preview-liko.mp4` / `preview-shio.mp4` / `preview-komichi.mp4`。

         选帧：用 `聚焦卡片_卡片预览.mp4` 的 **19.5s** 帧 —— 那一帧的关注栏里
         莉蔻Liko / 盐无Shio / 四时小路Komichi 三张都在（4.0s 帧里最上面三张是
         三理Mit3uri / 盐无 / 四时小路，三理Mit3uri 没有预览素材）。
         三张卡在裁剪后的坐标：莉蔻 y 525..675、盐无 859..1009、四时小路 1193..1343，
         横向都是 x 7..280（靠"直播中"粉色标签 y = 644 / 978 / 1312 定位）。

         节拍：0.1905s 网格。三轮各 13 拍（2.4765s），起点 0.762 / 3.2385 / 5.715，整段 8.382s。

         ⚠ 三支 <video> 各自**提前约 1.4s 就存在**（data-start 0 / 2.24 / 4.72）——
           实测渲染器需要 ~1.1s 才能让一支视频出帧，卡着轮次起点给会出现黑画面。
         ⚠ 坐标一律在 setup 时按常量算一次；只补 opacity / scale / x / y。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }

      :root {
        --sc-white: #f8f8f8;
        --ink: #101114; --ink-2: rgba(16,17,20,.66);
        --accent: #00a1d6;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-io: cubic-bezier(0.77, 0, 0.175, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sc-white);
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased; color: var(--ink);
      }

      /* 视角推进作用在这一层（含软件画面 + 卡内录像一起推） */
      .stage { position: absolute; inset: 0; transform-origin: 50% 50%; }

      .app {
        position: absolute; border-radius: 16px; overflow: hidden;
        box-shadow: 0 44px 100px rgba(16,17,20,.26), 0 0 0 1px rgba(16,17,20,.06);
      }
      .app video { display: block; width: 100%; height: 100%; object-fit: cover; }

      /* 左上标题 */
      .head { position: absolute; left: 150px; top: 34px; }
      .head .n { font-size: 56px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
      .head .s { margin-top: 12px; font-size: 26px; font-weight: 600; letter-spacing: .16em; color: var(--ink-2); }
      .head .bar { width: 72px; height: 4px; background: var(--accent); margin-top: 16px; transform-origin: 0 50%; }

      /* 模拟光标：放在 .stage 内（跟随视角推进），但 `transform-origin` 必须是**左上角** ——
         默认的中心原点会让反向缩放(1/ZOOM)把箭头的尖端推偏约 (18,54)px，
         实测推进后光标落到 977,570 而卡片中心是 960,540。改 0 0 后尖端位置与缩放无关。 */
      .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 40px; transform-origin: 0 0; }
      .cursor svg { display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-03-hover" data-start="0" data-duration="8.382" data-width="1920" data-height="1080">

      <div class="head" id="head">
        <div class="n">悬停预览</div>
        <div class="s">如此轻松</div>
        <div class="bar" id="headBar"></div>
      </div>

      <div class="stage" id="stage">
        <!-- 主画面 = **素材本体**：`聚焦卡片_卡片预览.mp4` 的 0–15s，
             裁掉右 569 / 下 338 黑边后**加速 1.7895 倍**（15s -> 8.37s），缩到 1560x870。
             用户 2026-09-23：「你只要完全把 0-15s 放上来，做一个加速、裁剪、聚焦就好了」——
             画面本身是动的（列表在滚、卡片在展开），所以不再需要往卡片上叠录像。 -->
        <div class="app" id="app">
          <video id="clip" src="assets/rec/focus-clip.mp4" muted playsinline
                 data-start="0" data-duration="8.382"></video>
        </div>

        <!-- 光标**必须放在 .stage 里面**：视角推进时它会跟着卡片一起被放大/平移，
             这样才能始终停在目标卡上。放在 stage 外面就会出现"卡片走了、光标留在原地"。
             代价是它会跟着放大 3.6 倍，所以推进时同步给它 1/ZOOM 的反向缩放，视觉尺寸不变。 -->
        <div class="cursor" id="cursor" style="opacity:0">
          <svg viewBox="0 0 30 40" width="30" height="40"><path d="M4 2 L4 30 L11 24 L16 36 L21 34 L17 22 L27 22 Z" fill="#f1f2f5" stroke="#0d0e10" stroke-width="2.2"/></svg>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";
        var tl = gsap.timeline({ paused: true });

        /* ================= 常量（setup 时算一次） =================
           素材 focus-app.png = 3270×1822（已裁掉右 569 / 下 338 黑边）。
           显示为 APP.w × APP.h 居中；三张卡在素材里的坐标见文件头注释。 */
        var FRAME = { w: 3270, h: 1822 };
        var APP = { left: 180, top: 105, w: 1560, h: 870 };
        var CARDS = [
          { x: 7, y: 525,  w: 273, h: 150 },   /* 莉蔻Liko        -> v1 (preview-liko)    */
          { x: 7, y: 693,  w: 273, h: 150 },   /* 三理Mit3uri      -> v2                   */
          { x: 7, y: 859,  w: 273, h: 150 }    /* 盐无Shio         -> v3 (preview-shio)    */
        ];
        var ZOOM = 3.6;                        /* 视角推进倍数 */
        var k = APP.w / FRAME.w;               /* 素材 -> 画面显示 */

        var appEl = document.getElementById("app");
        appEl.style.left = APP.left + "px";
        appEl.style.top = APP.top + "px";
        appEl.style.width = APP.w + "px";
        appEl.style.height = APP.h + "px";

        var SPOT = [];
        CARDS.forEach(function (c, i) {
          var dx = APP.left + c.x * k, dy = APP.top + c.y * k;
          var dw = c.w * k, dh = c.h * k;
          var cx = dx + dw / 2, cy = dy + dh / 2;
          /* 视角推进：transform-origin 是画布中心，把卡片中心推到 (960,540) 需要
             tx = -(cx-960)*ZOOM、ty = -(cy-540)*ZOOM。 */
          SPOT.push({ cx: cx, cy: cy, tx: -(cx - 960) * ZOOM, ty: -(cy - 540) * ZOOM });
        });

        /* ---- 基线 ---- */
        gsap.set("#head", { opacity: 0, y: 20 });
        gsap.set("#headBar", { scaleX: 0 });
        gsap.set("#stage", { scale: 1, x: 0, y: 0 });
        gsap.set("#app", { opacity: 0 });
        gsap.set("#cursor", { opacity: 0, x: SPOT[0].cx - 3, y: SPOT[0].cy - 2, scale: 1 });

        /* ================= 入场 ================= */
        tl.fromTo("#head", { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 0.08);
        tl.fromTo("#headBar", { scaleX: 0 },
          { scaleX: 1, duration: 0.40, ease: EASE_OUT, immediateRender: false }, 0.30);
        tl.fromTo("#app", { opacity: 0 },
          { opacity: 1, duration: 0.50, ease: EASE_OUT, immediateRender: false }, 0.02);
        tl.to("#cursor", { opacity: 1, duration: 0.20, immediateRender: false }, 0.56);

        /* ================= 三轮：推近一次 → 之后只做视角下移，不再退回 =================
           用户 2026-09-23：「在聚焦的时候就不用收回来了，保持聚焦，然后视角下移即可」。
           主画面是视频（自己在动），所以这里**只做聚焦**：第 1 轮把 stage 推到 3.6 倍并保持，
           第 2/3 轮只改 tx/ty 做视角下移。 */
        var LIFT = 0.762;
        var ROUND = 13 * 0.1905;              /* 2.4765 */
        function round(base, i) {
          var s = SPOT[i];
          if (i > 0) tl.to("#cursor", { y: s.cy - 2, duration: 0.40, ease: EASE_IO, immediateRender: false }, base);
          tl.to("#stage", { scale: ZOOM, x: s.tx, y: s.ty,
                            duration: i === 0 ? 0.60 : 0.46, ease: "power2.inOut", immediateRender: false },
                base + (i === 0 ? 0.30 : 0.10));
          /* 光标只在第一轮随推近做一次 1/ZOOM 的反向缩放（transform-origin 是 0 0，
             尖端位置不受缩放影响）；之后 scale 一直保持不变。 */
          if (i === 0) tl.to("#cursor", { scale: 1 / ZOOM, duration: 0.60, ease: "power2.inOut", immediateRender: false }, base + 0.30);
        }
        round(LIFT, 0);                       /* 0.762  */
        round(LIFT + ROUND, 1);               /* 3.2385 */
        round(LIFT + ROUND * 2, 2);           /* 5.715  */

        /* ================= 收尾：保持聚焦，只把光标收掉 ================= */
        tl.to("#cursor", { opacity: 0, duration: 0.26, immediateRender: false }, 8.06);

        tl.to({}, { duration: 0.01 }, 8.372);

        window.__timelines = window.__timelines || {};
        window.__timelines["18-03-hover"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
