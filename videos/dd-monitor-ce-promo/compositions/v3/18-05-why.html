<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #090c6d; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #090c6d; color: #f1f2f5; font-family: "Microsoft YaHei UI", sans-serif;
      }
      .colors { position: absolute; inset: 0; overflow: hidden; }
      .blob { position: absolute; border-radius: 50%; }
      #warm {
        left: -390px; top: -450px; width: 1540px; height: 1220px;
        background: radial-gradient(ellipse, rgba(240,52,82,.92) 0%, rgba(214,52,91,.68) 36%, transparent 72%);
      }
      #green {
        left: 640px; top: -450px; width: 1700px; height: 1330px;
        background: radial-gradient(ellipse, rgba(0,190,134,.92) 0%, rgba(0,143,123,.62) 38%, transparent 72%);
      }
      #violet {
        left: 680px; top: 290px; width: 1730px; height: 1240px;
        background: radial-gradient(ellipse, rgba(152,92,211,.78) 0%, rgba(79,47,179,.48) 38%, transparent 74%);
      }
      .veil {
        position: absolute; inset: 0;
        background: linear-gradient(90deg, rgba(6,9,64,.72) 0%, rgba(6,9,64,.48) 34%, rgba(6,9,64,.08) 74%, transparent 100%);
      }
      #copy { position: absolute; left: 108px; top: 244px; width: 1380px; }
      .group { display: flex; flex-direction: column; align-items: flex-start; }
      .line { opacity: 0; font-weight: 700; line-height: 1.16; text-shadow: 0 3px 22px rgba(5,8,60,.22); }
      .lead { font-size: 74px; margin-bottom: 24px; }
      .small { font-size: 48px; margin-bottom: 15px; }
      .strong { font-size: 64px; margin-bottom: 23px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-05-why" data-start="0" data-duration="7.5" data-width="1920" data-height="1080">
      <div class="colors">
        <div class="blob" id="warm" data-layout-allow-overflow></div>
        <div class="blob" id="green" data-layout-allow-overflow></div>
        <div class="blob" id="violet" data-layout-allow-overflow></div>
      </div>
      <div class="veil"></div>
      <div id="copy">
        <div class="group" id="l11">
          <div class="line lead" id="line11">为啥不用浏览器？</div>
          <div class="line small" id="line12">九路直播同开</div>
        </div>
        <div class="group" id="l12">
          <div class="line small" id="line13">不用来回切标签</div>
          <div class="line strong" id="line14">九路画面，同屏可见</div>
        </div>
        <div class="group" id="l13">
          <div class="line small" id="line15">按需调整布局</div>
          <div class="line strong" id="line16">横竖画面，自由摆放</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var ease = "power3.out";
        gsap.set("#copy", { y: 152 });
        tl.to("#copy", { y: 0, duration: 3.7, ease: "power2.out" }, 0.55);
        tl.to("#warm", { x: 400, y: 80, scale: 1.16, duration: 7.5, ease: "none" }, 0);
        tl.to("#green", { x: -320, y: 210, scale: 1.12, duration: 7.5, ease: "none" }, 0);
        tl.to("#violet", { x: -460, y: -150, scale: 1.18, duration: 7.5, ease: "none" }, 0);
        [
          ["#line11", 0.18], ["#line12", 1.26],
          ["#line13", 2.42], ["#line14", 3.44],
          ["#line15", 4.70], ["#line16", 5.72]
        ].forEach(function (entry) {
          tl.fromTo(entry[0], { opacity: 0, x: -48, y: 14, filter: "blur(8px)" },
            { opacity: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.46, ease: ease, immediateRender: false }, entry[1]);
        });
        tl.to({}, { duration: 0.01 }, 7.49);
        window.__timelines = window.__timelines || {};
        window.__timelines["18-05-why"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
