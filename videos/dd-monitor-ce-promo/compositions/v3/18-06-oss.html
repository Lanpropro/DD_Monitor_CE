<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="assets/lib/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
    @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
    @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
    @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f8f8f8; color: #16181d; font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
    .act { position: absolute; inset: 0; overflow: hidden; }
    #a14, #a16, #a17 { background: #f8f8f8; }
    .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: .16em; color: #777e8d; }
    .title { font-size: 82px; font-weight: 700; letter-spacing: -.025em; line-height: 1.12; }
    .sub { font-size: 29px; font-weight: 600; color: #69717f; }
    .media { position: absolute; left: 160px; top: 95px; width: 1600px; height: 730px; border-radius: 24px; overflow: hidden; box-shadow: 0 28px 80px #1a24402e; background: #252a35; }
    .media img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.48) saturate(.65); }
    .media:after { content: ""; position: absolute; inset: 0; border: 2px dashed #ffffff88; border-radius: 24px; pointer-events: none; }
    .placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; color: white; text-align: center; text-shadow: 0 3px 14px #0008; }
    .placeholder .icon { font-size: 52px; line-height: 1; }
    .placeholder strong { font-size: 44px; letter-spacing: .02em; }
    .placeholder span { font-size: 24px; color: #e2e5ec; }
    .caption { position: absolute; left: 160px; top: 855px; width: 1600px; display: flex; align-items: baseline; justify-content: space-between; }
    .badge { padding: 10px 20px; border: 2px solid #8b95a7; border-radius: 99px; font-size: 20px; font-weight: 700; color: #657080; }
    #a15 { background: radial-gradient(circle at 75% 30%, #5541a2 0%, #252a68 45%, #111b3c 100%); color: #fff; }
    #a15:after { content: ""; position: absolute; width: 530px; height: 530px; border-radius: 50%; border: 1px solid #ffffff24; top: 240px; right: 260px; box-shadow: 0 0 0 90px #ffffff08, 0 0 0 180px #ffffff08; }
    .feedback { position: absolute; left: 170px; top: 315px; z-index: 1; }
    .feedback .eyebrow { color: #a8bbff; }
    .feedback .title { margin: 22px 0 35px; font-size: 104px; }
    .feedback .channels { font-size: 42px; font-weight: 700; letter-spacing: .06em; }
    .feedback .human { margin-top: 32px; font-size: 33px; color: #c7ceee; }
    .disclaimer { position: absolute; left: 165px; top: 285px; width: 1590px; }
    .disclaimer .title { font-size: 62px; margin: 28px 0 42px; }
    .disclaimer .line { font-size: 35px; line-height: 1.65; font-weight: 600; color: #535b68; }
    .disclaimer .credit { margin-top: 15px; color: #89919d; font-size: 29px; }
    .strip { position: absolute; left: 165px; right: 165px; bottom: 120px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #00a1d6, #7668cf, #f0719a); }
    .wall { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0e1014; transform-origin: center bottom; box-shadow: 0 35px 100px #10142b55; }
    .wall video { display: block; width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="18-06-oss" data-start="0" data-duration="15.5" data-width="1920" data-height="1080">
    <div class="act" id="a14">
      <div class="media" id="slot">
        <img src="assets/v3-05-app-preview.jpg" alt="DD监控室CE 软件背景" />
        <div class="placeholder" id="slotA"><div class="icon">▧</div><strong>插件目录录屏 · 待替换</strong><span>plugins_user / danmaku_log / plugin.py</span></div>
        <div class="placeholder" id="slotB" style="opacity:0"><div class="icon">⌁</div><strong>软件右键操作录屏 · 待替换</strong><span>插件菜单：复制流地址</span></div>
      </div>
      <div class="caption"><div><div class="title">开源，拓展</div><div class="sub">插件能力，接进日常操作</div></div><div class="badge">画面占位 / 录制后替换</div></div>
    </div>
    <div class="act" id="a15" style="opacity:0">
      <div class="feedback"><div class="eyebrow">DD MONITOR CE · FEEDBACK</div><div class="title" id="fbTitle">反馈问题</div><div class="channels" id="channels">评论区 · 私信 · GitHub</div><div class="human" id="human">牛马大学生在线修 bug</div></div>
    </div>
    <div class="act" id="a16" style="opacity:0">
      <div class="disclaimer"><div class="eyebrow">关于本项目</div><div class="title" id="d1">视频内软件为演示效果，请以实际为准</div><div class="line" id="d2">本项目是 DD监控室的二次开发版本，是个人维护的第三方工具</div><div class="line credit" id="d3">原作者：执明神君，@神君Channel</div></div>
      <div class="strip"></div>
    </div>
    <div class="act" id="a17" style="opacity:0">
      <div class="wall" id="wall"><video id="wallVideo" src="assets/rec/06-wall-live.mp4" muted playsinline preload="auto" data-start="11" data-duration="4.5"></video></div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const out = "power3.out";
      gsap.set("#slot", { y: 35, opacity: 0 });
      gsap.set(".caption", { y: 24, opacity: 0 });
      gsap.set(["#fbTitle", "#channels", "#human", "#d1", "#d2", "#d3"], { y: 28, opacity: 0 });
      gsap.set("#wall", { y: 530, scale: .72, rotationX: 5, transformPerspective: 1700 });
      tl.to("#slot", { y: 0, opacity: 1, duration: .55, ease: out }, .05);
      tl.to(".caption", { y: 0, opacity: 1, duration: .5, ease: out }, .18);
      tl.to("#slotA", { opacity: 0, duration: .17 }, 1.16);
      tl.to("#slotB", { opacity: 1, duration: .17 }, 1.25);
      tl.to("#a14", { opacity: 0, duration: .33 }, 3.23);
      tl.to("#a15", { opacity: 1, duration: .33 }, 3.48);
      tl.to("#fbTitle", { y: 0, opacity: 1, duration: .53, ease: out }, 3.62);
      tl.to("#channels", { y: 0, opacity: 1, duration: .45, ease: out }, 4.16);
      tl.to("#human", { y: 0, opacity: 1, duration: .45, ease: out }, 4.7);
      tl.to("#a15", { opacity: 0, duration: .3 }, 6.72);
      tl.to("#a16", { opacity: 1, duration: .28 }, 6.98);
      tl.to("#d1", { y: 0, opacity: 1, duration: .5, ease: out }, 7.14);
      tl.to("#d2", { y: 0, opacity: 1, duration: .5, ease: out }, 7.58);
      tl.to("#d3", { y: 0, opacity: 1, duration: .5, ease: out }, 8.0);
      tl.to("#a16", { opacity: 0, duration: .28 }, 10.78);
      tl.to("#a17", { opacity: 1, duration: .3 }, 10.96);
      tl.to("#wall", { y: 0, scale: 1, rotationX: 0, duration: 1.35, ease: out }, 11.04);
      tl.to({}, { duration: .01 }, 15.49);
      window.__timelines = window.__timelines || {};
      window.__timelines["18-06-oss"] = tl;
      tl.seek(0);
    })();
  </script>
</body>
</html>
