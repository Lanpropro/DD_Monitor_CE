<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-02-layout  ——  B 组：05–07（0.0–6.0s）
         05（0.0–2.0）想怎么看，就怎么排 —— 单屏→两分→四分→1+5，格子真的重排
         06（2.0–4.0）弹幕跟着画面走   —— dm_main2 + 弹幕上滚 + 镜头聚焦弹幕栏
         07（4.0–6.0）拖着竖的，他自己跟上 —— 右侧竖屏窗口 16:9→9:16 连续变形

         色场：sc-white（照参考片白底 7.92–15.33s），软件窗口仍是 theme.py 深灰。
         布局：cells 规格逐条照 ddm/layouts.py。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }

      :root {
        --bg: #222428; --sidebar: #1d2023; --content: #303338; --elevated: #373a3e;
        --hover: #3b3e42; --tile: #101114; --accent: #00a1d6; --accent-soft: rgba(0,161,214,.16);
        --pink: #fb7299; --text1: #f1f2f5; --text2: rgba(214,218,224,.9); --text3: rgba(184,189,197,.75);
        --border: rgba(131,131,145,.16); --border-strong: rgba(255,255,255,.12);
        --sc-white: #f8f8f8; --ink: #101114; --ink-2: rgba(16,17,20,.66);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sc-white);
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased; color: var(--ink);
      }
      .scene { position: absolute; inset: 0; }

      /* ---------- 标题（深字压白底）---------- */
      .h {
        position: absolute; left: 0; right: 0; text-align: center;
        font-weight: 700; letter-spacing: -.01em; line-height: 1.02;
        color: var(--ink); will-change: transform, opacity;
      }
      .h .s { display: block; margin-top: 14px; font-size: 30px; font-weight: 600;
              letter-spacing: .16em; color: var(--ink-2); }
      #h05 { top: 58px; font-size: 84px; }
      /* 06 的标题放在**右上角**：手稿是「左侧软件页面 + 右侧标题」，两者必须并排不重叠。
         ⚠ 原来写 top: 250px —— 和 #appwin 的 y:252 同高，而窗口宽 1382（右缘 1522），
         标题框 1150–1810 有 372px 压在窗口上；标题在 DOM 里先于窗口，直接被窗口盖住，
         只剩右半截"着画面走"露在白底上（实测就是这样）。而且标题色是 #101114，
         压在深灰窗口上也读不出来。窗口在 06 段最高到 y252、最低到 y1044，
         标题高 120px 只有落在 y<252 才安全。 */
      #h06 { top: 60px; left: auto; right: 110px; width: 660px; text-align: right; font-size: 74px; }
      /* 07：标题放**左上**（用户 2026-09-22，照他给的排版截图），位置再往下到黄框区域 */
      #h07 { top: 250px; left: 110px; right: auto; width: 1080px; text-align: left; font-size: 76px; }

      /* ---------- 软件窗口（theme.py 深灰）---------- */
      /* 窗口比例跟着素材走：录屏裁到内容边界后是 3271x1822 = 1.795，
         所以窗口用 1382x770（而不是 792）—— 不然 cover 会再切掉一条边。 */
      .appwin {
        position: absolute; left: 250px; top: 252px; width: 1382px; height: 770px;
        background: var(--bg); border: 1px solid var(--border-strong);
        border-radius: 12px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.3);
      }
      #appwin { left: 0; top: 0; }
      /* 窗口内容 = **真实素材**（录屏截图 / 录屏视频），铺满整个窗口。
         用户 2026-09-22：不要用合成的软件界面 —— 现在连侧栏都在素材里，
         窗口内没有任何我用 HTML 画的东西。 */
      .win-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      /* ---------- 07 竖屏窗口 ----------
         尺寸按**素材真实比例**：切换竖屏.mp4 的 08–12s 裁到内容边界后是 1362x2160 = 0.631
         （**不是 9:16**，用户指出的"右侧多一块黑边、左侧内容被切掉"就是硬套 9:16 造成的）。
         这里取 642x1017 保持同比例，只做位移飞入。
         ⚠ 不要补间这个容器的 width/height：实测只要它在变形，里面的 <video> 帧就整个丢失、
         竖屏窗口全黑。也**不要写 will-change**（SCRIPT 第十节那条禁忌）。 */
      .portrait {
        position: absolute; left: 0; top: 63px; width: 642px; height: 1017px;
        background: var(--bg); border: 1px solid var(--border-strong); border-radius: 12px;
        overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.3);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-02-layout" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="scene" id="scene">

        <div class="h" id="h05">想怎么看，就怎么排</div>
        <div class="h" id="h06">弹幕跟着画面走<span class="s">1 + 1 + 弹幕</span></div>
        <div class="h" id="h07">拖成竖的，他自己跟上<span class="s">动态切换竖屏，让你游戏之余，也能监控</span></div>

        <!-- 软件窗口 —— 内容**全部是真实录屏素材**（用户 2026-09-22）：
             05 用四张从 `Video_reference/布局切换.mp4` 裁出的布局截图
             （1x1 / 1x2 / 2x2 / 1+5，手稿 05 写的就是"[图片形式]"），
             06 起换成 `Video_reference/弹幕.mp4` 的真实录屏（1+1+弹幕布局）。
             窗口内不再有任何 HTML 画的界面，连侧栏都含在素材里。 -->
        <div class="appwin" id="appwin">
          <img class="win-media" id="shot1x1" src="assets/rec/layout-1x1.png" alt="">
          <img class="win-media" id="shot1x2" src="assets/rec/layout-1x2.png" alt="">
          <img class="win-media" id="shot2x2" src="assets/rec/layout-2x2.png" alt="">
          <img class="win-media" id="shotCorner" src="assets/rec/layout-corner.png" alt="">
          <video class="win-media" id="vidDm" src="assets/rec/rec-danmaku.mp4" muted playsinline
                 data-start="1.96" data-duration="4.04"></video>
        </div>

        <!-- 07 竖屏窗口（右侧飞入）—— 真实录屏。
             用户 2026-09-22：取 `切换竖屏.mp4` 的 **08–12s** 那段（从 0 开始是黑场/不对的画面）。
             这里直接把那 4 秒**预裁成独立文件**（`assets/rec/rec-portrait.mp4`，1382x778/30fps），
             而不是用 data-media-start 让渲染器去 seek —— 实测 seek 到 8s 时首帧没就绪，
             竖屏窗口会整块黑掉。预裁之后 video 从 0 播就是那一段。 -->
        <div class="portrait" id="portrait">
          <video class="win-media" id="vidPortrait" src="assets/rec/rec-portrait.mp4" muted playsinline
                 data-start="4.16" data-duration="1.84"></video>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";

        var tl = gsap.timeline({ paused: true });

        /* ---- 基线（时间轴外）----
           窗口里的素材全部先隐藏，由时间轴逐张点亮。 */
        gsap.set(".win-media", { opacity: 0 });
        gsap.set("#appwin", { x: 250, y: 252, width: 1382, height: 770, opacity: 0, scale: 1 });
        gsap.set("#h05", { opacity: 0, y: 26 });
        gsap.set("#h06", { opacity: 0, x: 40 });
        gsap.set("#h07", { opacity: 0, y: -22 });
        gsap.set("#portrait", { opacity: 0, x: 1600 });

        /* ============ 05（0.0–2.0）四档布局依次切换 ============
           四张图都是从 `Video_reference/布局切换.mp4` 裁出来的**真实截图**，对应录屏里
           1x1(0–10s) → 1x2(10.4s) → 2x2(15.6s) → 1+5(20.8s) 那四次切换。
           叠放 + 依次点亮：后一张盖住前一张，不必把前面的淡出。 */
        tl.fromTo("#appwin", { opacity: 0, scale: 0.98 },
          { opacity: 1, scale: 1, duration: 0.44, ease: EASE_OUT, immediateRender: false }, 0);
        tl.to("#shot1x1", { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, 0.12);
        tl.to("#shot1x2", { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 0.62);
        tl.to("#shot2x2", { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 1.10);
        tl.to("#shotCorner", { opacity: 1, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 1.58);
        tl.fromTo("#h05", { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 0.08);
        tl.to({}, { duration: 0.01 }, 1.86);

        /* ============ 06（2.0–4.0）切到真实弹幕录屏 + 软件左移 + 镜头聚焦 ============ */
        tl.to("#h05", { opacity: 0, y: -20, duration: 0.28, ease: EASE_OUT, immediateRender: false }, 1.90);
        /* 四张布局图一起退场，`弹幕.mp4`（1+1+弹幕的真实录屏）接上 */
        tl.to("#shot1x1, #shot1x2, #shot2x2, #shotCorner",
          { opacity: 0, duration: 0.34, ease: EASE_OUT, immediateRender: false }, 1.96);
        tl.to("#vidDm", { opacity: 1, duration: 0.34, ease: EASE_OUT, immediateRender: false }, 1.96);
        /* 接续 05 的画面把软件页面**左移**（用户 2026-09-22）：
           x 250 → -250，左侧有 250px 被画面边缘遮掉 —— 手稿 06 就是「左侧软件页面
           + 右侧标题」，让出右侧给飞入的标题。 */
        tl.to("#appwin", { x: -250, y: 252, duration: 0.5, ease: EASE_IO, immediateRender: false }, 2.00);
        tl.fromTo("#h06", { opacity: 0, x: 40 },
          { opacity: 1, x: 0, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 2.06);
        /* 镜头聚焦弹幕栏：整体推近并右移（弹幕滚动本身在录屏里，不用再自己补） */
        tl.to("#appwin", { scale: 1.16, x: -40, y: 220, duration: 0.9, ease: EASE_IO, immediateRender: false }, 3.00);

        /* ============ 07（4.0–6.0）竖屏窗口飞入 + 16:9 → 9:16 连续变形 ============ */
        tl.to("#h06", { opacity: 0, x: 30, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 3.94);
        tl.fromTo("#h07", { opacity: 0, y: -22 },
          { opacity: 1, y: 0, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 4.02);
        /* 07 的排版照用户 2026-09-22 给的标注截图（绿框=竖屏区、红框=横屏区、黄框=标题区）：
           **左侧横屏窗口在左下、右侧竖屏窗口更大、两者底边对齐**，标题在左上（黄框，再往下移）。
           - #appwin（红框）：scale .675 / x -224 / y 417 → box (0, 546, 933, 534)，
             左缘贴画面左边、下沿正好落 1080
           - #portrait（绿框）：572x1017 / x 1204 / y 63 → 保持 9:16，取绿框内的最大内接矩形
             （绿框 x 1135-1846 / y 63-1080，宽 711 的 0.80 = 572），底边同样 1080 与横屏齐平；
             左缘 1204 与横屏右缘 933 相距 271px
           淡入与 16:9 → 9:16 的变形同时开始（4.16）——补的是不同属性，不会互相抢占 transform；
           错开开始时间反而会让 x 在两个 tween 之间跳变。 */
        tl.to("#appwin", { scale: 0.675, x: -224, y: 417, duration: 0.7, ease: EASE_IO, immediateRender: false }, 4.06);
        /* 竖屏窗口尺寸按素材比例写在 CSS 里（642x1017），这里只补位移 + 淡入 ——
           x 1169 = 绿框（1135–1846）里水平居中；尺寸不变 video 帧才不会丢。 */
        tl.fromTo("#portrait", { opacity: 0, x: 1600 },
          { opacity: 1, x: 1169, duration: 1.04, ease: EASE_IO, immediateRender: false }, 4.16);
        tl.to("#vidPortrait", { opacity: 1, duration: 0.6, ease: EASE_OUT, immediateRender: false }, 4.16);

        tl.to({}, { duration: 0.01 }, 5.99);

        window.__timelines = window.__timelines || {};
        window.__timelines["18-02-layout"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
