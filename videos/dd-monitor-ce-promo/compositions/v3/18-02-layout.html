<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-02-layout  ——  B 组：05–07（0.0–6.0s）
         05（0.0–2.0）想怎么看，就怎么排 —— 单屏→两分→四分→1+5，格子真的重排
         06（2.0–4.0）弹幕跟着画面走   —— dm_main2 + 弹幕上滚 + 镜头聚焦弹幕栏
         07（4.0–6.0）拖着竖的，他自己跟上 —— 右侧竖屏窗口 16:9→9:16 连续变形

         色场：sc-white（照参考片白底 7.92–15.33s），软件窗口仍是 theme.py 深灰。
         布局：cells 规格逐条照 ddm/layouts.py。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }

      :root {
        --bg: #222428; --sidebar: #1d2023; --content: #303338; --elevated: #373a3e;
        --hover: #3b3e42; --tile: #101114; --accent: #00a1d6; --accent-soft: rgba(0,161,214,.16);
        --pink: #fb7299; --text1: #f1f2f5; --text2: rgba(214,218,224,.9); --text3: rgba(184,189,197,.75);
        --border: rgba(131,131,145,.16); --border-strong: rgba(255,255,255,.12);
        --sc-white: #f8f8f8; --ink: #101114; --ink-2: rgba(16,17,20,.66);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sc-white);
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased; color: var(--ink);
      }
      .scene { position: absolute; inset: 0; }

      /* ---------- 标题（深字压白底）---------- */
      .h {
        position: absolute; left: 0; right: 0; text-align: center;
        font-weight: 700; letter-spacing: -.01em; line-height: 1.02;
        color: var(--ink); will-change: transform, opacity;
      }
      .h .s { display: block; margin-top: 14px; font-size: 30px; font-weight: 600;
              letter-spacing: .16em; color: var(--ink-2); }
      #h05 { top: 58px; font-size: 84px; }
      /* 06 的标题放在**右上角**：手稿是「左侧软件页面 + 右侧标题」，两者必须并排不重叠。
         ⚠ 原来写 top: 250px —— 和 #appwin 的 y:252 同高，而窗口宽 1382（右缘 1522），
         标题框 1150–1810 有 372px 压在窗口上；标题在 DOM 里先于窗口，直接被窗口盖住，
         只剩右半截"着画面走"露在白底上（实测就是这样）。而且标题色是 #101114，
         压在深灰窗口上也读不出来。窗口在 06 段最高到 y252、最低到 y1044，
         标题高 120px 只有落在 y<252 才安全。 */
      #h06 { top: 60px; left: auto; right: 110px; width: 660px; text-align: right; font-size: 74px; }
      #h07 { top: 58px; font-size: 76px; }

      /* ---------- 软件窗口（theme.py 深灰）---------- */
      .appwin {
        position: absolute; left: 250px; top: 252px; width: 1382px; height: 792px;
        display: flex; background: var(--bg); border: 1px solid var(--border-strong);
        border-radius: 12px; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.3);
      }
      #appwin { left: 0; top: 0; }
      /* 侧栏 = **真实截图切片** real-sidebar.png（从 Video_reference/fullscreen.png 裁出）。
         用户 2026-09-22：不要用合成的软件界面。
         尺寸按窗口高度等比缩放、不拉伸 —— 截图里侧栏是 440x2100，窗口高 792，
         缩放 792/2100 = 0.3771 → 宽 166px。 */
      .sb { width: 166px; flex: 0 0 166px; position: relative; overflow: hidden;
            background: var(--sidebar); border-right: 1px solid var(--border); }
      .sb-img { display: block; width: 100%; height: 100%; }
      .mn { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
      .sp { flex: 1; }

      /* ---------- 画面墙：格子绝对定位，位置由 JS 按 layouts.py 的 cells 算 ---------- */
      .wall { position: relative; flex: 1; min-height: 0; }
      /* 格子统一钉在 (0,0)，位移全部交给 transform 的 x/y。
         不要补间 left/top —— 布局属性会吸附到整数设备像素，慢镜头或 ease-out
         尾巴在逐帧 seek 的渲染器下会一顿一顿的。宽高仍用 CSS 补间：视频渲染是
         离线逐帧截图，layout 成本不进成片，而 transform 缩放会把格子里的
         文字/控制条一起拉变形。 */
      .tile {
        position: absolute; left: 0; top: 0; background: var(--tile); border: 1px solid var(--border);
        border-radius: 10px; overflow: hidden; will-change: transform, opacity;
      }
      .tile.focus { border-color: rgba(0,161,214,.7); }
      /* 格子内容 = **真实直播画面切片**（real-main / real-s02 … 同样是 fullscreen.png 裁出来的）。
         用户 2026-09-22：不要用合成的画面。object-fit: cover 让切片填满任意格子比例。 */
      .tile-img { display: block; width: 100%; height: 100%; object-fit: cover; }

      /* 弹幕格 */
      .dm { position: absolute; inset: 0; background: rgba(18,20,25,.96); display: flex; flex-direction: column; }
      .dm-hd { height: 30px; flex: 0 0 30px; display: flex; align-items: center; gap: 7px; padding: 0 10px;
               background: rgba(255,255,255,.025); border-bottom: 1px solid rgba(255,255,255,.07); }
      .dm-dot { color: var(--pink); font-size: 9px; }
      .dm-t { font-size: 12px; font-weight: 700; color: var(--text1); }
      .dm-c { margin-left: auto; font-size: 11px; color: #6bd8ff; background: rgba(0,174,236,.16); border-radius: 9px; padding: 0 8px; }
      .dm-body { flex: 1; min-height: 0; overflow: hidden; position: relative; }
      .dm-roll { position: absolute; left: 10px; right: 10px; top: 0; will-change: transform; }
      .dm-line { font-size: 12px; line-height: 1.9; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---------- 07 竖屏窗口 ---------- */
      .portrait {
        position: absolute; left: 0; top: 0; width: 430px; height: 780px;
        background: var(--bg); border: 1px solid var(--border-strong); border-radius: 12px;
        overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.3);
        will-change: transform, opacity;
      }
      .portrait .mn { height: 100%; }
      .pt-main { position: absolute; left: 10px; right: 10px; height: 236px; background-color: var(--tile);
                 border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
                 background-size: cover; background-position: center; }
      .pt-row { position: absolute; left: 10px; right: 10px; height: 200px; display: flex; gap: 6px; }
      .pt-row > div { flex: 1; background-color: var(--tile); border: 1px solid var(--border); border-radius: 10px;
                      overflow: hidden; position: relative; background-size: cover; background-position: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-02-layout" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="scene" id="scene">

        <div class="h" id="h05">想怎么看，就怎么排</div>
        <div class="h" id="h06">弹幕跟着画面走<span class="s">1 + 1 + 弹幕</span></div>
        <div class="h" id="h07">拖着竖的，他自己跟上<span class="s">动态切换竖屏，让你游戏之余，也能监控</span></div>

        <!-- 软件窗口：侧栏与格子内容**全部换成真实截图切片**（用户 2026-09-22：
             不要用合成的软件界面）。窗口外壳仍是 DOM（布局重排必须重排格子），
             但里面已经没有任何我用 HTML 画的假数据。 -->
        <div class="appwin" id="appwin">
          <aside class="sb"><img class="sb-img" src="assets/real/real-sidebar.png" alt=""></aside>
          <main class="mn">
            <!-- 9 个格子槽位：位置由 JS 按布局算，多余的淡出。
                 内容 = 真实直播画面切片（real-main + 5 个小格，同 fullscreen.png 裁出）。 -->
            <div class="wall" id="wall">
              <div class="tile" data-tile><img class="tile-img" src="assets/real/real-main.png" alt=""></div>
              <div class="tile" data-tile><img class="tile-img" src="assets/real/real-s02.png" alt=""></div>
              <div class="tile" data-tile><img class="tile-img" src="assets/real/real-s12.png" alt=""></div>
              <div class="tile" data-tile><img class="tile-img" src="assets/real/real-s20.png" alt=""></div>
              <div class="tile" data-tile><img class="tile-img" src="assets/real/real-s21.png" alt=""></div>
              <div class="tile" data-tile><img class="tile-img" src="assets/real/real-s22.png" alt=""></div>
              <!-- 弹幕格（06 用）—— 弹幕文本仍是占位，等真实素材（M3）替换 -->
              <div class="tile" data-tile id="tileDm">
                <div class="dm">
                  <div class="dm-hd"><span class="dm-dot">●</span><span class="dm-t">弹幕</span><span class="dm-c">已连接</span></div>
                  <div class="dm-body"><div class="dm-roll" id="dmRoll">
                    <div class="dm-line">莉蔻Liko：这个布局太爽了</div>
                    <div class="dm-line">羽啾chu2u：九路同开不卡吗</div>
                    <div class="dm-line">星野Aki：主画面钉住真好用</div>
                    <div class="dm-line">路人甲：终于不用开一堆窗口</div>
                    <div class="dm-line">柊镜Kagami：竖屏也能监控？</div>
                    <div class="dm-line">夜见Yomi：左右声道是独一份</div>
                    <div class="dm-line">白鹤Haku：这墙滚起来真有感觉</div>
                    <div class="dm-line">莉蔻Liko：弹幕格还能单独调</div>
                    <div class="dm-line">羽啾chu2u：缓冲速度确实快</div>
                    <div class="dm-line">星野Aki：内存占用也低</div>
                    <div class="dm-line">路人乙：开源免费好评</div>
                    <div class="dm-line">柊镜Kagami：插件还能自己写</div>
                  </div></div>
                </div>
              </div>
            </div>
          </main>
        </div>

        <!-- 07 竖屏窗口（右侧飞入） -->
        <div class="portrait" id="portrait">
          <main class="mn" style="position:relative;">
            <div class="pt-main" style="background-image: url('assets/real/real-main.png')"></div>
            <div class="pt-row" style="top: 262px;"><div style="background-image: url('assets/real/real-s02.png')"></div><div style="background-image: url('assets/real/real-s12.png')"></div></div>
            <div class="pt-row" style="top: 474px;"><div style="background-image: url('assets/real/real-s20.png')"></div><div style="background-image: url('assets/real/real-s21.png')"></div></div>
          </main>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";

        /* ============ 布局引擎：cells 规格逐条照 ddm/layouts.py ============ */
        var LAYOUTS = {
          "1x1":  { rows: 1, cols: 1, cells: [[0,0,1,1]] },
          "1x2":  { rows: 1, cols: 2, cells: [[0,0,1,1],[0,1,1,1]] },
          "2x2":  { rows: 2, cols: 2, cells: [[0,0,1,1],[0,1,1,1],[1,0,1,1],[1,1,1,1]] },
          /* corner 主画面 + 5 小环绕 */
          "corner": { rows: 3, cols: 3, cells: [[0,0,2,2],[0,2,1,1],[1,2,1,1],[2,0,1,1],[2,1,1,1],[2,2,1,1]] },
          /* danmaku_side(2)：主画面 + 1 小 + 弹幕（第 3 格是弹幕） */
          "dm_main2": { rows: 2, cols: 3, cells: [[0,0,2,2],[0,2,1,1],[1,2,1,1]], danmaku: 2 }
        };
        var GAP = 6, PAD = 10;
        var wall = document.getElementById("wall");
        var tiles = Array.prototype.slice.call(document.querySelectorAll("[data-tile]"));

        function geom(cell, spec) {
          var w = wall.clientWidth - PAD * 2, h = wall.clientHeight - PAD * 2;
          var cw = (w - GAP * (spec.cols - 1)) / spec.cols;
          var ch = (h - GAP * (spec.rows - 1)) / spec.rows;
          var row = cell[0], col = cell[1], rs = cell[2], cs = cell[3];
          return {
            x: PAD + col * (cw + GAP),
            y: PAD + row * (ch + GAP),
            w: cw * cs + GAP * (cs - 1),
            h: ch * rs + GAP * (rs - 1)
          };
        }

        /* 把布局铺进时间轴。
           位移用 transform 的 x/y —— left/top 会吸附到整数设备像素，慢镜头或 ease-out
           尾巴在逐帧 seek 的渲染器下会一顿一顿的。
           宽高仍用 CSS 补间：离线逐帧渲染不在乎 layout 成本，而 transform 缩放会把
           格子里的文字/控制条一起拉变形，那是错的。

           ⚠ 不能用 tl.call()：渲染器是 seek(t, suppressEvents=true) 跳帧取画，
           callback 不会触发（实测：只有首帧的同步布局生效，后续全停住）。
           所有布局变化都必须写成时间轴上的补间。 */
        var SEQ = [
          { t: 0.20, name: "1x1",      dur: 0.01 },
          { t: 0.62, name: "1x2",      dur: 0.40 },
          { t: 1.10, name: "2x2",      dur: 0.40 },
          { t: 1.58, name: "corner",   dur: 0.40 },
          { t: 2.30, name: "dm_main2", dur: 0.48 }
        ];

        function buildLayoutTrack(tl) {
          var pool = tiles.filter(function (t) { return t.id !== "tileDm"; });
          var dmEl = document.getElementById("tileDm");
          SEQ.forEach(function (step) {
            var spec = LAYOUTS[step.name];
            var dmIdx = spec.danmaku != null ? spec.danmaku : -1;
            var normal = [], dmCell = null;
            spec.cells.forEach(function (c, i) {
              if (i === dmIdx) { dmCell = c; } else { normal.push(c); }
            });
            pool.forEach(function (el, i) {
              var cell = normal[i];
              if (cell) {
                var g = geom(cell, spec);
                tl.to(el, { x: g.x, y: g.y, width: g.w, height: g.h, opacity: 1,
                            duration: step.dur, ease: EASE_IO }, step.t);
              } else {
                tl.to(el, { opacity: 0, duration: Math.min(0.22, step.dur) }, step.t);
              }
            });
            if (dmCell) {
              var g2 = geom(dmCell, spec);
              tl.to(dmEl, { x: g2.x, y: g2.y, width: g2.w, height: g2.h, opacity: 1,
                            duration: step.dur, ease: EASE_IO }, step.t);
            } else {
              tl.to(dmEl, { opacity: 0, duration: Math.min(0.22, step.dur) }, step.t);
            }
          });
        }

        var tl = gsap.timeline({ paused: true });

        /* ---- 基线（时间轴外）---- */
        gsap.set("#appwin", { x: 250, y: 252, width: 1382, height: 792, opacity: 0, scale: 1 });
        gsap.set("#h05", { opacity: 0, y: 26 });
        gsap.set("#h06", { opacity: 0, x: 40 });
        gsap.set("#h07", { opacity: 0, y: -22 });
        gsap.set("#portrait", { opacity: 0, width: 700, height: 480, x: 1140, y: 320 });
        gsap.set("#tileDm", { opacity: 0 });
        /* 格子初始收在 1x1 的位置，避免首帧闪一个错布局 */
        (function () {
          var spec = LAYOUTS["1x1"], g = geom([0, 0, 1, 1], spec);
          gsap.set(tiles.filter(function (t) { return t.id !== "tileDm"; }),
                   { x: g.x, y: g.y, width: g.w, height: g.h, opacity: 0 });
        })();

        /* 布局轨道铺进时间轴 */
        buildLayoutTrack(tl);

        /* ============ 05（0.0–2.0）单屏 → 两分 → 四分 → 1+5 ============ */
        tl.fromTo("#appwin", { opacity: 0, scale: 0.98 },
          { opacity: 1, scale: 1, duration: 0.44, ease: EASE_OUT, immediateRender: false }, 0);
        tl.fromTo("#h05", { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 0.08);
        tl.to({}, { duration: 0.01 }, 1.86);

        /* ============ 06（2.0–4.0）弹幕布局 + 弹幕上滚 + 镜头聚焦 ============ */
        tl.to("#h05", { opacity: 0, y: -20, duration: 0.28, ease: EASE_OUT, immediateRender: false }, 1.90);
        /* 接续 05 的画面把软件页面**左移**（用户 2026-09-22）：
           x 250 → -250，左侧有 250px 被画面边缘遮掉 —— 手稿 06 就是「左侧软件页面
           + 右侧标题」，让出右侧给飞入的标题。 */
        tl.to("#appwin", { x: -250, y: 252, duration: 0.5, ease: EASE_IO, immediateRender: false }, 2.00);
        tl.fromTo("#h06", { opacity: 0, x: 40 },
          { opacity: 1, x: 0, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 2.06);
        /* 弹幕格点亮：直接补间描边（class 切换没法在时间轴上 seek） */
        tl.to("#tileDm", { borderColor: "rgba(0,161,214,.7)", duration: 0.30, immediateRender: false }, 2.30);
        /* 弹幕连续上滚（全片唯一持续运动，linear）—— 同样必须在时间轴上 */
        tl.fromTo("#dmRoll", { y: 0 }, { y: -230, duration: 2.0, ease: "none", immediateRender: false }, 2.30);
        /* 镜头聚焦弹幕栏：整体推近并右移，让弹幕格成为主体 */
        tl.to("#appwin", { scale: 1.16, x: -40, y: 220, duration: 0.9, ease: EASE_IO, immediateRender: false }, 3.00);

        /* ============ 07（4.0–6.0）竖屏窗口飞入 + 16:9 → 9:16 连续变形 ============ */
        tl.to("#h06", { opacity: 0, x: 30, duration: 0.26, ease: EASE_OUT, immediateRender: false }, 3.94);
        tl.fromTo("#h07", { opacity: 0, y: -22 },
          { opacity: 1, y: 0, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 4.02);
        /* 左半保留 06 定格（缩小推到左侧），右半飞入竖屏 */
        tl.to("#appwin", { scale: 0.62, x: -420, y: 252, duration: 0.7, ease: EASE_IO, immediateRender: false }, 4.06);
        /* 飞入的淡入与 16:9 → 9:16 的变形同时开始（4.16）——两个 tween 补的是不同属性，
           不会互相抢占 transform；错开开始时间反而会让 x 在两个 tween 之间跳变。
           16:9 → 9:16：宽度收窄、高度长出，位置从右侧移到右上。 */
        tl.fromTo("#portrait", { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: EASE_OUT, immediateRender: false }, 4.16);
        /* 竖屏终态 x 880 / y 200（用户 2026-09-22：下方的两个软件页面排得靠近一些）。
           左侧 06 缩到 scale .62 后 box 右缘约 700，竖屏左缘 880 → 间距 180px；
           y 200 也避开上方标题（标题占 y 58–180）。 */
        tl.fromTo("#portrait", { width: 700, height: 480, x: 1140, y: 320 },
          { width: 430, height: 780, x: 880, y: 200, duration: 1.04, ease: EASE_IO, immediateRender: false }, 4.16);

        tl.to({}, { duration: 0.01 }, 5.99);

        window.__timelines = window.__timelines || {};
        window.__timelines["18-02-layout"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
