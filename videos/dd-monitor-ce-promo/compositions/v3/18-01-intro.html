<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-01-intro  ——  A 组：01–04（0.0–8.0s）
         01 视角向右移动 · 左侧浮现软件标题
         02 标题消失 · 空软件出现 · 各部件向软件飞入填充（1+5）
         03 视角突然向前推进 · 软件按部件拆开
         04 各部件消散 · 出现标题「向您介绍 DDMonitorCE」

         ★ 软件画面 = **真实截图**（从 Video_reference/fullscreen.png 裁切），不再用 DOM 重绘：
            real-sidebar.png  侧栏（含真实关注列表 + 底部设置按钮）
            real-main.png     1+5 里的主画面「1」
            real-s02 / s12 / s20 / s21 / s22.png   剩下 5 个小格子
           格子内容为空（截图本身就是空 1+5），占位由 [素材] 层叠加。

         坐标：fullscreen 的软件窗口是 3840×2100，按 --s = 0.36 缩放进帧。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }

      :root {
        --sc-void: #0d0e10;
        --accent: #00a1d6;
        --text1: #f1f2f5; --text3: rgba(184,189,197,.75);
        --tile: #101114;
        --border: rgba(131,131,145,.16);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        /* 真实截图缩放：3840 -> 1382 */
        --s: 0.3599;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sc-void); perspective: 2000px;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        color: var(--text1); -webkit-font-smoothing: antialiased;
      }
      .camera { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }

      /* ---------- 软件窗口：真实截图切片 ---------- */
      .appwin {
        position: absolute; left: 269px; top: 152px; width: 1382px; height: 756px;
        transform-style: preserve-3d; will-change: transform, opacity;
      }
      .pt {
        position: absolute; display: block;
        image-rendering: auto;
        will-change: transform, opacity;
      }
      /* 侧栏（part1 + part3 已含在图里） */
      .pt-sb  { left: 0;                top: 0;                width: calc(440px * var(--s));  height: calc(2100px * var(--s)); }
      /* 主画面「1」 */
      .pt-main{ left: calc(455px * var(--s));  top: calc(75px * var(--s));   width: calc(2215px * var(--s)); height: calc(1350px * var(--s)); }
      /* 5 个小格 */
      .pt-s02 { left: calc(2680px * var(--s)); top: calc(75px * var(--s));   width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s12 { left: calc(2680px * var(--s)); top: calc(755px * var(--s));  width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s20 { left: calc(455px * var(--s));  top: calc(1435px * var(--s)); width: calc(1075px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s21 { left: calc(1540px * var(--s)); top: calc(1435px * var(--s)); width: calc(1130px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s22 { left: calc(2680px * var(--s)); top: calc(1435px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }

      /* 格子上的素材占位（叠在真实截图之上） */
      .ph {
        position: absolute; display: flex; align-items: center; justify-content: center;
        border-radius: 4px;
        background: repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 10px, transparent 10px 20px);
        will-change: transform, opacity;
      }
      .ph:after { content: ""; position: absolute; inset: 6px; border: 1px dashed rgba(131,131,145,.42); border-radius: 3px; }
      .ph span { position: relative; z-index: 2; font-size: 11px; font-weight: 600; color: rgba(184,189,197,.72); }

      /* ---------- 标题层 ---------- */
      .t1 { position: absolute; left: 118px; top: 470px; will-change: transform, opacity; }
      .t1 .n { font-size: 84px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
      .t1 .s { margin-top: 16px; font-size: 30px; font-weight: 600; letter-spacing: .18em; color: var(--text3); }
      .t1 .bar { width: 76px; height: 3px; background: var(--accent); margin-top: 22px; }

      .t2 {
        position: absolute; left: 0; right: 0; top: 460px; text-align: center;
        font-size: 78px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1;
        will-change: transform, opacity;
      }
      .t2 b { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-01-intro" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div class="camera" id="camera">
        <!-- 软件窗口：真实截图切片（1+5） -->
        <div class="appwin" id="appwin">
          <img class="pt pt-sb"   id="pSb"   src="assets/real/real-sidebar.png" alt="">
          <img class="pt pt-main" id="pMain" src="assets/real/real-main.png" alt="">
          <img class="pt pt-s02"  id="pS02"  src="assets/real/real-s02.png" alt="">
          <img class="pt pt-s12"  id="pS12"  src="assets/real/real-s12.png" alt="">
          <img class="pt pt-s20"  id="pS20"  src="assets/real/real-s20.png" alt="">
          <img class="pt pt-s21"  id="pS21"  src="assets/real/real-s21.png" alt="">
          <img class="pt pt-s22"  id="pS22"  src="assets/real/real-s22.png" alt="">
          <!-- 素材占位（叠在格子上） -->
          <div class="ph" id="phMain" style="left: calc(455px * var(--s)); top: calc(75px * var(--s)); width: calc(2215px * var(--s)); height: calc(1350px * var(--s));"><span>[素材: 主画面]</span></div>
          <div class="ph" id="phS02" style="left: calc(2680px * var(--s)); top: calc(75px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
          <div class="ph" id="phS12" style="left: calc(2680px * var(--s)); top: calc(755px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
          <div class="ph" id="phS20" style="left: calc(455px * var(--s)); top: calc(1435px * var(--s)); width: calc(1075px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
          <div class="ph" id="phS21" style="left: calc(1540px * var(--s)); top: calc(1435px * var(--s)); width: calc(1130px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
          <div class="ph" id="phS22" style="left: calc(2680px * var(--s)); top: calc(1435px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
        </div>
      </div>

      <div class="t1" id="t1">
        <div class="n">DD监控室CE</div>
        <div class="s">多窗口直播监控</div>
        <div class="bar"></div>
      </div>

      <div class="t2" id="t2">向您介绍 <b>DDMonitorCE</b></div>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";

        var PARTS = ["#pSb", "#pMain", "#pS02", "#pS12", "#pS20", "#pS21", "#pS22"];
        var PLACEHOLDERS = ["#phMain", "#phS02", "#phS12", "#phS20", "#phS21", "#phS22"];

        /* ---- 基线（时间轴外，避免首帧闪）---- */
        gsap.set("#appwin", { opacity: 0, scale: 0.97 });
        gsap.set("#t1", { opacity: 0, x: -60 });
        gsap.set("#t2", { opacity: 0, y: 24 });
        /* 部件飞入起点：从"用户视角"向软件冲入 */
        gsap.set(["#pSb"], { opacity: 0, x: -170, z: -260 });
        gsap.set(["#pMain"], { opacity: 0, z: -470, scale: 0.9 });
        gsap.set(["#pS02", "#pS12", "#pS20", "#pS21", "#pS22"], { opacity: 0, z: -360, scale: 0.88 });
        gsap.set(PLACEHOLDERS, { opacity: 1 });

        /* ================= 01（0.0–2.0）视角向右移动 + 左侧标题浮现 ================= */
        tl.fromTo("#camera", { x: 0, z: 0 },
          { x: -120, z: 0, duration: 2.0, ease: EASE_IO, immediateRender: false }, 0);
        tl.fromTo("#t1", { opacity: 0, x: -60 },
          { opacity: 1, x: 0, duration: 0.42, ease: EASE_OUT, immediateRender: false }, 0.30);
        tl.fromTo("#t1 .bar", { scaleX: 0 },
          { scaleX: 1, duration: 0.34, ease: EASE_OUT, immediateRender: false }, 0.56);
        tl.to("#t1", { opacity: 0, x: -40, duration: 0.32, ease: EASE_OUT, immediateRender: false }, 1.72);

        /* ================= 02（2.0–4.0）空软件出现 + 各部件向软件飞入填充 ================= */
        tl.fromTo("#appwin", { opacity: 0, scale: 0.97 },
          { opacity: 1, scale: 1, duration: 0.44, ease: EASE_OUT, immediateRender: false }, 2.00);
        /* 侧栏先归位 */
        tl.to("#pSb", { opacity: 1, x: 0, z: 0, duration: 0.52, ease: EASE_OUT, immediateRender: false }, 2.22);
        /* 主画面「1」随后冲入 */
        tl.to("#pMain", { opacity: 1, z: 0, scale: 1, duration: 0.54, ease: EASE_OUT, immediateRender: false }, 2.40);
        /* 剩下 5 个小格依次归位，落位时占位描边闪一次 accent */
        tl.to(["#pS02", "#pS12", "#pS20", "#pS21", "#pS22"],
          { opacity: 1, z: 0, scale: 1, duration: 0.46, ease: EASE_OUT,
            stagger: 0.07, immediateRender: false }, 2.58);

        /* ================= 03（4.0–6.0）视角突然向前推进 + 按部件拆开 ================= */
        tl.fromTo("#camera", { x: -120, z: 0 },
          { x: -60, z: 240, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.00);
        tl.to("#pSb", { x: -150, z: 40, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.06);
        tl.to("#pMain", { z: 210, scale: 1.03, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.06);
        tl.to("#phMain", { z: 210, scale: 1.03, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.06);
        tl.to("#pS02", { x: 96, y: -56, z: 150, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.08);
        tl.to("#pS12", { x: 106, z: 150, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.10);
        tl.to("#pS20", { x: 62, y: 80, z: 150, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.12);
        tl.to("#pS21", { y: 94, z: 150, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.14);
        tl.to("#pS22", { x: 78, y: 86, z: 150, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.16);

        /* ================= 04（6.0–8.0）各部件消散 + 中央标题 ================= */
        tl.to("#appwin", { opacity: 0, scale: 1.06, duration: 0.42, ease: EASE_OUT, immediateRender: false }, 6.00);
        tl.fromTo("#t2", { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.52, ease: EASE_OUT, immediateRender: false }, 6.36);

        tl.to({}, { duration: 0.01 }, 7.99);

        window.__timelines = window.__timelines || {};
        window.__timelines["18-01-intro"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
