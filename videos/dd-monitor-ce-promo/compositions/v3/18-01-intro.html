<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-01-intro  ——  A 组（0.0–12.0s）

         0.0–5.0  视角向右移动。**只有背景在动**，软件窗口固定在画布正中不动，
                  只做「图片 3D」式的立体效果（-13° → -8° 俯角 + 轻微偏转，全程保持透视）
                  · 背景横移量照参考片开场实测：5.0s / 262px，峰值 125px/s、均速 52px/s
                  · 左上角暖光从窗口下方透出来；窗口另有冷光晕 + 地面投影
                  · 标题放在窗口上方，视角走到一半（约 2.4s）时隐去
         5.0–6.5  相机向前推进（elastic 回稳）
         6.5–8.35 软件模块（侧栏 / 主画面 / 5 小格）分散拆解飞出画面
                  **保留软件主体**（留下的窗口外壳，不透出背景）
         8.35–10.0 继续向前推进 + 放大，直到看不到背景图
         10.1–12.0 文字「向您介绍 DDMonitorCE」叠在保留的窗口壳上

         软件画面 = 真实截图切片（Video_reference/fullscreen.png 裁切）。
         窗口本身铺软件底色 #222428 —— 切片之间的缝隙不会透出背后背景。

         ⚠ 会毁掉画面的禁忌（都是实测踩出来的，详见 SCRIPT-v3.md 第十节）：
         · 祖先层不能写 transform-style: preserve-3d —— 子层做 3D 变换时 Chrome 会把
           窗口绘制裁到局部 y≈363，下半部分连底色都不画，直接透出背景。
           立体感改用元素自带的 transformPerspective。
         · 参与 3D 的元素不要写 will-change:transform，也不要靠父层 overflow:hidden 裁圆角
           —— 前者让窗口被按布局尺寸裁切，后者会把"飞出画面"的模块整块剪掉。
         · 大图（背景）横移必须给 will-change:transform，否则每帧重新光栅化会掉帧。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }

      :root {
        --accent: #00a1d6;
        --text1: #f1f2f5; --text3: rgba(241,242,245,.72);
        --appbg: #222428;               /* 软件底色：填住切片缝隙，背景不透 */
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        /* 真实截图缩放：3840 -> 1000（比上一版缩小） */
        --s: 0.2604;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #05060a;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        color: var(--text1); -webkit-font-smoothing: antialiased;
      }

      /* ---------- 背景层：只有它随"视角右移"平移 ----------
         窗口本身**固定不动**（不需要它靠过来，只给立体效果），所以位移全在背景上。
         量级照参考片开场实测：5.0s 走 262px（峰值 125px/s，均速 52px/s）。
         ⚠ 这里**绝对不能**写 transform-style: preserve-3d。
         在 preserve-3d 上下文里给子层做 3D 变换（rotationX / z），Chrome 会把该子层的
         绘制错误地裁切到局部 y≈363（实测窗口只剩 417/548 行可见，下半部分连窗口底色
         都不画，直接透出背景 —— 就是"软件缺少了下半部分图像"的真正原因）。
         立体感改用「元素自带 transformPerspective」实现（见 JS 基线部分）。 */
      .world {
        position: absolute; left: 0; top: 0; width: 2220px; height: 1080px;
      }
      /* 背景图不能超出 .world 的高度：在合成上下文里溢出父层会让 Chrome 用错误边界裁切。 */
      .bg {
        position: absolute; left: 0; top: 0; width: 2220px; height: 1080px;
        object-fit: cover; object-position: 50% 58%;
        display: block;
        /* 大图平移必须提升为合成层：否则每帧重新光栅化 2220×1080，
           位移会看起来一顿一顿的（用户反馈的"掉帧"）。 */
        will-change: transform;
      }
      .vignette {
        position: absolute; left: 0; top: 0; width: 2220px; height: 1080px;
        background: radial-gradient(ellipse 54% 58% at 58% 52%, transparent 0%, rgba(3,5,10,.42) 62%, rgba(3,5,10,.78) 100%);
      }

      /* ---------- 左上角暖光 ----------
         DOM 顺序排在 .appstage **之前**，所以它在窗口下方，只从窗口边缘透出来。
         照参考片截图：光晕中心大致在画面左上 28%/28% 处。 */
      .warm {
        position: absolute; left: -300px; top: -250px; width: 1580px; height: 1200px;
        background:
          radial-gradient(ellipse 46% 44% at 25% 25%,
            rgba(255,216,170,.92) 0%, rgba(255,176,116,.50) 32%, rgba(255,138,80,0) 70%),
          radial-gradient(ellipse 64% 56% at 12% 8%,
            rgba(255,190,138,.44) 0%, rgba(255,150,92,0) 66%);
        filter: blur(9px);
      }

      /* ---------- 悬浮的软件画面：固定在画布正中 ---------- */
      .appstage {
        position: absolute; left: 460px; top: 236px; width: 1000px; height: 547px;
      }
      /* 光晕 / 影子：**屏幕坐标的独立子层**，同样排在 .appstage 之前（窗口下方）。
         ⚠ 绝不能放回 .appstage 里 —— 那是参与 3D 的层，子元素溢出会让 Chrome
         用错误边界做裁切。坐标 = 窗口(460,236,1000×547) 向外扩。 */
      .glow {
        position: absolute; left: 190px; top: 6px; width: 1540px; height: 957px;
        background:
          radial-gradient(ellipse 42% 46% at 50% 45%,
            rgba(226,246,255,.46) 0%, rgba(140,215,255,.26) 28%, rgba(0,161,214,0) 64%),
          radial-gradient(ellipse 60% 62% at 50% 52%,
            rgba(0,161,214,.26) 0%, rgba(60,120,220,.12) 42%, rgba(0,161,214,0) 72%);
        filter: blur(12px);
      }
      .shadow {
        position: absolute; left: 520px; top: 811px; width: 880px; height: 64px;
        background:
          radial-gradient(ellipse 46% 46% at 50% 40%, rgba(0,0,0,.96) 0%, rgba(0,0,0,.72) 34%, rgba(0,0,0,0) 72%),
          radial-gradient(ellipse 54% 52% at 50% 44%, rgba(0,0,0,.78) 0%, rgba(0,0,0,.34) 48%, rgba(0,0,0,0) 80%);
        filter: blur(14px);
      }
      /* 软件主体：窗口外壳。铺软件底色，切片缝隙处不会透出背后背景。
         ⚠ 两件事都不能做：
         1) 不要写 will-change:transform —— 会让 Chrome 按布局尺寸给窗口建合成层，
            3D 投影超出该边界时下半部分被整块裁掉。
         2) 不要写 overflow:hidden —— 模块拆解"飞出画面"的 tween 会被它整块剪掉，
            看起来就是"在原点消失了"而不是飞出去。圆角裁切交给切片自己处理。 */
      .appwin {
        position: absolute; inset: 0;
        background: var(--appbg);
        border-radius: 12px;
        box-shadow:
          0 2px 6px rgba(0,0,0,.5),
          0 14px 34px rgba(0,0,0,.55),
          0 46px 90px rgba(0,0,0,.62),
          0 0 0 1px rgba(160,190,225,.14),
          0 -1px 0 0 rgba(200,225,255,.10) inset;
      }
      .pt { position: absolute; display: block; }
      /* 侧栏贴着窗口左缘和上下缘，自己带圆角（父层不再 overflow:hidden） */
      .pt-sb  { left: 0;                top: 0;                width: calc(440px * var(--s));  height: calc(2100px * var(--s)); border-radius: 12px 0 0 12px; }
      .pt-main{ left: calc(455px * var(--s));  top: calc(75px * var(--s));   width: calc(2215px * var(--s)); height: calc(1350px * var(--s)); }
      .pt-s02 { left: calc(2680px * var(--s)); top: calc(75px * var(--s));   width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s12 { left: calc(2680px * var(--s)); top: calc(755px * var(--s));  width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s20 { left: calc(455px * var(--s));  top: calc(1435px * var(--s)); width: calc(1075px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s21 { left: calc(1540px * var(--s)); top: calc(1435px * var(--s)); width: calc(1130px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s22 { left: calc(2680px * var(--s)); top: calc(1435px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }

      .ph {
        position: absolute; display: flex; align-items: center; justify-content: center;
        border-radius: 4px;
        background: repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 10px, transparent 10px 20px);
        /* ⚠ 这里**不能**写 will-change —— 见 .appwin 上方的说明。 */
      }
      .ph:after { content: ""; position: absolute; inset: 6px; border: 1px dashed rgba(131,131,145,.42); border-radius: 3px; }
      .ph span { position: relative; z-index: 2; font-size: 10px; font-weight: 600; color: rgba(184,189,197,.72); }

      /* ---------- 标题层（固定在屏幕上）----------
         窗口固定在画布正中，左侧不再有空间，标题改放窗口**上方**并与窗口左对齐。 */
      .t1 { position: absolute; left: 460px; top: 56px; will-change: transform, opacity; }
      .t1 .n { font-size: 74px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
      .t1 .s { margin-top: 14px; font-size: 26px; font-weight: 600; letter-spacing: .18em; color: var(--text3); }
      .t1 .bar { width: 76px; height: 3px; background: var(--accent); margin-top: 20px; transform-origin: 0 50%; }

      .t2 {
        position: absolute; left: 0; right: 0; top: 452px; text-align: center;
        font-size: 78px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1;
        will-change: transform, opacity;
      }
      .t2 b { color: var(--accent); }

      /* 星光层已按反馈移除 —— 结尾的氛围改由左上角的暖光（.warm）承担。 */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-01-intro" data-start="0" data-duration="12" data-width="1920" data-height="1080">
        <div class="world" id="world">
          <img class="bg" id="bg" src="assets/real/bg-hall.jpg" alt="">
          <div class="vignette" id="vignette"></div>
        </div>

        <!-- ⚠ 暖光 / 冷光晕 / 地面投影都是**屏幕坐标的独立子层**，
             顺序排在 .appstage 之前 = 压在窗口下方，只从窗口边缘透出来。
             绝不要放回 .appstage 里：那是参与 3D 的层，子元素溢出会让 Chrome
             用错误边界做裁切，把软件画面的下半部分整块切掉。 -->
        <div class="warm" id="warm"></div>
        <div class="glow" id="glow"></div>
        <div class="shadow" id="shadow"></div>

        <!-- 软件主体：固定在画布正中，不做横向位移，只做立体（3D）效果 -->
        <div class="appstage" id="appstage">
          <div class="appwin" id="appwin">
            <img class="pt pt-sb"   id="pSb"   src="assets/real/real-sidebar.png" alt="">
            <img class="pt pt-main" id="pMain" src="assets/real/real-main.png" alt="">
            <img class="pt pt-s02"  id="pS02"  src="assets/real/real-s02.png" alt="">
            <img class="pt pt-s12"  id="pS12"  src="assets/real/real-s12.png" alt="">
            <img class="pt pt-s20"  id="pS20"  src="assets/real/real-s20.png" alt="">
            <img class="pt pt-s21"  id="pS21"  src="assets/real/real-s21.png" alt="">
            <img class="pt pt-s22"  id="pS22"  src="assets/real/real-s22.png" alt="">
            <div class="ph" id="phMain" style="left: calc(455px * var(--s)); top: calc(75px * var(--s)); width: calc(2215px * var(--s)); height: calc(1350px * var(--s));"><span>[素材: 主画面]</span></div>
            <div class="ph" id="phS02" style="left: calc(2680px * var(--s)); top: calc(75px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
            <div class="ph" id="phS12" style="left: calc(2680px * var(--s)); top: calc(755px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
            <div class="ph" id="phS20" style="left: calc(455px * var(--s)); top: calc(1435px * var(--s)); width: calc(1075px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
            <div class="ph" id="phS21" style="left: calc(1540px * var(--s)); top: calc(1435px * var(--s)); width: calc(1130px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
            <div class="ph" id="phS22" style="left: calc(2680px * var(--s)); top: calc(1435px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
          </div>
        </div>

      <div class="t1" id="t1">
        <div class="n">DD监控室CE</div>
        <div class="s">多窗口直播监控</div>
        <div class="bar" id="t1bar"></div>
      </div>

      <div class="t2" id="t2">向您介绍 <b>DDMonitorCE</b></div>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";

        /* 背景横移量。照参考片开场实测（tools/analyze-motion.py）：
           5.0s 走 262px，峰值 125px/s、均速 52px/s。
           之前是 1440px / 5.4s = 267px/s —— 速度是参考片的 5 倍，24fps 下每帧要跳
           11px，看起来就是"掉帧"。现在降到 60px/s，每帧只跳 2.5px。 */
        var CAM = -300;

        /* ---- 基线 ---- */
        gsap.set("#world", { x: 0 });
        gsap.set("#warm", { opacity: 0 });
        gsap.set("#t1", { opacity: 0, x: -70 });
        gsap.set("#t1bar", { scaleX: 0 });
        gsap.set("#t2", { opacity: 0, y: 26 });
        gsap.set("#glow", { opacity: 0 });
        gsap.set("#shadow", { opacity: 0 });
        /* 窗口固定在画布正中，**不做横向位移**，只给立体效果。
           transformPerspective 直接写进元素自己的 transform —— 等价于父层透视，
           但不会引入 preserve-3d 上下文（那会把窗口下半部分裁掉）。 */
        gsap.set("#appstage", { transformPerspective: 2400, rotationX: -13, rotateY: 3.2, scale: 0.985 });
        /* 拆解飞出的切片各自也要透视，z 才有近大远小 */
        gsap.set(".pt, .ph", { transformPerspective: 1000 });
        gsap.set("#appwin", { opacity: 1, scale: 1, z: 0 });
        gsap.set("#vignette", { opacity: 1 });

        /* ====== 0.0–5.0 视角右移：**只有背景动，窗口不动** ======
           关键帧的位移比例直接抄参考片实测的归一化形状：
           0.220(1.0s) / 0.313(2.0s) / 0.504(3.3s) / 0.653(4.0s) / 1.000(5.0s)。
           "慢—中—快"两次呼吸都在里面，段内接近线性，没有 ease-in 的猛冲。 */
        tl.to("#world", { keyframes: [
          { x: CAM * 0.220, duration: 1.00, ease: "power1.out" },
          { x: CAM * 0.313, duration: 1.00, ease: "power1.inOut" },
          { x: CAM * 0.504, duration: 1.30, ease: "power1.inOut" },
          { x: CAM * 0.653, duration: 0.70, ease: "power1.in" },
          { x: CAM * 1.000, duration: 1.00, ease: "power1.out" }
        ] }, 0);

        /* 窗口的立体效果：像一张被斜放的图片，缓慢把角度收正一点点，
           **全程保持透视**（不做"放平到 0°"，那样立体感就没了）。 */
        tl.fromTo("#appstage", { rotationX: -13, rotateY: 3.2, scale: 0.985 },
          { rotationX: -8, rotateY: -1.4, scale: 1, duration: 5.00, ease: "power1.inOut", immediateRender: false }, 0);

        tl.fromTo("#warm",   { opacity: 0 }, { opacity: 1, duration: 1.60, ease: EASE_OUT, immediateRender: false }, 0.20);
        tl.fromTo("#glow",   { opacity: 0 }, { opacity: 1, duration: 1.80, ease: EASE_OUT, immediateRender: false }, 0.34);
        tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 2.20, ease: EASE_OUT, immediateRender: false }, 0.46);

        /* 标题：浮现 → 视角移动到一半（约 2.4s）时隐去 */
        tl.fromTo("#t1", { opacity: 0, x: -70 },
          { opacity: 1, x: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 0.30);
        tl.fromTo("#t1bar", { scaleX: 0 },
          { scaleX: 1, duration: 0.40, ease: EASE_OUT, immediateRender: false }, 0.58);
        tl.to("#t1", { opacity: 0, x: -48, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 2.36);

        /* ============ 5.0–6.5 相机向前推进（带弹性回稳）============ */
        tl.to("#appstage", { z: 230, duration: 1.50, ease: "elastic.out(1, 0.62)", immediateRender: false }, 5.00);
        tl.to("#glow",   { opacity: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 5.15);
        tl.to("#shadow", { opacity: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 5.15);

        /* ====== 6.5–8.35 模块分散拆解 · 飞出画面（保留软件主体）======
           每个模块都给 x/y 位移 —— 只做 z+opacity 会看起来"在原地消失"，而不是飞出去。 */
        var OUT = 1.85;
        tl.to("#pSb",   { x: -1020, y: -280, z: 420, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.50);
        tl.to("#pMain", { x: 190,  y: -620, z: 720, scale: 1.07, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.54);
        tl.to("#phMain",{ x: 190,  y: -620, z: 720, scale: 1.07, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.54);
        tl.to("#pS02",  { x: 340, y: -340, z: 540, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.60);
        tl.to("#phS02", { x: 340, y: -340, z: 540, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.60);
        tl.to("#pS12",  { x: 430, y: 90,   z: 540, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.66);
        tl.to("#phS12", { x: 430, y: 90,   z: 540, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.66);
        tl.to("#pS20",  { x: -380, y: 300, z: 480, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.72);
        tl.to("#phS20", { x: -380, y: 300, z: 480, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.72);
        tl.to("#pS21",  { y: 380, z: 480, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.78);
        tl.to("#phS21", { y: 380, z: 480, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.78);
        tl.to("#pS22",  { x: 360, y: 290, z: 480, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.84);
        tl.to("#phS22", { x: 360, y: 290, z: 480, opacity: 0, duration: OUT, ease: EASE_IO, immediateRender: false }, 6.84);

        /* ============ 8.35–10.0 继续推进 + 放大，直到看不到背景图 ============ */
        tl.to("#appstage", { z: 1500, scale: 1.36, duration: 1.65, ease: EASE_IO, immediateRender: false }, 8.35);
        tl.to("#bg",      { opacity: 0, duration: 0.75, ease: EASE_OUT, immediateRender: false }, 8.80);
        tl.to("#vignette",{ opacity: 0, duration: 0.75, ease: EASE_OUT, immediateRender: false }, 8.80);
        /* 注意：#appwin 不淡出，暖光也不淡出 —— 最后的文字直接叠在保留下来的
           软件窗口壳上，而不是切到纯黑背景。 */
