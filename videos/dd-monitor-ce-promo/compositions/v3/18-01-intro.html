<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-01-intro  ——  A 组：01–04（0.0–8.0s）
         01 视角向右移动 · 左侧浮现软件标题
         02 标题消失 · 空白软件出现 · 元素向软件飞入填充（1+5）
         03 视角突然向前推进 · 软件拆开成各元素
         04 各元素消散 · 出现标题「向您介绍 DDMonitorCE」

         配色：软件画面严格取自 ddm/theme.py；场景色场取自参考片实测 sc-void。
         素材：未到位处画成 [素材: …] 虚线占位，不静默留白。
         动效：只用 transform / opacity；入场 ease-out cubic-bezier(.23,1,.32,1)；
               入场从 scale(.96) 起，不用 scale(0)；多元素错开 40–80ms。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }

      :root {
        /* —— 软件画面（ddm/theme.py）—— */
        --bg: #222428; --sidebar: #1d2023; --content: #303338; --elevated: #373a3e;
        --hover: #3b3e42; --tile: #101114; --accent: #00a1d6; --accent-soft: rgba(0,161,214,.16);
        --pink: #fb7299; --text1: #f1f2f5; --text2: rgba(214,218,224,.9); --text3: rgba(184,189,197,.75);
        --border: rgba(131,131,145,.16); --border-strong: rgba(255,255,255,.12);
        /* —— 场景色场（参考片实测）—— */
        --sc-void: #0d0e10;
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: var(--sc-void); perspective: 2000px;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        color: var(--text1); -webkit-font-smoothing: antialiased;
      }
      /* 相机层：01 右移、03 推进都作用在它上面 */
      .camera {
        position: absolute; inset: 0; transform-style: preserve-3d;
        will-change: transform;
      }

      /* ---------- 软件窗口 ---------- */
      .appwin {
        position: absolute; left: 300px; top: 130px; width: 1320px; height: 830px;
        display: flex; background: var(--bg); border: 1px solid var(--border-strong);
        border-radius: 12px; overflow: hidden;
        box-shadow: 0 40px 90px rgba(0,0,0,.55);
        transform-style: preserve-3d; will-change: transform, opacity;
      }
      .sb {
        width: 248px; flex: 0 0 248px; background: var(--sidebar);
        border-right: 1px solid var(--border); padding: 14px 12px;
        transform-style: preserve-3d;
      }
      .sb-t { font-size: 17px; font-weight: 600; }
      .sb-s { font-size: 12px; color: var(--text3); margin-top: 3px; }
      .sb-search { margin-top: 14px; height: 34px; background: var(--content); border: 1px solid var(--border); border-radius: 8px; display: flex; align-items: center; padding: 0 10px; font-size: 13px; color: var(--text3); }
      .sb-lbl { margin: 16px 0 8px; font-size: 12px; font-weight: 600; color: var(--text3); }
      .nav { display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 8px; border-radius: 8px; will-change: transform, opacity; }
      .nav.sel { background: var(--accent-soft); }
      .av { width: 32px; height: 32px; border-radius: 16px; background: var(--hover); color: var(--text2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: 0 0 32px; }
      .nav-t { flex: 1; min-width: 0; }
      .nav-n { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nav-d { font-size: 12px; color: rgba(238,241,244,.88); white-space: nowrap; }
      .bd-live { background: var(--pink); color: #3a0d1c; border-radius: 8px; padding: 1px 6px; font-size: 11px; font-weight: 700; }
      .bd-off { background: rgba(131,131,145,.28); color: var(--text2); border-radius: 8px; padding: 1px 6px; font-size: 11px; font-weight: 600; }

      .mn { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); transform-style: preserve-3d; }
      .tb { height: 48px; flex: 0 0 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); }
      .chip { height: 26px; padding: 0 12px; border-radius: 13px; background: var(--content); border: 1px solid var(--border); color: var(--text3); font-size: 12px; font-weight: 600; display: flex; align-items: center; }
      .chip.on { background: var(--accent-soft); border-color: rgba(0,161,214,.45); color: var(--accent); }
      .sp { flex: 1; }

      /* ---------- 画面墙：cells 照 ddm/layouts.py 的 corner（1+5）---------- */
      .wall { flex: 1; min-height: 0; padding: 10px; display: grid; gap: 6px;
              grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr); }
      .wall .t0 { grid-area: 1/1/span 2/span 2; } .wall .t1 { grid-area: 1/3; }
      .wall .t2 { grid-area: 2/3; } .wall .t3 { grid-area: 3/1; }
      .wall .t4 { grid-area: 3/2; } .wall .t5 { grid-area: 3/3; }
      .tile {
        position: relative; background: var(--tile); border: 1px solid var(--border);
        border-radius: 10px; overflow: hidden; min-width: 0; min-height: 0;
        will-change: transform, opacity;
      }
      .tile.flash { border-color: rgba(0,161,214,.75); }
      .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 10px, transparent 10px 20px); }
      .ph:after { content: ""; position: absolute; inset: 8px; border: 1px dashed rgba(131,131,145,.45); border-radius: 6px; }
      .ph span { position: relative; z-index: 2; font-size: 12px; font-weight: 600; color: rgba(184,189,197,.75); }
      .tb-bar { position: absolute; left: 7px; right: 7px; bottom: 7px; height: 24px; border-radius: 8px;
                background: rgba(10,11,13,.78); display: flex; align-items: center; gap: 6px; padding: 0 9px; }
      .tb-n { font-size: 12px; font-weight: 600; color: var(--text2); }
      .tb-c { height: 17px; padding: 0 7px; border-radius: 9px; background: rgba(12,13,16,.85); color: var(--text2); font-size: 11px; font-weight: 600; display: flex; align-items: center; }
      .tb-c.on { background: var(--accent); color: #04161f; }
      .dot { position: absolute; left: 9px; top: 9px; background: var(--pink); color: #3a0d1c;
             border-radius: 8px; padding: 1px 6px; font-size: 11px; font-weight: 700; z-index: 3; }

      /* ---------- 标题层 ---------- */
      .t1 {
        position: absolute; left: 118px; top: 470px; will-change: transform, opacity;
      }
      .t1 .n { font-size: 84px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
      .t1 .s { margin-top: 16px; font-size: 30px; font-weight: 600; letter-spacing: .18em; color: var(--text3); }
      .t1 .bar { width: 76px; height: 3px; background: var(--accent); margin-top: 22px; }

      .t2 {
        position: absolute; left: 0; right: 0; top: 460px; text-align: center;
        font-size: 78px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1;
        will-change: transform, opacity;
      }
      .t2 b { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-01-intro" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div class="camera" id="camera">

        <!-- 软件窗口 -->
        <div class="appwin" id="appwin">
          <aside class="sb" id="sb">
            <div class="sb-t">DD监控室CE</div>
            <div class="sb-s">多窗口直播监控</div>
            <div class="sb-search">搜索关注</div>
            <div class="sb-lbl">正在直播 6</div>
            <div class="nav sel"><div class="av">莉</div><div class="nav-t"><div class="nav-n">莉蔻Liko</div><div class="nav-d">唱歌 · 3281 人气</div></div><span class="bd-live">直播</span></div>
            <div class="nav"><div class="av">羽</div><div class="nav-t"><div class="nav-n">羽啾chu2u</div><div class="nav-d">杂谈 · 1204</div></div><span class="bd-live">直播</span></div>
            <div class="nav"><div class="av">星</div><div class="nav-t"><div class="nav-n">星野Aki</div><div class="nav-d">游戏 · 862</div></div><span class="bd-live">直播</span></div>
            <div class="nav"><div class="av">柊</div><div class="nav-t"><div class="nav-n">柊镜Kagami</div><div class="nav-d">未开播</div></div><span class="bd-off">离线</span></div>
            <div class="nav"><div class="av">白</div><div class="nav-t"><div class="nav-n">白鹤Haku</div><div class="nav-d">未开播</div></div><span class="bd-off">离线</span></div>
          </aside>
          <main class="mn">
            <div class="tb">
              <div class="chip">平分布局</div><div class="chip on">大带小</div>
              <div class="chip">弹幕布局</div><div class="chip">竖屏布局</div>
              <div class="sp"></div><div class="chip">6 路在播</div>
            </div>
            <!-- corner = 主画面 + 5 小环绕 -->
            <div class="wall" id="wall">
              <div class="tile t0" data-tile><div class="ph"><span>[素材: 主画面 · 莉蔻Liko]</span></div><span class="dot">直播</span>
                <div class="tb-bar"><span class="tb-n">莉蔻Liko</span><span class="sp"></span><span class="tb-c on">画质</span><span class="tb-c">静音</span></div></div>
              <div class="tile t1" data-tile><div class="ph"><span>[素材]</span></div></div>
              <div class="tile t2" data-tile><div class="ph"><span>[素材]</span></div></div>
              <div class="tile t3" data-tile><div class="ph"><span>[素材]</span></div></div>
              <div class="tile t4" data-tile><div class="ph"><span>[素材]</span></div></div>
              <div class="tile t5" data-tile><div class="ph"><span>[素材]</span></div></div>
            </div>
          </main>
        </div>
      </div>

      <!-- 01 左侧标题 -->
      <div class="t1" id="t1">
        <div class="n">DD监控室CE</div>
        <div class="s">多窗口直播监控</div>
        <div class="bar"></div>
      </div>

      <!-- 04 中央标题 -->
      <div class="t2" id="t2">向您介绍 <b>DDMonitorCE</b></div>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";

        /* ---- 初始态：都在画面外 / 不可见，避免首帧闪 ----
           用 gsap.set（时间轴外）建立基线，fromTo 一律 immediateRender:false，
           这样 seek 到任何位置都不会被"最后写入的 from"污染。 */
        gsap.set("#appwin", { opacity: 0, scale: 0.97 });
        gsap.set("#t1", { opacity: 0, x: -60 });
        gsap.set("#t2", { opacity: 0, y: 24 });
        gsap.set(".nav", { opacity: 0, x: -32 });
        gsap.set("[data-tile]", { opacity: 0, z: -420, scale: 0.86 });

        /* ================= 01（0.0–2.0）视角向右移动 + 左侧标题浮现 =================
           视角右移 = 相机右移 → 场景相对左移。 */
        tl.fromTo("#camera",
          { x: 0, z: 0 },
          { x: -120, z: 0, duration: 2.0, ease: EASE_IO, immediateRender: false }, 0);
        tl.fromTo("#t1",
          { opacity: 0, x: -60 },
          { opacity: 1, x: 0, duration: 0.42, ease: EASE_OUT, immediateRender: false }, 0.30);
        tl.fromTo("#t1 .bar",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.34, ease: EASE_OUT, immediateRender: false }, 0.56);
        tl.to("#t1", { opacity: 0, x: -40, duration: 0.32, ease: EASE_OUT, immediateRender: false }, 1.72);

        /* ================= 02（2.0–4.0）空白软件出现 + 元素飞入填充 ================= */
        tl.fromTo("#appwin",
          { opacity: 0, scale: 0.97 },
          { opacity: 1, scale: 1, duration: 0.44, ease: EASE_OUT, immediateRender: false }, 2.00);
        /* 关注卡片依次飞入（stagger 60ms） */
        tl.to(".nav", { opacity: 1, x: 0, duration: 0.40, ease: EASE_OUT,
                        stagger: 0.06, immediateRender: false }, 2.26);
        /* 1+5 的 6 格从画布外飞入（stagger 70ms），落位描边闪一次 accent */
        tl.to("[data-tile]", { opacity: 1, z: 0, scale: 1, duration: 0.46, ease: EASE_OUT,
                               stagger: 0.07, immediateRender: false }, 2.34);
        tl.to("[data-tile]", { borderColor: "rgba(0,161,214,.75)", duration: 0.10,
                               stagger: 0.07, immediateRender: false }, 2.60);
        tl.to("[data-tile]", { borderColor: "rgba(131,131,145,.16)", duration: 0.34,
                               stagger: 0.07, immediateRender: false }, 2.72);

        /* ================= 03（4.0–6.0）视角突然向前推进 + 软件拆开 =================
           整机冲镜头，同时各元素沿各自法线散开。 */
        tl.fromTo("#camera",
          { x: -120, z: 0 },
          { x: -60, z: 240, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.00);
        tl.to("#sb",
          { x: -140, z: 60, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.06);
        tl.to("[data-tile]",
          { z: 160, duration: 0.62, ease: EASE_IO, stagger: 0.03, immediateRender: false }, 4.06);
        tl.to(".tb",
          { z: 120, duration: 0.62, ease: EASE_IO, immediateRender: false }, 4.06);

        /* ================= 04（6.0–8.0）各元素消散 + 中央标题 ================= */
        tl.to("#appwin", { opacity: 0, scale: 1.06, duration: 0.42, ease: EASE_OUT, immediateRender: false }, 6.00);
        tl.fromTo("#t2",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.52, ease: EASE_OUT, immediateRender: false }, 6.36);

        /* 固定长度 8.0s：末帧静止，避免根过渡抢在最后落定前 */
        tl.to({}, { duration: 0.01 }, 7.99);

        window.__timelines = window.__timelines || {};
        window.__timelines["18-01-intro"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
