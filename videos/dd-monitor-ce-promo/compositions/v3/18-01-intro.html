<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-01-intro  ——  A 组（0.0–12.0s）

         —— 相机速率曲线：形状照参考片前 4s，但去掉静止段并加快（用户 2026-09-22）——
         0.00–1.38  匀加速横移 189px（位移 ∝ t²，峰值 258px/s）
         1.38–3.94  匀速横移 520px/s（**没有静止段**，加速一结束直接接上）
         3.94–4.44  减速收尾（power2.out，130px）
                    · **软件窗口 1.38s 才贴上画布右缘进入**（不是第 0 帧就露边）
                    · 窗口**平正、不倾斜**（照参考片那个 LauncherX 窗口）
                    · 左侧标题 0.52s 起浮现、**1.79s 起 0.25s 隐去**（都照参考片）
         4.44–5.40  落定后相机向前推进（elastic 回稳，z 0→230）
         5.33–6.93  **九格从下往上逐行拼合成窗口** —— 用户 2026-09-22 改：
                    不要"散开飞出"，要和参考片一样往上拼。窗口先以空玻璃壳出现，
                    然后底行 3 格 → 中行 3 格 → 顶行 3 格 → 侧栏，
                    依次从窗口内下方 y+120 浮起落位（行内 stagger 80ms）
         7.00–8.50  继续推进到接近满幅（z 890，`back.out(1.7)` 过冲落地），九格边缘保留在画内；
                    **背景图不淡出**（用户要求「背景铺满画面」，银河一直留到最后）
         8.30–12.0  月光光晕（在窗口**内部**，透过窗口玻璃）+ 文字「向您介绍 DDMonitorCE」
                    （用户 2026-09-22：**去掉星光光点**，只留一层 .wash 光晕）

         软件画面 = 九格录屏的九张真实画面切片与软件侧栏。
         窗口外壳 = 类玻璃材质：大圆角 + 1px 亮棱边 + 顶部内侧高光 + 表面斜向反光
         + 多层柔和阴影。底色仍是**高不透明度**深灰渐变 —— 切片缝隙不透背后背景。

         —— Emil 视角的动效审核（2026-09-22）改的六处 ——
         · `#moon` 不再自己做 fade：原来父子两层 opacity 相乘，月光实际比设定慢一倍
         · 模块入场补上 `scale .97→1`：入场要有初始 transform、要有实体感（但绝不用 scale(0)）
         · 新增 `.sheen` 玻璃扫光：窗口进入时表面反光扫过一次（原来是 `::after` 上的静态渐变）
         · 标题退场加 `blur(2.5px)`、主标题入场从 `blur(7px)` 显影 —— blur 能遮住两态重叠的双影
         · glow / shadow 淡入 1.20s → 0.60s：光晕是窗口的伴生效果，不该比窗口晚 1s 才满
         · 8.60–12.0 的定格改成极缓推进（3.4s 走 2.7%），3.4s 的死画面看起来像卡住了

         ⚠ 两条会毁掉画面的禁忌（都是实测踩出来的）：
         · .world 不能写 transform-style: preserve-3d —— 子层做 3D 变换时 Chrome 会把
           窗口绘制裁到局部 y≈363，下半部分连底色都不画，直接透出背景。
           立体感用每个元素自带的 transformPerspective 实现。
         · 参与 3D 的元素不要写 will-change:transform，也不要靠父层 overflow:hidden 裁圆角
           —— 前者让窗口被按布局尺寸裁切，后者会把"飞出画面"的模块整块剪掉。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }

      :root {
        --accent: #00a1d6;
        --text1: #f1f2f5; --text3: rgba(241,242,245,.72);
        --appbg: #222428;               /* 软件底色：填住切片缝隙，背景不透 */
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        /* 真实截图缩放：3840 -> 1000（比上一版缩小） */
        --s: 0.2604;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #05060a; perspective: 2000px; perspective-origin: 50% 46%;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        color: var(--text1); -webkit-font-smoothing: antialiased;
      }

      /* ---------- 世界层（摄像机右移作用在这上面）---------- */
      /* ⚠ 这里**绝对不能**写 transform-style: preserve-3d。
         在 preserve-3d 上下文里给子层做 3D 变换（rotationX / z），Chrome 会把该子层的
         绘制错误地裁切到局部 y≈363（实测窗口只剩 417/548 行可见，下半部分连窗口底色
         都不画，直接透出背景 —— 就是"软件缺少了下半部分图像"的真正原因）。
         A/B 实测：.world{transform-style:flat} 后可见行数恢复到 548/548。
         立体感改用「每个 3D 元素自带 transformPerspective」实现（见 JS 基线部分），
         效果等价，且不产生 preserve-3d 上下文。 */
      .world {
        position: absolute; left: 0; top: 0; width: 3600px; height: 1080px;
      }
      /* ⚠ 背景图**不能**超出 .world 的高度：在 transform-style:preserve-3d 的
         上下文里，子元素溢出父层会让 Chrome 用错误的边界做 3D 裁切，
         把 .appstage 的下半部分整块切掉（实测可见高度只剩 272/547）。
         所以这里用 object-fit:cover 把 3600×1990 的图裁进 3600×1080 的框，
         再用 object-position 保住「银河 + 山脉 + 湖面」的取景。 */
      .bg {
        position: absolute; left: 0; top: 0; width: 3600px; height: 1080px;
        object-fit: cover; object-position: 50% 66%;
        display: block;
      }
      .vignette {
        position: absolute; left: 0; top: 0; width: 3600px; height: 1080px;
        background: radial-gradient(ellipse 62% 58% at 62% 52%, transparent 0%, rgba(3,5,10,.42) 62%, rgba(3,5,10,.78) 100%);
      }

      /* ---------- 悬浮的软件画面 ----------
         窗口世界坐标 x = 2109：相机前段只走 189px（参考片实测），
         所以窗口左缘在相机走到 1.44s 时才刚好贴上画布右缘（2109 - 189 = 1920）
         —— 这就是「软件窗口 1.44s 出现」，而不是第 0 帧就露边。
         落位居中需要位移 2109 + 500 - 960 = 1649px。 */
      .appstage {
        position: absolute; left: 2109px; top: 236px; width: 1000px; height: 557px;
      }
      /* 光晕 / 影子：**.world 的直接子层**，且坐标全部落在 world 的框内。
         ⚠ 它们绝不能再放回 .appstage 里 —— 在 preserve-3d 的祖先下，任何溢出父层的
         子元素都会让 Chrome 用错误边界做 3D 裁切（实测把窗口下半部分整块切掉）。
         坐标 = appstage(1900,236,1000×547) 向外扩，再夹进 0..1080 的高度范围。 */
      .glow {
        position: absolute; left: 1839px; top: 6px; width: 1540px; height: 957px;
        background:
          radial-gradient(ellipse 42% 46% at 50% 45%,
            rgba(226,246,255,.46) 0%, rgba(140,215,255,.26) 28%, rgba(0,161,214,0) 64%),
          radial-gradient(ellipse 60% 62% at 50% 52%,
            rgba(0,161,214,.26) 0%, rgba(60,120,220,.12) 42%, rgba(0,161,214,0) 72%);
        filter: blur(12px);
      }
      .shadow {
        position: absolute; left: 2169px; top: 811px; width: 880px; height: 64px;
        background:
          radial-gradient(ellipse 46% 46% at 50% 40%, rgba(0,0,0,.96) 0%, rgba(0,0,0,.72) 34%, rgba(0,0,0,0) 72%),
          radial-gradient(ellipse 54% 52% at 50% 44%, rgba(0,0,0,.78) 0%, rgba(0,0,0,.34) 48%, rgba(0,0,0,0) 80%);
        filter: blur(14px);
      }
      /* 软件主体：窗口外壳 —— 类玻璃材质（照参考片 LauncherX 那个窗口的观感）。
         参考片窗口 = 大圆角 + 极细亮棱边 + 顶部内侧高光 + 柔和落地阴影 + 表面斜向反光。

         ⚠ 底色仍是**高不透明度**的深灰渐变，不是真透明：
         切片之间的缝隙一旦透出背后的银河背景，看起来就是"软件画面缺了一块"
         （这正是 b8342bb 修掉的那个 bug 的观感）。玻璃感靠**边缘**做：
         1px 亮棱边 + 顶部内侧高光 + 表面反光 + 多层外阴影。
         「月光透过窗口」由窗口内部的 .moon 层承担，不依赖底色透明。

         ⚠ 关于 .appwin 的两件事：
         1) 不要写 will-change:transform —— 会让 Chrome 按布局尺寸给窗口建合成层，
            3D 投影超出该边界时下半部分被整块裁掉。
         2) overflow:hidden 现在**可以**写（以前禁止）：原来禁止它，是因为它会把
            "拆解飞出画面"的 tween 整块剪掉、模块看起来在原地消失。用户 2026-09-22
            把 03 拍从"散开飞出"改成"从下往上拼入"之后已经没有飞出动画；而这里**必须**
            裁切，否则模块从窗口下方升起时会露在窗口外面（实测 t=5.7s 就是漏的）。
            加完必须用 probe-shot 数像素复查窗口下半部分有没有被裁 ——
            will-change 那条坑的观感和这个一模一样。
         3) 不要写 transform-style: preserve-3d（见下方 .world 的说明）。 */
      .appwin {
        position: absolute; inset: 0;
        border-radius: 14px;
        overflow: hidden;
        background:
          linear-gradient(158deg,
            rgba(58,63,70,.93) 0%,
            rgba(42,46,51,.94) 32%,
            rgba(30,33,37,.95) 66%,
            rgba(23,25,29,.96) 100%);
        box-shadow:
          0 1px 0 0 rgba(238,247,255,.22) inset,      /* 顶部内侧玻璃棱边高光 */
          0 -1px 0 0 rgba(0,0,0,.34) inset,           /* 底部内侧暗棱，做出厚度 */
          0 0 0 1px rgba(170,198,230,.24),            /* 外圈细亮描边 */
          0 0 0 2px rgba(0,0,0,.22),                  /* 描边外侧压暗，玻璃不与背景糊在一起 */
          0 2px 8px rgba(0,0,0,.44),
          0 16px 38px rgba(0,0,0,.50),
          0 48px 104px rgba(0,0,0,.56),
          0 0 64px rgba(0,161,214,.10);               /* 玻璃边缘的冷色散射 */
      }
      /* 表面斜向反光：玻璃面板上那道光。inset:0 + 圆角，不溢出、不参与布局。 */
      .appwin::after {
        content: ""; position: absolute; inset: 0; border-radius: 14px;
        pointer-events: none;
        background: linear-gradient(124deg,
          rgba(255,255,255,.075) 0%,
          rgba(255,255,255,.032) 13%,
          rgba(255,255,255,.010) 26%,
          rgba(255,255,255,0) 40%,
          rgba(255,255,255,0) 100%);
      }
      .pt { position: absolute; display: block; }
      /* 侧栏贴着窗口左缘和上下缘，自己带圆角（父层不再 overflow:hidden） */
      /* 九格使用现有录屏裁出的 grid-1..9.png；侧栏沿用真实软件切片。
         列坐标按 1600px 原录屏约 x=166/643/1121 缩至 1000px，
         保留侧栏后的原始间距，避免画面落到灰色分隔线上。
         ⚠ 2026-09-24：格子显示比例（292×166 / 178 / 183）与九格素材的比例
           （实量各列 438/467/468 × 265 → 1.65 / 1.76 / 1.77）并不一致，
           所以 `object-fit` 必须用 **cover** —— 用 contain 会在格子四周留出
           `background` 的深灰，就是用户看到的「每格被灰色分割线隔断」。 */
      .pt-sb  { left: 0;     top: 0;     width: 95px;  height: 542px; border-radius: 14px 0 0 14px; }
      .pt-cell { object-fit: cover; background: #0e1014; }
      .pt-c0 { left: 104px; width: 292px; }
      .pt-c1 { left: 402px; width: 292px; }
      .pt-c2 { left: 701px; width: 292px; }
      .pt-r0 { top: 0; height: 166px; }
      .pt-r1 { top: 174px; height: 178px; }
      .pt-r2 { top: 359px; height: 183px; }


      /* ---------- 标题层（固定在屏幕上）---------- */
      .t1 { position: absolute; left: 118px; top: 452px; will-change: transform, opacity; }
      .t1 .n { font-size: 84px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
      .t1 .s { margin-top: 16px; font-size: 30px; font-weight: 600; letter-spacing: .18em; color: var(--text3); }
      .t1 .bar { width: 76px; height: 3px; background: var(--accent); margin-top: 22px; transform-origin: 0 50%; }

      .t2 {
        position: absolute; left: 0; right: 0; top: 452px; text-align: center;
        font-size: 78px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1;
        will-change: transform, opacity;
      }
      .t2 b { color: var(--accent); }

      /* 转场用的白场：01 的结尾推向 02 的白底（`--sc-white` #f8f8f8），
         02 开头再从白场淡出 —— 两段的接缝处都是"满白"，拼起来无缝。 */
      .flash { position: absolute; inset: 0; background: #f8f8f8; opacity: 0; pointer-events: none; }

      /* ---------- 月光层（**在软件窗口内部**，透过窗口玻璃透出来）----------
         .moon 是 .appwin 的子层：inset:0 + overflow:hidden + 圆角，
         光只在窗口范围内可见，窗口移动/放大时光跟着一起走。
         用户 2026-09-22：**去掉星光光点**，只留这一层 .wash 光晕。 */
      .moon {
        position: absolute; inset: 0; border-radius: 14px;
        overflow: hidden; pointer-events: none;
      }
      .moon .wash {
        position: absolute; inset: 0;
        background:
          radial-gradient(ellipse 56% 54% at 24% 20%, rgba(214,236,255,.32) 0%, rgba(126,176,236,.16) 40%, rgba(0,0,0,0) 74%),
          radial-gradient(ellipse 42% 46% at 80% 78%, rgba(158,192,255,.15) 0%, rgba(0,0,0,0) 72%),
          linear-gradient(196deg, rgba(184,216,255,.10) 0%, rgba(0,0,0,0) 48%);
      }
      /* 用户 2026-09-22：**去掉星光光点** —— 月光只留上面那一层 .wash 光晕，
         不再有点状星/四芒星（.moon i / .moon .fl 已删除）。 */

      /* ---------- 玻璃扫光（.appwin 表面那道反光，会随相机横移扫过去）----------
         原来这道反光是 .appwin::after 上的**静态**渐变。玻璃的实体感来自「反光随视角变化」——
         参考片那个窗口横向移动时，表面高光也在走。所以把它拆成独立层，进场时扫一次。
         inset 用负值让光带比窗口大，超出部分由 .appwin 的 overflow:hidden 裁掉。 */
      .sheen {
        position: absolute; inset: -30% -80%; pointer-events: none;
        background: linear-gradient(118deg,
          rgba(255,255,255,0) 40%,
          rgba(255,255,255,.115) 47%,
          rgba(255,255,255,.03) 53%,
          rgba(255,255,255,0) 60%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-01-intro" data-start="0" data-duration="12" data-width="1920" data-height="1080">
        <div class="world" id="world">
          <img class="bg" id="bg" src="assets/real/bg-hall.jpg" alt="">
          <div class="vignette" id="vignette"></div>

          <!-- ⚠ 光晕与影子必须是 .world 的直接子层，且**不得溢出 .world**。
               放在参与 3D 的 .appstage 里、或向上溢出父层，都会让 Chrome 用错误的
               边界做 3D 裁切，把软件画面的下半部分整块切掉。 -->
          <div class="glow" id="glow"></div>
          <div class="shadow" id="shadow"></div>

          <div class="appstage" id="appstage">
            <!-- 软件主体（窗口外壳，拆解后保留） -->
            <div class="appwin" id="appwin">
              <img class="pt pt-sb"   id="pSb"   src="assets/rec/cell-sb.png" alt="">
              <img class="pt pt-cell pt-r0 pt-c0" id="pR0C0" src="assets/rec/grid-1.png" alt="">
              <img class="pt pt-cell pt-r0 pt-c1" id="pR0C1" src="assets/rec/grid-2.png" alt="">
              <img class="pt pt-cell pt-r0 pt-c2" id="pR0C2" src="assets/rec/grid-3.png" alt="">
              <img class="pt pt-cell pt-r1 pt-c0" id="pR1C0" src="assets/rec/grid-4.png" alt="">
              <img class="pt pt-cell pt-r1 pt-c1" id="pR1C1" src="assets/rec/grid-5.png" alt="">
              <img class="pt pt-cell pt-r1 pt-c2" id="pR1C2" src="assets/rec/grid-6.png" alt="">
              <img class="pt pt-cell pt-r2 pt-c0" id="pR2C0" src="assets/rec/grid-7.png" alt="">
              <img class="pt pt-cell pt-r2 pt-c1" id="pR2C1" src="assets/rec/grid-8.png" alt="">
              <img class="pt pt-cell pt-r2 pt-c2" id="pR2C2" src="assets/rec/grid-9.png" alt="">

              <!-- 月光层：**在窗口内部**（.appwin 的子层），所以只透过窗口玻璃可见，
                   不会像上一版那样直接铺在画面上。坐标按窗口 1000x547 布点。 -->
              <div class="moon" id="moon">
                <div class="wash"></div>
              </div>

              <!-- 玻璃扫光：进场时从右往左扫过一次（相机右移，反射光斑相对窗口左移） -->
              <div class="sheen" id="sheen"></div>
            </div>
          </div>
        </div>

      <div class="t1" id="t1">
        <div class="n">DD监控室CE</div>
        <div class="s">多窗口直播监控</div>
        <div class="bar" id="t1bar"></div>
      </div>

      <div class="t2" id="t2">向您介绍 <b>DDMonitorCE</b></div>

      <div class="flash" id="flash"></div>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";

        /* ---- 相机速率曲线：形状照参考片前 4s，但**去掉静止段并加快**（用户 2026-09-22）----
           参考片实测：0.00–1.38s 匀加速走 189px（峰值 258px/s）→ 1.38–1.88s 完全静止
           → 1.88s 起恒定 315px/s → 4.0–4.96s 平滑减速到停。
           用户反馈「人眼看起来很慢」+「移动去除静止段」，所以：
             · 保留 1.38s 的匀加速起步（曲线形状照抄，窗口出现时刻不变）
             · **删掉 0.5s 静止段**，加速一结束就直接进匀速
             · 匀速从参考片的 315px/s 提到 **520px/s**，相机段总时长 6.10s → 4.44s */
        var D1 = 189, T1 = 1.38;              /* 匀加速段：行程 189px，1.38s 结束 */
        var D2 = 1330, T3 = 3.94;             /* 匀速段：1330px / 2.56s = 520px/s */
        var T4 = 4.44;                        /* 减速收尾 0.5s 走 130px（起点速度 520 -> 0）*/
        /* 画面中心在世界 x = 2109 + 500 = 2609；推到 1649 时正好落到画布中心 960。
           2109 - 189 = 1920 —— 相机走到 1.38s 时窗口左缘才贴上画布右缘，随即开始进入。 */
        var DOLLY = D1 + D2 + 130;            /* 189 + 1330 + 130 = 1649 */

        /* ---- 基线 ---- */
        gsap.set("#world", { x: 0, z: 0 });
        gsap.set("#t1", { opacity: 0, x: -70, filter: "blur(0px)" });
        gsap.set("#t1bar", { scaleX: 0 });
        /* 主标题从模糊显影出来 —— blur 能遮住两态重叠时的"双影" */
        gsap.set("#t2", { opacity: 0, y: 26, filter: "blur(7px)" });
        gsap.set("#glow", { opacity: 0 });
        gsap.set("#shadow", { opacity: 0 });
        /* #moon 是纯容器，不再自己做 fade：原来父子两层 opacity 相乘（0.90s × 1.35s），
           月光实际比设定慢了一倍。只让 .wash 自己淡入。 */
        gsap.set("#moon .wash", { opacity: 0 });
        /* 玻璃扫光：进场时从右往左扫（相机右移 -> 反射光斑相对窗口左移） */
        gsap.set("#sheen", { opacity: 0, x: 520 });
        /* 窗口**平正**：照参考片那个窗口（正对镜头，没有俯视倾斜）。
           transformPerspective 留给后面的 z 推进 —— 直接写进元素的 transform，
           等价于父层透视，但不会引入 preserve-3d 上下文（那会把窗口下半部分裁掉）。 */
        gsap.set("#appstage", { transformPerspective: 2000 });
        /* 拆解飞出的切片各自也要透视，z 才有近大远小 */
        /* 模块初始藏在窗口内部的下方（y +120）且透明：03 拍让它们从下往上逐块拼入。
           y 偏移刻意小于窗口高度，模块始终落在窗口范围内、不会露到窗口外面
           （.appwin 不能写 overflow:hidden，见文件头部的禁忌）。 */
        gsap.set(".pt", { transformPerspective: 1000, y: 120, opacity: 0, scale: 0.97 });
        gsap.set("#appwin", { opacity: 1, scale: 1, z: 0 });
        gsap.set("#vignette", { opacity: 1 });

        /* ====== 0.00–1.38 相机匀加速起步（参考片实测：位移 ∝ t²，峰值 258px/s）====== */
        tl.fromTo("#world", { x: 0 },
          { x: -D1, duration: T1, ease: "power2.in", immediateRender: false }, 0);

        /* ====== 1.38–3.94 匀速横移（**没有静止段**：加速一结束就直接接上）====== */
        tl.fromTo("#world", { x: -D1 },
          { x: -(D1 + D2), duration: T3 - T1, ease: "none", immediateRender: false }, T1);
        /* 减速收尾（参考片 4.0–4.96s 也有同样一段平滑收尾） */
        tl.fromTo("#world", { x: -(D1 + D2) },
          { x: -DOLLY, duration: T4 - T3, ease: "power2.out", immediateRender: false }, T3);

        /* 光晕 / 影子与窗口同时出现（窗口 1.38s 贴上画布右缘）。
           原来是 1.20s 淡入、比窗口晚 1s 才满 —— 光晕是窗口的伴生效果，迟到会显得脱节，
           收到 0.60s，让它跟着窗口一起亮起来。 */
        tl.fromTo("#glow",   { opacity: 0 }, { opacity: 1, duration: 0.60, ease: EASE_OUT, immediateRender: false }, 1.38);
        tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 0.60, ease: EASE_OUT, immediateRender: false }, 1.42);

        /* 玻璃扫光：窗口进入的整段时间里扫过一次。
           opacity 与 x 两个 tween **同时开始**、各补不同属性（错开开始会中途跳变）。 */
        tl.fromTo("#sheen", { opacity: 0 }, { opacity: 1, duration: 0.50, ease: EASE_OUT, immediateRender: false }, 1.42);
        tl.fromTo("#sheen", { x: 520 }, { x: -520, duration: 2.90, ease: "none", immediateRender: false }, 1.42);

        /* 左侧标题：0.52s 起浮现、1.79s 起 0.25s 隐去 —— 两个时刻都照参考片实测 */
        tl.fromTo("#t1", { opacity: 0, x: -70 },
          { opacity: 1, x: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 0.52);
        tl.fromTo("#t1bar", { scaleX: 0 },
          { scaleX: 1, duration: 0.40, ease: EASE_OUT, immediateRender: false }, 0.80);
        tl.to("#t1", { opacity: 0, x: -48, filter: "blur(2.5px)", duration: 0.25, ease: EASE_OUT, immediateRender: false }, 1.79);

        /* ============ 4.44–5.40 落定后：相机向前推进（带弹性回稳）============ */
        tl.to("#appstage", { z: 230, duration: 0.96, ease: "elastic.out(1, 0.62)", immediateRender: false }, 4.44);
        tl.to("#glow",   { opacity: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 4.44);
        tl.to("#shadow", { opacity: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 4.44);

        /* ====== 5.33–6.93 九格**从下往上逐行拼合成窗口** ======
           用户 2026-09-22：不要"散开飞出"，改成和参考片一样模块往上拼。
           窗口先以空玻璃壳出现在画面里（01/02 内部是空的 —— 参考片开场也是空窗口先到位），
           九格按底行 → 中行 → 顶行依次补齐，侧栏最后闭合窗口。 */
        /* 模块逐块拼入的节奏**对齐 BGM**（用户 2026-09-22：请尝试匹配动效）。
           素材 `assets/bgm/ms-loop.wav` 的 onset 网格是 0.1905s（≈157.5 BPM 的八分音符，
           实测中位间隔 0.192s）。每行从偶数拍开始，行内 80ms 依次落位；
           侧栏在下一拍进入，全部在推进前落定。 */
        var IN = 0.45;
        tl.to("#pR2C0", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 5.334);
        tl.to("#pR2C1", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 5.414);
        tl.to("#pR2C2", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 5.494);
        tl.to("#pR1C0", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 5.715);
        tl.to("#pR1C1", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 5.795);
        tl.to("#pR1C2", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 5.875);
        tl.to("#pR0C0", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 6.096);
        tl.to("#pR0C1", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 6.176);
        tl.to("#pR0C2", { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 6.256);
        tl.to("#pSb",   { y: 0, opacity: 1, scale: 1, duration: IN, ease: EASE_OUT, immediateRender: false }, 6.477);

        /* ============ 6.858–8.358 继续推进，完整保留九格边界 ============
           先前 z=1100 把 1000px 窗口放到约 2222px 宽，外侧格子被画幅裁掉。
           改为 z=890：落点约 1802px 宽，back.out(1.7) 的短暂过冲也留在画内。
           同时下移 25px，让上下边距接近。 */
        tl.to("#appstage", { z: 890, y: 25, duration: 1.50, ease: "back.out(1.7)", immediateRender: false }, 6.858);
        /* 背景图与暗角**不淡出** —— 用户要求「背景铺满画面」，银河湖面一直留到最后。 */

        /* 注意：#appwin 不淡出 —— 最后的文字直接叠在保留下来的软件窗口上，
           而不是切到纯黑背景。 */

        /* ============ 8.30–12.0 月光 + 文字（月光在窗口内部，透过窗口玻璃）============
           .moon 是 .appwin 的子层，光只出现在窗口范围里，透过窗口玻璃透出来。
           用户 2026-09-22：**去掉星光光点**，只留这一层 .wash 光晕。 */
        /* #moon 是容器、不再自己 fade（见基线说明），只让 .wash 淡入 */
        tl.fromTo("#moon .wash", { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 1.35, ease: EASE_OUT, immediateRender: false }, 8.382);
        /* 主标题从模糊显影到清晰（blur 遮罩：两态重叠时人眼会看成"两个东西"） */
        tl.fromTo("#t2", { opacity: 0, y: 26, filter: "blur(7px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.70, ease: EASE_OUT, immediateRender: false }, 8.763);

        /* 定格不再死停：8.763–12.0 极缓推进，仍保留完整的九格窗口 */
        tl.to("#appstage", { z: 920, duration: 3.20, ease: "none", immediateRender: false }, 8.763);

        /* ---- 转场：推向白场，接住 02 的白底开头 ----
           11.5–12.0s 正好是 BGM 的段落静音段（合集拼接留下的断口），
           所以「画面转白」与「音乐静下来」同时发生，接缝很自然。
           02 的第一帧也是满白（它开头同样有一个 #flash 从 1 淡出），
           两段拼起来在接缝处是「白 → 白」，不会跳。 */
        tl.fromTo("#flash", { opacity: 0 },
          { opacity: 1, duration: 0.45, ease: "power2.in", immediateRender: false }, 11.55);

        tl.to({}, { duration: 0.01 }, 11.99);

        window.__timelines = window.__timelines || {};
        window.__timelines["18-01-intro"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
