<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      /* ==========================================================================
         18-01-intro  ——  A 组（0.0–12.0s）

         0.0–5.4  摄像机沿滑轨向右**匀速**推移（前半段的主体，占大半时长）
                  · 软件画面从画布右侧进入并居中
                  · 画面起初**略低于相机**（俯视，能看到它的顶面）→ 逐渐放平
                  · 左侧标题在**画面露出约一半时**（约 1.95s）隐去
         5.4–6.9  居中后相机向前推进（elastic 回稳）
         6.9–8.9  软件模块（侧栏 / 主画面 / 5 小格）分散拆解飞出画面
                  **保留软件主体**（留下的窗口外壳，不透出背景）
         8.9–10.5 继续向前推进 + 放大，直到看不到背景图
         10.3–12.0 文字「向您介绍 DDMonitorCE」直接叠在保留的窗口壳上 + 星光光影

         软件画面 = 真实截图切片（Video_reference/fullscreen.png 裁切）。
         窗口本身铺软件底色 #222428 —— 切片之间的缝隙不会透出背后背景。

         ⚠ 两条会毁掉画面的禁忌（都是实测踩出来的）：
         · .world 不能写 transform-style: preserve-3d —— 子层做 3D 变换时 Chrome 会把
           窗口绘制裁到局部 y≈363，下半部分连底色都不画，直接透出背景。
           立体感用每个元素自带的 transformPerspective 实现。
         · 参与 3D 的元素不要写 will-change:transform，也不要靠父层 overflow:hidden 裁圆角
           —— 前者让窗口被按布局尺寸裁切，后者会把"飞出画面"的模块整块剪掉。
         ========================================================================== */
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
      @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }

      :root {
        --accent: #00a1d6;
        --text1: #f1f2f5; --text3: rgba(241,242,245,.72);
        --appbg: #222428;               /* 软件底色：填住切片缝隙，背景不透 */
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
        /* 真实截图缩放：3840 -> 1000（比上一版缩小） */
        --s: 0.2604;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: #05060a; perspective: 2000px; perspective-origin: 50% 46%;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        color: var(--text1); -webkit-font-smoothing: antialiased;
      }

      /* ---------- 世界层（摄像机右移作用在这上面）---------- */
      /* ⚠ 这里**绝对不能**写 transform-style: preserve-3d。
         在 preserve-3d 上下文里给子层做 3D 变换（rotationX / z），Chrome 会把该子层的
         绘制错误地裁切到局部 y≈363（实测窗口只剩 417/548 行可见，下半部分连窗口底色
         都不画，直接透出背景 —— 就是"软件缺少了下半部分图像"的真正原因）。
         A/B 实测：.world{transform-style:flat} 后可见行数恢复到 548/548。
         立体感改用「每个 3D 元素自带 transformPerspective」实现（见 JS 基线部分），
         效果等价，且不产生 preserve-3d 上下文。 */
      .world {
        position: absolute; left: 0; top: 0; width: 3600px; height: 1080px;
      }
      /* ⚠ 背景图**不能**超出 .world 的高度：在 transform-style:preserve-3d 的
         上下文里，子元素溢出父层会让 Chrome 用错误的边界做 3D 裁切，
         把 .appstage 的下半部分整块切掉（实测可见高度只剩 272/547）。
         所以这里用 object-fit:cover 把 3600×1990 的图裁进 3600×1080 的框，
         再用 object-position 保住「银河 + 山脉 + 湖面」的取景。 */
      .bg {
        position: absolute; left: 0; top: 0; width: 3600px; height: 1080px;
        object-fit: cover; object-position: 50% 66%;
        display: block;
      }
      .vignette {
        position: absolute; left: 0; top: 0; width: 3600px; height: 1080px;
        background: radial-gradient(ellipse 62% 58% at 62% 52%, transparent 0%, rgba(3,5,10,.42) 62%, rgba(3,5,10,.78) 100%);
      }

      /* ---------- 悬浮的软件画面 ---------- */
      .appstage {
        position: absolute; left: 1900px; top: 236px; width: 1000px; height: 547px;
      }
      /* 光晕 / 影子：**.world 的直接子层**，且坐标全部落在 world 的框内。
         ⚠ 它们绝不能再放回 .appstage 里 —— 在 preserve-3d 的祖先下，任何溢出父层的
         子元素都会让 Chrome 用错误边界做 3D 裁切（实测把窗口下半部分整块切掉）。
         坐标 = appstage(1900,236,1000×547) 向外扩，再夹进 0..1080 的高度范围。 */
      .glow {
        position: absolute; left: 1630px; top: 6px; width: 1540px; height: 957px;
        background:
          radial-gradient(ellipse 42% 46% at 50% 45%,
            rgba(226,246,255,.46) 0%, rgba(140,215,255,.26) 28%, rgba(0,161,214,0) 64%),
          radial-gradient(ellipse 60% 62% at 50% 52%,
            rgba(0,161,214,.26) 0%, rgba(60,120,220,.12) 42%, rgba(0,161,214,0) 72%);
        filter: blur(12px);
      }
      .shadow {
        position: absolute; left: 1960px; top: 811px; width: 880px; height: 64px;
        background:
          radial-gradient(ellipse 46% 46% at 50% 40%, rgba(0,0,0,.96) 0%, rgba(0,0,0,.72) 34%, rgba(0,0,0,0) 72%),
          radial-gradient(ellipse 54% 52% at 50% 44%, rgba(0,0,0,.78) 0%, rgba(0,0,0,.34) 48%, rgba(0,0,0,0) 80%);
        filter: blur(14px);
      }
      /* 软件主体：窗口外壳。铺软件底色，切片缝隙处不会透出背后背景。
         ⚠ 两件事都不能做：
         1) 不要写 will-change:transform —— 会让 Chrome 按布局尺寸给窗口建合成层，
            3D 投影超出该边界时下半部分被整块裁掉。
         2) 不要写 overflow:hidden —— 模块拆解"飞出画面"的 tween 会被它整块剪掉，
            看起来就是"在原点消失了"而不是飞出去。圆角裁切交给切片自己处理。 */
      .appwin {
        position: absolute; inset: 0;
        background: var(--appbg);
        border-radius: 12px;
        box-shadow:
          0 2px 6px rgba(0,0,0,.5),
          0 14px 34px rgba(0,0,0,.55),
          0 46px 90px rgba(0,0,0,.62),
          0 0 0 1px rgba(160,190,225,.14),
          0 -1px 0 0 rgba(200,225,255,.10) inset;
      }
      .pt { position: absolute; display: block; }
      /* 侧栏贴着窗口左缘和上下缘，自己带圆角（父层不再 overflow:hidden） */
      .pt-sb  { left: 0;                top: 0;                width: calc(440px * var(--s));  height: calc(2100px * var(--s)); border-radius: 12px 0 0 12px; }
      .pt-main{ left: calc(455px * var(--s));  top: calc(75px * var(--s));   width: calc(2215px * var(--s)); height: calc(1350px * var(--s)); }
      .pt-s02 { left: calc(2680px * var(--s)); top: calc(75px * var(--s));   width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s12 { left: calc(2680px * var(--s)); top: calc(755px * var(--s));  width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s20 { left: calc(455px * var(--s));  top: calc(1435px * var(--s)); width: calc(1075px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s21 { left: calc(1540px * var(--s)); top: calc(1435px * var(--s)); width: calc(1130px * var(--s)); height: calc(670px * var(--s)); }
      .pt-s22 { left: calc(2680px * var(--s)); top: calc(1435px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s)); }

      .ph {
        position: absolute; display: flex; align-items: center; justify-content: center;
        border-radius: 4px;
        background: repeating-linear-gradient(45deg, rgba(255,255,255,.022) 0 10px, transparent 10px 20px);
        /* ⚠ 这里**不能**写 will-change —— 见 .appwin 上方的说明。 */
      }
      .ph:after { content: ""; position: absolute; inset: 6px; border: 1px dashed rgba(131,131,145,.42); border-radius: 3px; }
      .ph span { position: relative; z-index: 2; font-size: 10px; font-weight: 600; color: rgba(184,189,197,.72); }

      /* ---------- 标题层（固定在屏幕上）---------- */
      .t1 { position: absolute; left: 118px; top: 452px; will-change: transform, opacity; }
      .t1 .n { font-size: 84px; font-weight: 700; letter-spacing: -.01em; line-height: 1; }
      .t1 .s { margin-top: 16px; font-size: 30px; font-weight: 600; letter-spacing: .18em; color: var(--text3); }
      .t1 .bar { width: 76px; height: 3px; background: var(--accent); margin-top: 22px; transform-origin: 0 50%; }

      .t2 {
        position: absolute; left: 0; right: 0; top: 452px; text-align: center;
        font-size: 78px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1;
        will-change: transform, opacity;
      }
      .t2 b { color: var(--accent); }

      /* ---------- 星光层（叠在保留下来的软件窗口壳上，不换纯黑背景）----------
         全部用 opacity / transform 做补间，星点位置写死（渲染必须确定性）。 */
      .stars { position: absolute; inset: 0; pointer-events: none; }
      .stars i {
        position: absolute; border-radius: 50%; background: #fff;
        box-shadow: 0 0 6px 1px rgba(196,228,255,.92), 0 0 16px 5px rgba(0,161,214,.34);
      }
      .stars .neb {
        position: absolute; left: 50%; top: 512px; width: 1700px; height: 940px;
        margin: -470px 0 0 -850px;
        background:
          radial-gradient(ellipse 38% 40% at 50% 50%, rgba(0,161,214,.22) 0%, rgba(74,132,220,.10) 46%, rgba(0,0,0,0) 74%),
          radial-gradient(ellipse 22% 26% at 22% 30%, rgba(140,205,255,.13) 0%, rgba(0,0,0,0) 70%),
          radial-gradient(ellipse 20% 24% at 80% 68%, rgba(190,150,255,.11) 0%, rgba(0,0,0,0) 70%);
      }
      /* 四芒星：一横一竖两道光束 */
      .stars .fl { position: absolute; width: 0; height: 0; }
      .stars .fl::before, .stars .fl::after {
        content: ""; position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
      }
      .stars .fl::before {
        width: 72px; height: 1.5px;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(232,246,255,.95) 50%, rgba(255,255,255,0));
      }
      .stars .fl::after {
        width: 1.5px; height: 72px;
        background: linear-gradient(180deg, rgba(255,255,255,0), rgba(232,246,255,.95) 50%, rgba(255,255,255,0));
      }
      .stars .fl.s::before { width: 42px; }
      .stars .fl.s::after  { height: 42px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="18-01-intro" data-start="0" data-duration="12" data-width="1920" data-height="1080">
        <div class="world" id="world">
          <img class="bg" id="bg" src="assets/real/bg-hall.jpg" alt="">
          <div class="vignette" id="vignette"></div>

          <!-- ⚠ 光晕与影子必须是 .world 的直接子层，且**不得溢出 .world**。
               放在参与 3D 的 .appstage 里、或向上溢出父层，都会让 Chrome 用错误的
               边界做 3D 裁切，把软件画面的下半部分整块切掉。 -->
          <div class="glow" id="glow"></div>
          <div class="shadow" id="shadow"></div>

          <div class="appstage" id="appstage">
            <!-- 软件主体（窗口外壳，拆解后保留） -->
            <div class="appwin" id="appwin">
              <img class="pt pt-sb"   id="pSb"   src="assets/real/real-sidebar.png" alt="">
              <img class="pt pt-main" id="pMain" src="assets/real/real-main.png" alt="">
              <img class="pt pt-s02"  id="pS02"  src="assets/real/real-s02.png" alt="">
              <img class="pt pt-s12"  id="pS12"  src="assets/real/real-s12.png" alt="">
              <img class="pt pt-s20"  id="pS20"  src="assets/real/real-s20.png" alt="">
              <img class="pt pt-s21"  id="pS21"  src="assets/real/real-s21.png" alt="">
              <img class="pt pt-s22"  id="pS22"  src="assets/real/real-s22.png" alt="">
              <div class="ph" id="phMain" style="left: calc(455px * var(--s)); top: calc(75px * var(--s)); width: calc(2215px * var(--s)); height: calc(1350px * var(--s));"><span>[素材: 主画面]</span></div>
              <div class="ph" id="phS02" style="left: calc(2680px * var(--s)); top: calc(75px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
              <div class="ph" id="phS12" style="left: calc(2680px * var(--s)); top: calc(755px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
              <div class="ph" id="phS20" style="left: calc(455px * var(--s)); top: calc(1435px * var(--s)); width: calc(1075px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
              <div class="ph" id="phS21" style="left: calc(1540px * var(--s)); top: calc(1435px * var(--s)); width: calc(1130px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
              <div class="ph" id="phS22" style="left: calc(2680px * var(--s)); top: calc(1435px * var(--s)); width: calc(1155px * var(--s)); height: calc(670px * var(--s));"><span>[素材]</span></div>
            </div>
          </div>
        </div>

      <div class="t1" id="t1">
        <div class="n">DD监控室CE</div>
        <div class="s">多窗口直播监控</div>
        <div class="bar" id="t1bar"></div>
      </div>

      <div class="stars" id="stars">
        <div class="neb"></div>
        <i style="left: 214px;  top: 168px;  width: 3px;   height: 3px;"></i>
        <i style="left: 402px;  top: 92px;   width: 2px;   height: 2px;"></i>
        <i style="left: 618px;  top: 214px;  width: 2.5px; height: 2.5px;"></i>
        <i style="left: 846px;  top: 118px;  width: 2px;   height: 2px;"></i>
        <i style="left: 1088px; top: 246px;  width: 3px;   height: 3px;"></i>
        <i style="left: 1314px; top: 128px;  width: 2px;   height: 2px;"></i>
        <i style="left: 1560px; top: 268px;  width: 2.5px; height: 2.5px;"></i>
        <i style="left: 1742px; top: 152px;  width: 2px;   height: 2px;"></i>
        <i style="left: 268px;  top: 706px;  width: 2.5px; height: 2.5px;"></i>
        <i style="left: 486px;  top: 848px;  width: 2px;   height: 2px;"></i>
        <i style="left: 742px;  top: 938px;  width: 3px;   height: 3px;"></i>
        <i style="left: 1206px; top: 924px;  width: 2px;   height: 2px;"></i>
        <i style="left: 1436px; top: 836px;  width: 2.5px; height: 2.5px;"></i>
        <i style="left: 1690px; top: 720px;  width: 2px;   height: 2px;"></i>
        <i style="left: 158px;  top: 384px;  width: 2px;   height: 2px;"></i>
        <i style="left: 1806px; top: 452px;  width: 2.5px; height: 2.5px;"></i>
        <b class="fl"   style="left: 356px;  top: 296px;"></b>
        <b class="fl s" style="left: 1524px; top: 596px;"></b>
        <b class="fl s" style="left: 962px;  top: 156px;"></b>
      </div>

      <div class="t2" id="t2">向您介绍 <b>DDMonitorCE</b></div>
    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
        var EASE_IO = "cubic-bezier(0.77, 0, 0.175, 1)";

        /* 摄像机滑轨缓动。不要 ease-in-out 那种「慢—猛冲—慢」的对称曲线，
           要的是「很短的起步加速 + 中间严格匀速 + 很短的收尾减速」。
           k = 两端各自的平滑比例，其余区间严格线性。 */
        function makeRail(k) {
          var v = 1 / (1 - k);
          return function (p) {
            if (p <= 0) return 0;
            if (p >= 1) return 1;
            if (p < k) return v * p * p / (2 * k);
            if (p > 1 - k) { var q = 1 - p; return 1 - v * q * q / (2 * k); }
            return v * (p - k / 2);
          };
        }
        gsap.registerEase("rail", makeRail(0.17));

        /* 画面中心在世界 x = 1900 + 500 = 2400；推到 1440 时正好落到画布中心 960 */
        var DOLLY = 1440;

        /* ---- 基线 ---- */
        gsap.set("#world", { x: 0, z: 0 });
        gsap.set("#t1", { opacity: 0, x: -70 });
        gsap.set("#t1bar", { scaleX: 0 });
        gsap.set("#t2", { opacity: 0, y: 26 });
        gsap.set("#glow", { opacity: 0 });
        gsap.set("#shadow", { opacity: 0 });
        gsap.set("#stars", { opacity: 0 });
        gsap.set("#stars i, #stars .neb, #stars .fl", { opacity: 0 });
        /* 起初略低于相机：俯视，能看到软件顶面。
           transformPerspective 直接写进元素的 transform，等价于父层透视，
           但不会引入 preserve-3d 上下文（那会把窗口下半部分裁掉）。 */
        gsap.set("#appstage", { transformPerspective: 2000, rotationX: -15, y: 74, scale: 0.94 });
        /* 拆解飞出的切片各自也要透视，z 才有近大远小 */
        gsap.set(".pt, .ph", { transformPerspective: 1000 });
        gsap.set("#appwin", { opacity: 1, scale: 1, z: 0 });
        gsap.set("#vignette", { opacity: 1 });

        /* ====== 0.0–5.4 摄像机沿滑轨向右匀速推移（前半段的主体，占大半时长）====== */
        tl.fromTo("#glow",   { opacity: 0 }, { opacity: 1, duration: 2.6, ease: EASE_OUT, immediateRender: false }, 0.30);
        tl.fromTo("#shadow", { opacity: 0 }, { opacity: 1, duration: 2.6, ease: EASE_OUT, immediateRender: false }, 0.42);

        tl.fromTo("#world", { x: 0 },
          { x: -DOLLY, duration: 5.40, ease: "rail", immediateRender: false }, 0);

        /* 俯视 → 放平（画面被"看清"的过程） */
        tl.fromTo("#appstage", { rotationX: -15, y: 74, scale: 0.94 },
          { rotationX: 0, y: 0, scale: 1, duration: 3.20, ease: "rail", immediateRender: false }, 1.90);
        /* 光晕/影子在 .world 里独立存在，跟随同一个落定节奏（中心 x 都是 2400） */
        tl.fromTo("#glow",   { y: 74, scale: 0.94 }, { y: 0, scale: 1, duration: 3.20, ease: "rail", immediateRender: false }, 1.90);
        tl.fromTo("#shadow", { y: 74, scale: 0.94 }, { y: 0, scale: 1, duration: 3.20, ease: "rail", immediateRender: false }, 1.90);

        /* 左侧标题：浮现 → **画面露出约一半时**（rail 曲线下约 t=1.95s）隐去 */
        tl.fromTo("#t1", { opacity: 0, x: -70 },
          { opacity: 1, x: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 0.32);
        tl.fromTo("#t1bar", { scaleX: 0 },
          { scaleX: 1, duration: 0.40, ease: EASE_OUT, immediateRender: false }, 0.60);
        tl.to("#t1", { opacity: 0, x: -48, duration: 0.46, ease: EASE_OUT, immediateRender: false }, 1.90);

        /* ============ 5.4–6.9 居中后：相机向前推进（带弹性回稳）============ */
        tl.to("#appstage", { z: 230, duration: 1.50, ease: "elastic.out(1, 0.62)", immediateRender: false }, 5.40);
        tl.to("#glow",   { opacity: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 5.55);
        tl.to("#shadow", { opacity: 0, duration: 0.55, ease: EASE_OUT, immediateRender: false }, 5.55);

        /* ====== 6.9–8.9 模块分散拆解 · 飞出画面（保留软件主体）======
           每个模块都给 x/y 位移 —— 只做 z+opacity 会看起来"在原地消失"，而不是飞出去。 */
