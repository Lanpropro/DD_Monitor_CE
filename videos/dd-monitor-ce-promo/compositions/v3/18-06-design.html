<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="assets/lib/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Microsoft YaHei UI"; font-weight: 400; src: local("Microsoft YaHei UI"), local("Microsoft YaHei"); }
    @font-face { font-family: "Microsoft YaHei UI"; font-weight: 600 700; src: local("Microsoft YaHei UI Bold"), local("Microsoft YaHei Bold"); }
    @font-face { font-family: "Microsoft YaHei"; font-weight: 400; src: local("Microsoft YaHei"); }
    @font-face { font-family: "Microsoft YaHei"; font-weight: 600 700; src: local("Microsoft YaHei Bold"); }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #222428; color: #f1f2f5; font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
    .act { position: absolute; inset: 0; overflow: hidden; }
    .tag { font-size: 24px; font-weight: 700; letter-spacing: .08em; }
    .hint { font-size: 22px; font-weight: 600; }
    #aFollow { background: #222428; }
    #camera { position: absolute; left: 120px; top: 100px; width: 1680px; height: 945px; transform-origin: 0 0; box-shadow: 0 35px 100px #0008; }
    #camera video { display: block; width: 100%; height: 100%; object-fit: cover; }
    .topline { position: absolute; left: 118px; right: 118px; top: 50px; height: 2px; background: #00a1d6; }
    #followHead { position: absolute; left: 120px; top: 70px; padding: 15px 25px; background: #222428e8; border: 2px solid #00a1d6; border-radius: 8px; font-size: 33px; font-weight: 700; }
    #followBadge { position: absolute; right: 120px; top: 72px; padding: 13px 20px; background: #222428e8; border: 2px solid #a7b0bd; border-radius: 99px; font-size: 22px; }
    #focusFrame { position: absolute; left: 652px; top: 260px; width: 616px; height: 490px; border: 5px solid #00a1d6; box-shadow: 0 0 0 999px #07112044; pointer-events: none; opacity: 0; }
    #focusFrame:before, #focusFrame:after { content: ""; position: absolute; width: 28px; height: 28px; background: #00a1d6; }
    #focusFrame:before { left: -5px; top: -5px; } #focusFrame:after { right: -5px; bottom: -5px; }
    #followCount { position: absolute; left: 120px; bottom: 74px; width: 225px; height: 75px; padding: 10px 25px; background: #222428eb; border-left: 7px solid #00a1d6; font-size: 38px; font-weight: 700; }
    .count { position: absolute; left: 25px; top: 10px; opacity: 0; }
    #pullCaption { position: absolute; left: 120px; bottom: 70px; font-size: 76px; font-weight: 700; opacity: 0; text-shadow: 0 4px 16px #000b; }
    #aReplay { background: #f7f8fa; color: #20242c; }
    #replayHead { position: absolute; left: 115px; top: 21px; font-size: 58px; font-weight: 700; }
    #replaySub { position: absolute; left: 440px; top: 46px; font-size: 25px; color: #606b78; }
    #replayPanel { position: absolute; left: 115px; top: 105px; width: 1690px; height: 950px; background: #24272d; border: 2px solid #343a43; border-radius: 18px; box-shadow: 0 35px 70px #13254433; overflow: hidden; }
    #replayPanel video { display: block; width: 100%; height: 100%; object-fit: contain; }
    #replayBadge { position: absolute; right: 115px; top: 30px; padding: 9px 18px; border: 2px solid #6c7582; border-radius: 99px; color: #56616e; font-size: 20px; font-weight: 700; }
    #aInfo { background: #222428; }
    #infoSoftware { position: absolute; left: 930px; top: 175px; width: 930px; height: 635px; overflow: hidden; border: 2px solid #4a535d; border-radius: 15px; background: #1d2023; box-shadow: 0 20px 60px #0006; opacity: 0; }
    #infoSoftware:before { content: ""; position: absolute; inset: 0; background: url("assets/rec/06-layout-placeholder.jpg") center / cover; filter: grayscale(1) brightness(.38) blur(1px); }
    .info { position: absolute; left: 145px; top: 120px; width: 1010px; z-index: 2; }
    .sectionLabel { color: #00a1d6; font-size: 23px; font-weight: 700; letter-spacing: .14em; }
    #feedbackTitle { margin-top: 16px; font-size: 92px; font-weight: 700; }
    #channels { margin-top: 20px; font-size: 41px; font-weight: 700; }
    #human { margin-top: 14px; font-size: 29px; color: #b3bdca; }
    #infoDivider { width: 900px; height: 3px; margin-top: 43px; background: #00a1d6; transform-origin: left; }
    #aboutTitle { margin-top: 28px; font-size: 50px; font-weight: 700; }
    .legal { margin-top: 17px; max-width: 995px; font-size: 29px; line-height: 1.5; color: #d0d5dd; }
    #credit { color: #a8b1bd; font-size: 27px; }
    .arcs { position: absolute; right: 70px; top: 140px; width: 730px; height: 730px; opacity: .95; }
    .arcs circle { fill: none; stroke: #00a1d6; stroke-width: 7; }
    .arcs .muted { stroke: #aebdcc; stroke-width: 3; opacity: .5; }
    .arcs .arc1 { stroke-dasharray: 440 800; } .arcs .arc2 { stroke-dasharray: 570 1000; }
    .arcs .arc3 { stroke-dasharray: 760 1300; } .arcs .arc4 { stroke-dasharray: 940 1580; }
    .arcs .core { fill: #00a1d6; stroke: none; }
    #aWall { background: #121519; }
    #wallCol { position: absolute; left: 170px; top: 0; width: 1580px; will-change: transform; }
    .wallPanel { width: 1580px; height: 972px; margin-bottom: 12px; background: #090b0e; border: 8px solid #1a1e23; box-shadow: 0 16px 38px #0008; overflow: hidden; }
    .wallPanel video { display: block; width: 100%; height: 100%; object-fit: cover; }
    #wallBadge { position: absolute; left: 125px; top: 85px; padding: 14px 22px; background: #222428ed; border: 2px solid #00a1d6; border-radius: 6px; font-size: 23px; font-weight: 700; }
    #black { position: absolute; inset: 0; background: #000; opacity: 0; }
  </style>
</head>
<body>
<div id="root" data-composition-id="18-06-design" data-start="0" data-duration="27.4" data-width="1920" data-height="1080">
  <div class="act" id="aFollow">
    <div id="camera" data-layout-allow-overflow><video id="followVideo" src="assets/rec/06-follow-recorded.mp4" muted playsinline data-start="0" data-duration="6.8"></video></div>
    <div id="focusFrame"></div><div class="topline"></div>
    <div id="followHead">录屏 · 逐格查看</div>
    <div id="followBadge">1+5 真实操作 · 镜头随点击推进</div>
    <div id="followCount"><span class="count" id="count1">01 / 06</span><span class="count" id="count2">02 / 06</span><span class="count" id="count3">03 / 06</span><span class="count" id="count4">04 / 06</span><span class="count" id="count5">05 / 06</span><span class="count" id="count6">06 / 06</span></div>
    <div id="pullCaption">六路都在视野里</div>
  </div>
  <div class="act" id="aReplay" style="opacity:0">
    <div id="replayHead">即时重放</div>
    <div id="replaySub">短片段与长片段，在同一条时间轨上找到目标画面</div>
    <div id="replayBadge">PR 页面真实录屏</div>
    <div id="replayPanel">
      <video id="replayVideo" src="assets/rec/06-replay-recorded.mp4" muted playsinline data-start="7.04" data-duration="7.5"></video>
    </div>
  </div>
  <div class="act" id="aInfo" style="opacity:0">
    <div id="infoSoftware" aria-hidden="true"></div>
    <div class="info">
      <div class="sectionLabel">DD MONITOR CE · CONTACT</div>
      <div id="feedbackTitle">反馈问题</div>
      <div id="channels">评论区 · 私信 · GitHub</div>
      <div id="human">牛马大学生在线修 bug</div>
      <div id="infoDivider"></div>
      <div id="aboutTitle">关于项目</div>
      <div class="legal" id="legal1">视频内软件为演示效果，请以实际为准</div>
      <div class="legal" id="legal2">本项目是 DD监控室的二次开发版本，是个人维护的第三方工具</div>
      <div class="legal" id="credit">原作者：执明神君，@神君Channel</div>
    </div>
    <svg class="arcs" viewBox="0 0 730 730" aria-hidden="true">
      <circle class="arc1" cx="365" cy="365" r="120" />
      <circle class="arc2 muted" cx="365" cy="365" r="185" />
      <circle class="arc3" cx="365" cy="365" r="255" />
      <circle class="arc4 muted" cx="365" cy="365" r="325" />
      <circle class="core" cx="365" cy="365" r="14" />
    </svg>
  </div>
  <div class="act" id="aWall" style="opacity:0">
    <div id="wallCol" data-layout-allow-overflow>
      <div class="wallPanel"><video id="wallA" src="assets/rec/06-wall-a.mp4" muted playsinline data-start="21" data-duration="6.4"></video></div>
      <div class="wallPanel"><video id="wallB" src="assets/rec/06-wall-b.mp4" muted playsinline data-start="21" data-duration="6.4"></video></div>
      <div class="wallPanel"><video id="wallC" src="assets/rec/06-wall-c.mp4" muted playsinline data-start="21" data-duration="6.4"></video></div>
    </div>
    <div id="wallBadge">真实九格画面墙</div>
    <div id="black"></div>
  </div>
</div>
<script>
  (() => {
    const tl = gsap.timeline({ paused: true });
    const ease = "power3.out";
    const poses = [
      { x: 600, y: 340, scale: 1.55 },
      { x: 1360, y: 255, scale: 2.15 },
      { x: 1360, y: 535, scale: 2.15 },
      { x: 350, y: 780, scale: 2.15 },
      { x: 900, y: 780, scale: 2.15 },
      { x: 1360, y: 780, scale: 2.15 },
    ];
    const beatTimes = [.72, 1.55, 2.38, 3.21, 4.04, 4.87];
    gsap.set("#focusFrame", { opacity: 0, scale: .96 });
    gsap.set("#replayPanel", { y: 120, opacity: 0, scale: .96 });
    gsap.set(["#replayHead", "#replayBadge"], { opacity: 0 });
    gsap.set(["#feedbackTitle", "#channels", "#human", "#aboutTitle", "#legal1", "#legal2", "#credit"], { y: 20, opacity: 0 });
    gsap.set("#infoDivider", { scaleX: 0 });
    gsap.set("#infoSoftware", { x: 34 });
    gsap.set("#wallCol", { y: 1100 });
    for (let i = 0; i < poses.length; i++) {
      const p = poses[i], at = beatTimes[i], s = p.scale;
      tl.to("#camera", { x: 840 - s * p.x, y: 440 - s * p.y, scale: s, duration: .34, ease: "power2.inOut" }, at);
      tl.to("#focusFrame", { opacity: .9, scale: 1, duration: .16, ease }, at + .1);
      tl.to("#focusFrame", { opacity: .18, duration: .24 }, at + .34);
      tl.set(".count", { opacity: 0 }, at);
      tl.set("#count" + (i + 1), { opacity: 1 }, at + .001);
    }
    tl.to("#focusFrame", { opacity: 0, duration: .2 }, 5.28);
    tl.to("#followCount", { opacity: 0, duration: .18 }, 5.4);
    tl.to("#camera", { x: 185, y: 95, scale: .78, duration: 1.2, ease: "power3.inOut" }, 5.42);
    tl.to("#pullCaption", { opacity: 1, y: -15, duration: .42, ease }, 5.68);
    tl.to("#aFollow", { opacity: 0, duration: .45 }, 7.02);
    tl.to("#aReplay", { opacity: 1, duration: .42 }, 6.92);
    tl.to(["#replayHead", "#replayBadge"], { opacity: 1, duration: .24 }, 7.38);
    tl.to("#replayPanel", { y: 0, opacity: 1, scale: 1, duration: .68, ease }, 7.04);
    tl.to("#aReplay", { opacity: 0, duration: .38 }, 14.62);
    tl.to("#aInfo", { opacity: 1, duration: .38 }, 14.78);
    tl.to("#infoSoftware", { opacity: .42, x: 0, duration: .7, ease }, 15.0);
    const reveal = (selector, at, duration = .42) => tl.to(selector, { y: 0, opacity: 1, duration, ease }, at);
    reveal("#feedbackTitle", 15.0, .55);
    reveal("#channels", 15.48);
    reveal("#human", 15.92);
    tl.to("#infoDivider", { scaleX: 1, duration: .65, ease }, 16.78);
    reveal("#aboutTitle", 17.25);
    reveal("#legal1", 17.75);
    reveal("#legal2", 18.3);
    reveal("#credit", 18.85);
    tl.to(".arc1", { rotation: 18, transformOrigin: "50% 50%", duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 15.0);
    tl.to(".arc2", { rotation: -14, transformOrigin: "50% 50%", duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 15.0);
    tl.to(".arc3", { rotation: 11, transformOrigin: "50% 50%", duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 15.0);
    tl.to(".arc4", { rotation: -8, transformOrigin: "50% 50%", duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 15.0);
    tl.to("#aInfo", { opacity: 0, duration: .38 }, 20.72);
    tl.to("#aWall", { opacity: 1, duration: .32 }, 20.96);
    tl.to("#wallCol", { y: 150, duration: 1.45, ease: "back.out(0.8)" }, 21.15);
    tl.to("#wallCol", { y: -730, duration: 2.1, ease: "sine.inOut" }, 22.6);
    tl.to("#wallBadge", { opacity: 0, duration: .4 }, 23.5);
    tl.to("#wallCol", { y: -1650, duration: 2.25, ease: "power2.inOut" }, 24.71);
    tl.to("#black", { opacity: 1, duration: .42 }, 26.98);
    tl.to({}, { duration: .01 }, 27.39);
    window.__timelines = window.__timelines || {};
    window.__timelines["18-06-design"] = tl;
    tl.seek(0);
  })();
</script>
</body>
</html>
