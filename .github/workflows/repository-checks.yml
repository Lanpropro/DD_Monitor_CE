name: Repository checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'function/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository policy and required files
        run: python dev/run_checks.py --suite repository
      - name: Show failed check logs
        if: failure()
        shell: pwsh
        run: Get-ChildItem work/checks -Recurse -Filter *.log | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName }
      - name: Compile application sources
        run: python -m compileall -q ddm blivedm main.py
      - name: Check diff formatting
        run: git diff --check

  smoke:
    name: Functional smoke
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Install verified libmpv runtime
        shell: pwsh
        run: |
          $source = Get-Content ddm/assets/licenses/libmpv-SOURCE.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $source.asset
          Invoke-WebRequest -Uri $source.url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $source.sha256) {
            throw 'libmpv archive checksum mismatch'
          }
          & 7z e $archive libmpv-2.dll "-o$env:GITHUB_WORKSPACE" -y
          if ($LASTEXITCODE -ne 0) { throw 'libmpv extraction failed' }
          if ((Get-FileHash -LiteralPath libmpv-2.dll -Algorithm SHA256).Hash.ToLower() -ne $source.dll_sha256) {
            throw 'libmpv DLL checksum mismatch'
          }
      - name: Build check-process native stack capture
        # The optional helper records native module offsets without suppressing
        # exceptions, changing GC, retrying cases or altering application startup.
        shell: cmd
        run: |
          call dev\checks\build_native_crash.cmd
          if errorlevel 1 exit /b 1
          echo DDM_CHECK_NATIVE_STACK_DLL=%CD%\work\check-native-crash.dll>>"%GITHUB_ENV%"
      - name: Check native stack capture preserves failures
        run: python dev/selfcheck_check_runner.py CheckRunnerTests.test_native_stack_capture_preserves_exception_and_exit_code
      - name: Run isolated functional smoke
        run: python dev/run_checks.py --suite smoke --timeout 300
      - name: Install verified FFmpeg for native checks
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1-full_build.7z'
          $directory = Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-full_build.7z' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ine 'e5bbf665b9a43219d97a15c2dd2cdeb9b11bcb689d88a2177c4f754b4e20f793') {
            throw 'FFmpeg archive checksum mismatch'
          }
          & 7z e $archive 'ffmpeg-7.1.1-full_build/bin/ffmpeg.exe' "-o$directory" -y
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $directory 'ffmpeg.exe'))) {
            throw 'FFmpeg extraction failed'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $directory -Encoding utf8
      - name: Check native picture-in-picture lifecycle and picker
        run: |
          python dev/run_checks.py --script selfcheck_picture_in_picture --timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The picker runs its native cases serially in fresh Qt processes.
          python dev/run_checks.py --script selfcheck_pip_picker --timeout 240
      - name: Check native badge redraw memory
        run: python dev/run_checks.py --script selfcheck_badge_memory
      - name: Check native sidebar drag hit testing
        env:
          DDM_NO_SAVE: '1'
          DDM_CHECK_MODE: offline
          QT_QPA_PLATFORM: windows
        run: |
          python dev/checks/bootstrap.py dev/selfcheck_sidebar_hit_test.py SidebarHitTests.test_native_ghost_is_excluded_without_hiding_it_or_using_qt_masks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_SCALE_FACTOR = '1.5'
          python dev/checks/bootstrap.py dev/selfcheck_sidebar_hit_test.py SidebarHitTests.test_native_ghost_is_excluded_without_hiding_it_or_using_qt_masks
      - name: Check deferred native output and offline paints
        env:
          DDM_NO_SAVE: '1'
          DDM_CHECK_MODE: offline
          QT_QPA_PLATFORM: windows
        run: |
          python dev/checks/bootstrap.py dev/selfcheck_player_lifetime.py PlayerLifetimeTests.test_normal_player_opens_output_only_when_local_media_is_ready
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/checks/bootstrap.py dev/selfcheck_startup_windows.py StartupWindowsTests.test_offline_tiles_clear_state_without_reentrant_paint_delivery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_SCALE_FACTOR = '1.5'
          python dev/checks/bootstrap.py dev/selfcheck_player_lifetime.py PlayerLifetimeTests.test_normal_player_opens_output_only_when_local_media_is_ready
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/checks/bootstrap.py dev/selfcheck_startup_windows.py StartupWindowsTests.test_offline_tiles_clear_state_without_reentrant_paint_delivery
      - name: Check native preview window isolation
        env:
          DDM_NO_SAVE: '1'
          DDM_CHECK_MODE: offline
          QT_QPA_PLATFORM: windows
        run: |
          python dev/checks/bootstrap.py dev/selfcheck_startup_windows.py StartupWindowsTests.test_preview_native_window_keeps_other_cards_alien
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_SCALE_FACTOR = '1.5'
          python dev/checks/bootstrap.py dev/selfcheck_startup_windows.py StartupWindowsTests.test_preview_native_window_keeps_other_cards_alien
      # Synthetic native children, no media, accounts, activation or mouse input.
      - name: Check native video clipping lifecycle
        run: python dev/run_checks.py --script selfcheck_resize_surface
      - name: Check native wall border ownership
        env:
          DDM_NO_SAVE: '1'
          DDM_CHECK_MODE: offline
          QT_QPA_PLATFORM: windows
        run: |
          python dev/checks/bootstrap.py dev/selfcheck_wall_border.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_SCALE_FACTOR = '1.5'
          python dev/checks/bootstrap.py dev/selfcheck_wall_border.py
      - name: Show smoke logs
        if: always()
        shell: pwsh
        run: Get-ChildItem work/checks -Recurse -Filter *.log | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName }
