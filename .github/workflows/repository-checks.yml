name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'function/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository policy and required files
        run: python -m unittest dev.selfcheck_repository_files dev.selfcheck_project_workflow
      - name: Compile application sources
        run: python -m compileall -q ddm blivedm main.py
      - name: Check diff formatting
        run: git diff --check
