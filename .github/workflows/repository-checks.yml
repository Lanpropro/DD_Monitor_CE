name: Repository checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'function/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: Native Python ${{ matrix.python-version }} build and deterministic checks
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fixed native development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build and import the Release extension
        shell: pwsh
        run: powershell -File dev/build_native_danmaku.ps1 -Python (Get-Command python.exe).Source -SkipTests
      - name: Run deterministic native engine checks
        run: python -m cmake --build work/native-build --config Release --target engine_tests
      - name: Execute deterministic CTest engine checks
        shell: pwsh
        run: |
          $ctest = python -c "import pathlib,cmake; print(pathlib.Path(cmake.CMAKE_BIN_DIR)/'ctest.exe')"
          & $ctest --test-dir work/native-build -C Release -R '^engine$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check new Python modules and offline raster
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $nativePython = (Get-Command python.exe).Source
          python -m pyright --pythonpath $nativePython ddm/native_danmaku.py ddm/danmaku_raster.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check ddm/native_danmaku.py ddm/danmaku_raster.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/selfcheck_danmaku_raster.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified libmpv for bridge checks
        run: python dev/fetch_mpv.py
      - name: Check native host shutdown and fallback bridge
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python dev/checks/bootstrap.py dev/selfcheck_native_danmaku_bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QT_QPA_PLATFORM = "windows"
          python dev/checks/bootstrap.py dev/selfcheck_native_danmaku_bridge.py --window-contract

  repository:
    name: Repository checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository policy and required files
        run: python dev/run_checks.py --suite repository
      - name: Show failed check logs
        if: failure()
        shell: pwsh
        run: Get-ChildItem work/checks -Recurse -Filter *.log | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName }
      - name: Compile application sources
        run: python -m compileall -q ddm blivedm main.py
      - name: Check diff formatting
        run: git diff --check

  smoke:
    name: Functional smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Install verified libmpv runtime
        shell: pwsh
        run: |
          $source = Get-Content ddm/assets/licenses/libmpv-SOURCE.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $source.asset
          Invoke-WebRequest -Uri $source.url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $source.sha256) {
            throw 'libmpv archive checksum mismatch'
          }
          & 7z e $archive libmpv-2.dll "-o$env:GITHUB_WORKSPACE" -y
          if ($LASTEXITCODE -ne 0) { throw 'libmpv extraction failed' }
          if ((Get-FileHash -LiteralPath libmpv-2.dll -Algorithm SHA256).Hash.ToLower() -ne $source.dll_sha256) {
            throw 'libmpv DLL checksum mismatch'
          }
      - name: Run isolated functional smoke
        run: python dev/run_checks.py --suite smoke --timeout 120
      - name: Show smoke logs
        if: always()
        shell: pwsh
        run: Get-ChildItem work/checks -Recurse -Filter *.log | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName }
