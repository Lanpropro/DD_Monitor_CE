name: Repository checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'function/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.9
          git -C "$RUNNER_TEMP/flutter" checkout 3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve mobile dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Check mobile formatting and analysis
        working-directory: mobile
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --no-pub
      - name: Run offline mobile tests
        working-directory: mobile
        run: flutter test --no-pub

  repository:
    name: Repository checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check repository policy and required files
        run: python dev/run_checks.py --suite repository
      - name: Show failed check logs
        if: failure()
        shell: pwsh
        run: Get-ChildItem work/checks -Recurse -Filter *.log | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName }
      - name: Compile application sources
        run: python -m compileall -q ddm blivedm main.py
      - name: Check diff formatting
        run: git diff --check

  smoke:
    name: Functional smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Install verified libmpv runtime
        shell: pwsh
        run: |
          $source = Get-Content ddm/assets/licenses/libmpv-SOURCE.json -Raw | ConvertFrom-Json
          $archive = Join-Path $env:RUNNER_TEMP $source.asset
          Invoke-WebRequest -Uri $source.url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne $source.sha256) {
            throw 'libmpv archive checksum mismatch'
          }
          & 7z e $archive libmpv-2.dll "-o$env:GITHUB_WORKSPACE" -y
          if ($LASTEXITCODE -ne 0) { throw 'libmpv extraction failed' }
          if ((Get-FileHash -LiteralPath libmpv-2.dll -Algorithm SHA256).Hash.ToLower() -ne $source.dll_sha256) {
            throw 'libmpv DLL checksum mismatch'
          }
      - name: Run isolated functional smoke
        run: python dev/run_checks.py --suite smoke --timeout 120
      - name: Check native badge redraw memory
        run: python dev/run_checks.py --script selfcheck_badge_memory
      - name: Show smoke logs
        if: always()
        shell: pwsh
        run: Get-ChildItem work/checks -Recurse -Filter *.log | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName }
