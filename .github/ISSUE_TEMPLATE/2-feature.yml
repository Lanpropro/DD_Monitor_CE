name: 功能与优化建议
description: 提出新功能、交互改进或性能优化建议。
title: "[功能建议] "
labels: ["enhancement", "待确认"]
body:
  - type: markdown
    attributes:
      value: 感谢分享想法！请说明实际使用场景和想解决的问题，已有相同建议时可在原 Issue 补充。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前不便
      placeholder: 在什么场景下需要这个功能？现在遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的功能或改进
      placeholder: 描述希望的操作流程与结果；性能建议可说明具体卡顿的操作。
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考与补充（可选）
      description: 可以附上示意图、其他软件的参考链接或目前的替代方法。请先遮挡图片中的个人信息。
    validations:
      required: false
