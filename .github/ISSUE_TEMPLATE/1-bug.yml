name: 问题反馈
description: 报告播放、弹幕、界面、录制或其他异常，偶发问题也欢迎反馈。
title: "[问题反馈] "
labels: ["bug", "待确认"]
body:
  - type: markdown
    attributes:
      value: |
        有诊断包时，版本、系统、插件和设置无需重复填写。偶发或暂时无法复现也可以反馈。
        附件请先检查个人信息，不要上传密码、Cookie 或账号文件。
  - type: textarea
    id: actual
    attributes:
      label: 问题描述
      placeholder: 简述出现的异常和期望结果；知道复现步骤时可一并说明。诊断包中写过的细节无需重复。
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 诊断包、截图或视频（可选）
      description: 拖入文件或粘贴附件链接，一般反馈无需启动专项。没有诊断包时，可在问题描述中补充软件版本与相关环境。
    validations:
      required: false
