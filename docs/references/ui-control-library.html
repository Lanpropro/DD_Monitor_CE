<title>DD 监控室 · 控件库设计稿</title>
<link rel="stylesheet" href="ui-control-playground.css">
<style>

.segment-example{display:grid;justify-items:center;gap:9px}

.segment-example .indicator{position:absolute;inset-block:4px;left:4px;width:calc((100% - 11px)/2);background:var(--tint);border-radius:5px;box-shadow:0 1px 4px var(--shadow);pointer-events:none;z-index:-1;transform:translateX(0);transition:none}
.segment-example .segment button{min-height:31px;padding:4px 11px;background:transparent;border-color:transparent;font-weight:600}.segment-example .segment button[aria-pressed=true]{color:var(--accent);background:transparent;font-weight:700}

.segment-label{color:var(--muted);font-size:11px}
.example-tools{margin-bottom:12px}.example-tools .filters{display:inline-flex;flex-wrap:nowrap}.example-usage{font-size:13px;color:#415777;background:#f7f9fc;border:1px solid #dce6f3;border-radius:10px;padding:15px}.example-usage p+p{margin-top:9px}
.example-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:15px 0 0}.example-notes div{border-top:1px solid #dde6f2;padding-top:8px}.example-notes dt{font-size:12px;font-weight:650;color:#243a5d}.example-notes dd{margin:3px 0 0;color:#536884;font-size:12px}
.mini-details{width:100%;min-width:0;font-size:11px;color:var(--ink)}.mini-details summary{cursor:pointer}.mini-details > div{margin-top:4px}.curve{width:90px;height:36px;color:var(--accent);overflow:visible}.chip{display:inline-flex;gap:4px;padding:3px 6px;border-radius:5px;background:var(--tint);color:var(--accent);font-size:11px}.chip.error{background:var(--danger-bg);color:var(--danger)}.color-dot{width:15px;height:15px;background:#739bfd;border-radius:100%;display:block}.ellipsis{max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:11px}.soft{color:var(--muted);font-size:11px}.short-input{min-width:0;width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:5px 6px}
.draft-dialog{width:min(340px,calc(100% - 40px));max-width:none;padding:18px;border-radius:13px;border:1px solid var(--line);color:var(--ink);background:var(--surface);box-shadow:0 14px 42px var(--shadow)}.draft-dialog::backdrop{background:#131d337a}.draft-dialog[open]{animation:dialog-in .16s ease-out}@keyframes dialog-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.draft-dialog h4{font-size:17px;margin:0}.draft-dialog p{color:var(--muted);font-size:13px;margin:6px 0 16px}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}.swatch-row{display:flex;align-items:center;gap:9px;padding:8px;background:var(--bg);border-radius:7px;font:12px Consolas,monospace}.swatch-row input{width:34px;height:24px;border:0;background:transparent;padding:0}.vertical-demo{display:grid;gap:6px;justify-items:center}.mini-empty{text-align:center}.mini-empty svg{color:var(--muted);margin-bottom:2px}.mini-empty strong{display:block;font-size:11px}.mini-empty .btn{min-height:24px;margin-top:6px;padding:2px 6px}

<body>
<header class="mast"><div class="wrap head">
  <div class="brand"><img src="../../assets/logo.svg" alt="">DD 监控室</div>
  <label class="lab-global-motion">
    <span>滑动分段指示器</span>
    <span class="lab-switch"><input id="segment-motion" type="checkbox" role="switch"><span class="lab-track" aria-hidden="true"></span></span>
  </label>
</div></header>
<main class="wrap">
<div class="intro"><div><h1>控件图鉴</h1><p>直接试用来自设置页和播放格的控件，打开详情调参数。</p></div>
<div class="top-nav" role="tablist" aria-label="设计稿视图">
<button role="tab" id="tab-overview" aria-controls="overview" aria-selected="true">控件总览</button><button role="tab" id="tab-library" aria-controls="library" aria-selected="false" tabindex="-1">候选试样</button><button role="tab" id="tab-pages" aria-controls="pages" aria-selected="false" tabindex="-1">页面对照</button><button role="tab" id="tab-states" aria-controls="states" aria-selected="false" tabindex="-1">按钮状态</button>
</div></div>
<section id="overview" role="tabpanel" aria-labelledby="tab-overview" data-theme-mode="dark">
<div class="qt-toolbar">
<p id="playground-context">软件在用控件与组合</p>
<nav class="lab-group-links" aria-label="控件分组"></nav>
<div class="filters" role="group" aria-label="预览主题"><button type="button" data-qt-theme="dark" aria-pressed="true">深色</button><button type="button" data-qt-theme="light" aria-pressed="false">浅色</button></div>
</div>
<div id="qt-gallery"></div>
<article id="playground-detail" aria-labelledby="playground-name" hidden></article>
</section>
<section id="pages" role="tabpanel" aria-labelledby="tab-pages" hidden>
<div class="section-head"><h2>常规设置设计稿</h2><p>同一配置 · 深浅主题同时预览</p></div>
<div id="settings-pair" class="pair"></div>
<div class="section-head"><h2>播放格设计稿</h2><div class="scenario" role="group" aria-label="播放状态">
<button data-scenario="playing" aria-pressed="true">播放中</button><button data-scenario="loading" aria-pressed="false">连接中</button><button data-scenario="error" aria-pressed="false">播放失败</button>
</div></div>
<div id="player-pair" class="pair"></div>
<p class="section-notes">播放画面取自项目截图。切换状态可检查文字、遮罩以及重试反馈。<a class="note-link" href="../assets/screenshots/overview1_Landscape_mode.png">画面来源</a></p>
</section>
<section id="library" role="tabpanel" aria-labelledby="tab-library" hidden>
<div class="catalog-layout">
